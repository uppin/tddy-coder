# cargo-nextest configuration.
#
# `default` is a bare `cargo nextest run` locally. `ci` is what GitHub Actions
# runs (.github/workflows/ci.yml). The `ci` profile differs in three ways, all of
# them consequences of the runner being an unprivileged Linux container:
#
#   1. It writes JUnit XML, so the PR check reports pass/fail counts rather than
#      just a red or green dot.
#   2. It never fail-fasts. A bare `cargo test` aborts at the first failing
#      target, so most of the workspace never runs and the visible failure count
#      badly understates what went unrun.
#   3. It skips tests that cannot pass without root or without macOS. See
#      `default-filter` below.
#
# Keep the skip list short, and give every entry a reason. Everything listed
# there is coverage the PR gate does not provide.
#
# CI runs the suite as two checks, split by what a test needs to run rather than by how long it
# takes: `Rust tests` and `Rust e2e tests`. The e2e set — tests that need real infrastructure, a
# LiveKit server in Docker, a live rust-analyzer or a real tddy-supervisor / index-daemon / daemon /
# coder process — is written once, in `.config/rust-e2e.filterset`. ci.yml hands each leg that
# expression or its complement with `-E`, which nextest ANDs with the `default-filter` below, so the
# exclusions apply to both. A test that starts a real LiveKit server, drives a live rust-analyzer or
# execs one of those processes belongs in that file; a test that only builds the thing in process
# does not.

[profile.default]
retries = 0

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

# Retried tests are reported as "flaky", not hidden. Retries were added for a port race between
# per-test LiveKit containers; the e2e leg now runs every LiveKit test against one shared server
# (LIVEKIT_TESTKIT_WS_URL), so that reason is gone.
# TODO(parallel-livekit): decide retries from measured flake rate
retries = { backoff = "exponential", count = 2, delay = "5s", jitter = true }

# Tests excluded from the PR gate, by reason:
#
#   sandboxed_cursor_cli_acceptance, sandboxed_claude_cli_acceptance,
#   action_sandbox_acceptance::sandboxed_bash_action_writes_to_output_dir,
#   cursor_cli_session_acceptance::cursor_cli_sandbox_start_succeeds_...
#     The cgroups sandbox backend needs root and a writable cgroup root. It
#     reports itself available on any Linux, then EPERMs at spawn, so these fail
#     rather than skip. Running them needs a root runner or the QEMU backend.
#
#
#   sandbox_runner_stdio_acceptance::echoes_a_message_over_sandbox_service_served_over_stdio
#     Fails on an unprivileged runner with "tool ipc server exited before bind"
#     even with tddy-sandbox-runner built — confirmed on CI, survived two
#     retries. The other two tests in this binary pass, so only this one is
#     skipped. Tracked in docs/dev/todo/2026-08-15-echoes-a-message-over-sandbox-service-served-over-stdio-is-skipped-in.md; the intended fix is a VM-backed job
#     with a fully controlled environment rather than a permanent exclusion.
#
#   tddy-sandbox-recipes cursor_agent_prerequisite_reads_include_install_dir_and_share_root
#     Asserts `/Users` appears among path-traversal ancestors, which is only true
#     on macOS. Permanent failure on Linux, not a flake.
default-filter = """
not (
    (package(tddy-daemon) and binary(sandboxed_cursor_cli_acceptance))
    or (package(tddy-daemon) and binary(sandboxed_claude_cli_acceptance))
    or (package(tddy-daemon) and binary(action_sandbox_acceptance) and test(=sandboxed_bash_action_writes_to_output_dir))
    or (package(tddy-daemon) and binary(cursor_cli_session_acceptance) and test(=cursor_cli_sandbox_start_succeeds_when_sandbox_backend_available))
    or (package(tddy-daemon-sandbox) and binary(sandbox_runner_stdio_acceptance) and test(=echoes_a_message_over_sandbox_service_served_over_stdio))
    or (package(tddy-sandbox-recipes) and test(=cursor_cli::tests::cursor_agent_prerequisite_reads_include_install_dir_and_share_root))
)
"""

[profile.ci.junit]
path = "junit.xml"

[test-groups]
# The live-rust-analyzer acceptance suites. Indexing is the contended resource, not a port: two
# servers loading a crate graph while a `cargo check` runs beside them is how a bounded indexing
# budget expires on a runner that is otherwise fine. A binary earns its place here by spawning
# rust-analyzer, so the list is derivable rather than a record of past failures. Within one binary
# the harness holds the same line with a lock, for a plain `cargo test`, which never reads this file.
rust-analyzer = { max-threads = 1 }

# On the default profile rather than `ci`: the load sensitivity belongs to the suite, not to the
# runner, and a profile that does not override a group inherits it.
[[profile.default.overrides]]
filter = """
package(tddy-code-restructuring) and (
    binary(move_module_to_crate_acceptance)
    or binary(rename_cross_file_acceptance)
    or binary(import_pass_acceptance)
    or binary(extract_method_signature_acceptance)
    or binary(impl_seam_acceptance)
    or binary(test_module_reference_acceptance)
    or binary(index_health_acceptance)
    or binary(extract_method_control_flow_acceptance)
    or binary(extract_variable_acceptance)
    or binary(unlinked_file_acceptance)
)
"""
test-group = "rust-analyzer"

# The binaries that bring up (or join) a LiveKit server, for the `slow-timeout` below. They run in
# parallel: each test joins the one shared server under a unique room, so there is no port race left
# for a serial group to prevent. `scripts/nextest-docker-group.test.ts` fails if any binary that
# starts `tddy-livekit-testkit` is put back in a `docker` group.
#
# The binaries listed by name alone at the end of the filter either moved out of the package named
# in their entry when the daemon was carved up (so a qualified entry matches nothing) or were never
# listed. `.config/rust-e2e.filterset` carries the same names.
[[profile.ci.overrides]]
filter = """
(
    package(tddy-livekit)
    or package(tddy-livekit-testkit)
    or (package(tddy-daemon) and (
        binary(common_room_duplicate_identity_repro)
        or binary(common_room_set_metadata_handshake_repro)
        or binary(forward_to_peer_shared_registry)
        or binary(livekit_peer_daemons_acceptance)
        or binary(multi_host_acceptance)
        or binary(relay_e2e_acceptance)
        or binary(remote_git_livekit_acceptance)
        or binary(remote_managed_worktree_cross_host_acceptance)
        or binary(session_agent_remote_acceptance)
        or binary(session_attach_cross_host_acceptance)
        or binary(session_room_acceptance)
        or binary(session_room_cross_host_acceptance)
        or binary(session_room_livekit_acceptance)
        or binary(split_session_resume_acceptance)
        or binary(staging_forwarding_acceptance)
    ))
    or (package(tddy-daemon-rpc) and binary(session_room_exec_tool_acceptance))
    or (package(tddy-coder) and (
        binary(coder_publishes_session_metadata_to_participant)
        or binary(coder_serves_connection_service_from_participant)
    ))
    or (package(tddy-e2e) and (
        binary(livekit_terminal_rpc)
        or binary(terminal_service_livekit)
        or binary(token_generation_livekit)
        or binary(token_service_livekit)
    ))
    or binary(common_room_duplicate_identity_repro)
    or binary(common_room_set_metadata_handshake_repro)
    or binary(common_room_key_trust_acceptance)
    or binary(forward_to_peer_shared_registry)
    or binary(forwarded_rpc_is_stamped_by_the_receiver)
    or binary(livekit_peer_daemons_acceptance)
    or binary(remote_git_livekit_acceptance)
    or binary(runtime_signing_identity_acceptance)
    or binary(session_room_acceptance)
    or binary(session_room_livekit_acceptance)
    or binary(session_sync_livekit_acceptance)
    or (package(tddy-daemon) and binary(first_login_enrolment_acceptance))
)
"""
# A test blocked on a LiveKit server that died stops being slow and starts being stuck; without this
# it waits for the job's 150-minute limit. Terminated tests are reported by name.
# Sized from a green e2e run's JUnit (run 37222869563, 820f86aa): the slowest single test took 39.8 s
# and the next 20.2 s, so a test still running after 3 minutes (4.5x the slowest) is stuck, not slow.
slow-timeout = { period = "60s", terminate-after = 3 }
