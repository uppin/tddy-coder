name: Automerge

# Comment on a pull request to merge it — squashed — without going back to the
# GitHub UI. See docs/dev/guides/ci.md § Automerge.
#
#   #automerge         merge when the required checks pass
#   #automerge-cancel  disarm it again
#   #forcemerge        merge now, past red or still-running checks
#
# Two things this workflow depends on, both configured on the repo rather than
# here: `Allow auto-merge` must be on, and the `master` ruleset must require the
# four ci.yml checks. Native auto-merge is a *queue for a blocked PR* — with
# nothing required, a PR is mergeable the instant it opens and GitHub rejects
# the request with "Pull request is in clean status". `#forcemerge` needs no
# ruleset bypass: the ruleset requires its checks from the GitHub Actions app,
# which is the app GITHUB_TOKEN acts as, so the force path completes each
# required check that has not passed with a run that says who forced it, then
# merges normally. See docs/dev/guides/ci.md § Automerge.

on:
  issue_comment:
    types: [created, edited]

# `issue_comment` fires on issues too, and the comment body is attacker-supplied
# on a public repo. Both are filtered in the job's `if:` and by the write-access
# check below; the token itself gets only what merging needs.
permissions:
  contents: write
  pull-requests: write
  # write: `#forcemerge` completes the required checks it merges past.
  checks: write

jobs:
  automerge:
    name: Merge on comment
    # `github.event.issue.pull_request` is null on plain issues.
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '#automerge') ||
       contains(github.event.comment.body, '#forcemerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The comment author is not necessarily a collaborator. `author_association`
      # is not a permission — an org member with no access to this repo still
      # reports MEMBER — so ask for the actual permission level.
      #
      # `#forcemerge` is held to the same bar rather than a higher one on
      # purpose: the repo is owned by a different account than the people who
      # work in it, so an admin-only force merge would be usable by nobody.
      - name: Require write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          level=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" \
                    --jq .permission 2>/dev/null || echo none)
          echo "$ACTOR has '$level' permission"
          case "$level" in
            admin|write|maintain) ;;
            *) echo "::error::$ACTOR lacks write access; ignoring the merge request"
               exit 1 ;;
          esac

      - name: Merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          # Via env, never inlined into the script — a comment body is untrusted
          # input and `${{ }}` interpolation would splice it into the shell.
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # Longest match first: '#automerge-cancel' contains '#automerge'.
          if grep -qF -- '#automerge-cancel' <<<"$BODY"; then
            mode=cancel
          elif grep -qF -- '#forcemerge' <<<"$BODY"; then
            mode=force
          else
            mode=auto
          fi
          echo "mode: $mode"

          case "$mode" in
            cancel)
              gh pr merge "$PR" --repo "$REPO" --disable-auto
              echo "reaction=eyes" >> "$GITHUB_OUTPUT"
              echo "Auto-merge disabled for #$PR"
              ;;

            force)
              # Merging past a gate is worth a trace that outlives the run log,
              # so record who asked and what the checks actually said, on the PR
              # itself. The check state is read before anything changes, and the
              # trace is posted only once the merge went through — a failed
              # attempt must not leave a "Force-merged" claim on an open PR.
              checks=$(gh pr checks "$PR" --repo "$REPO" 2>&1 || true)
              read -r head base < <(gh pr view "$PR" --repo "$REPO" \
                --json headRefOid,baseRefName --jq '"\(.headRefOid) \(.baseRefName)"')

              # The base's ruleset requires its checks from the GitHub Actions
              # app — the app this token acts as. Each required check that has
              # not passed on the head gets a completed run naming who forced
              # it; it is then the latest run of that name, which is what the
              # ruleset reads. Nothing is bypassed silently: the run's summary,
              # the PR comment and this log all say it was forced.
              required=$(gh api "repos/$REPO/rules/branches/$base" \
                --jq '[.[] | select(.type == "required_status_checks")
                       | .parameters.required_status_checks[].context] | unique | .[]')
              forced=()
              while IFS= read -r ctx; do
                [ -n "$ctx" ] || continue
                latest=$(gh api "repos/$REPO/commits/$head/check-runs" \
                  -f check_name="$ctx" -X GET \
                  --jq '.check_runs | sort_by(.started_at) | last | .conclusion // ""')
                [ "$latest" = success ] && continue
                gh api -X POST "repos/$REPO/check-runs" \
                  -f name="$ctx" -f head_sha="$head" \
                  -f status=completed -f conclusion=success \
                  -f "output[title]=Forced by @$ACTOR via #forcemerge" \
                  -f "output[summary]=Not built. @$ACTOR force-merged #$PR ($COMMENT_URL); the run this replaces concluded '${latest:-none}'." \
                  --jq '"forced \(.name) on \(.head_sha[0:9])"'
                forced+=("$ctx")
              done <<< "$required"

              # The ruleset is re-evaluated asynchronously after a check run
              # lands, so the first merge attempt can still see the old state.
              merged=no
              for attempt in 1 2 3 4 5 6; do
                if merge_out=$(gh pr merge "$PR" --repo "$REPO" --squash 2>&1); then
                  merged=yes; break
                fi
                echo "attempt $attempt: $merge_out"
                sleep 10
              done
              if [ "$merged" != yes ]; then
                gh pr comment "$PR" --repo "$REPO" --body "$(cat <<EOF
          ❌ [\`#forcemerge\`]($COMMENT_URL) by @$ACTOR did **not** merge this PR.

          \`\`\`
          $merge_out
          \`\`\`
          EOF
          )"
                exit 1
              fi
              gh pr comment "$PR" --repo "$REPO" --body "$(cat <<EOF
          ⚠️ **Force-merged** by @$ACTOR via [\`#forcemerge\`]($COMMENT_URL), bypassing the required checks${forced:+ (completed as forced: ${forced[*]})}.

          Check state at merge time:

          \`\`\`
          $checks
          \`\`\`
          EOF
          )"
              echo "reaction=hooray" >> "$GITHUB_OUTPUT"
              echo "Force-merged #$PR"
              ;;

            auto)
              # Which merge to ask for is not a preference — auto-merge is a
              # queue for a *blocked* PR, and asking to queue one that has
              # nothing left to wait for is an error, not a no-op.
              #
              # The question is deliberately put to the checks API and not to
              # `mergeStateStatus`. That field answers "is this blocked *for
              # you*", and once the Actions app is a bypass actor the answer for
              # this token stops being the answer for the ruleset — which would
              # silently turn every `#automerge` into a force merge. `gh pr
              # checks --required` reports the checks themselves: exit 0 when
              # every required one has passed, non-zero while any is pending or
              # failing.
              if gh pr checks "$PR" --repo "$REPO" --required; then
                gh pr merge "$PR" --repo "$REPO" --squash
                echo "Merged #$PR — the required checks were already green"
              else
                gh pr merge "$PR" --repo "$REPO" --squash --auto
                echo "Auto-merge armed for #$PR; it merges when the required checks pass"
              fi
              echo "reaction=rocket" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Acknowledge on the comment itself, so the requester can tell the
      # difference between "done" and "the workflow never fired".
      - name: React to the comment
        if: always() && steps.merge.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: ${{ steps.merge.outputs.reaction || 'confused' }}
        run: |
          gh api --silent -X POST \
            "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content="$REACTION"
