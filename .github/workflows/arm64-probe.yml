name: arm64 runner probe

# Answers one question that documentation does not: what a GitHub-hosted arm64
# runner can actually do for this project.
#
# Two capabilities, and they are independent:
#
#   1. Building aarch64-linux binaries. Native on this runner, so no builder VM
#      and no cross toolchain — the reason the builder guest exists is that a
#      macOS host cannot emit Linux ELF, which is not a constraint here.
#   2. Booting an aarch64 guest under KVM, which the VM tests need. That depends
#      on nested virtualisation being exposed, and is the part worth measuring
#      rather than assuming.
#
# Dispatch-only and cheap. Delete it once the answer is written down in
# docs/dev/guides/ci.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: arm64 capabilities
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Host facts
        run: |
          echo "arch:    $(uname -m)"
          echo "kernel:  $(uname -r)"
          echo "cpus:    $(nproc)"
          free -h || true
          df -h / | tail -1

      # The same udev rule and the same read-write open the x86_64 legs use, so
      # a yes here means yes for the VM tests specifically, not in general.
      - name: Can this runner open /dev/kvm?
        run: |
          ls -l /dev/kvm 2>&1 || echo "no /dev/kvm node at all"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm 2>&1 || true
          if ( exec 3<>/dev/kvm ) 2>/dev/null; then
            echo "RESULT: /dev/kvm is openable read-write — accelerated aarch64 guests are possible"
          else
            echo "RESULT: /dev/kvm is NOT openable — guests would fall back to TCG"
          fi

      - name: Does QEMU accept KVM here?
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-utils >/dev/null
          qemu-system-aarch64 --version | head -1
          echo "accelerators: $(qemu-system-aarch64 -accel help | tr '\n' ' ')"
          # Asks QEMU to actually initialise the accelerator, which is the claim
          # that matters; -version would answer even with no virtualisation.
          if timeout 30 qemu-system-aarch64 -machine virt,accel=kvm -cpu host \
               -nographic -no-reboot -kernel /dev/null 2>&1 | head -5; then
            echo "(exit above is expected — /dev/null is not a kernel; what matters is whether accel=kvm was rejected)"
          fi

      - name: Native aarch64 build
        run: |
          rustc -vV | sed -n 's/^host: /rustc host: /p'
          cargo build -p tddy-vm --quiet 2>&1 | tail -5 || true
          echo "built on: $(uname -m)"
