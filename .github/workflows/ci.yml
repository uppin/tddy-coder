name: CI

# Every PR gets a build, a lint pass, and a test run with per-test pass/fail
# counts reported back as check runs. See docs/dev/guides/ci.md for how to query
# results from a terminal or an agent.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# One run per PR. A new push cancels the run still in flight rather than
# queueing behind it — the older result is worthless once the branch moves.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # action-junit-report publishes the test check runs

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is the bulk of target/, and the runner only has ~14 GB of
  # guaranteed disk. Line tables keep file:line in backtraces at a fraction of
  # the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # rust-build is the sole writer; see the comment there

      # Only master writes the Rust cache. PRs read master's copy, which keeps
      # the repo under GitHub's 10 GB cache budget instead of every branch
      # evicting every other branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo fmt
        run: ./dev cargo fmt --all -- --check

      - name: cargo clippy
        run: ./dev cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    needs: rust-build
    # The first run on a cold cache builds 57 crates including libwebrtc. Later
    # runs restore master's cache and finish in a fraction of this.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # rust-build is the sole writer; see the comment there

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # nextest builds the test targets itself. What it cannot produce is a
      # binary belonging to another workspace package, which suites like
      # sandbox_runner_stdio_acceptance exec by path — those come from the
      # `Rust build` check.
      - name: Fetch test fixture binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-fixture-bins
          path: fixture-bins

      - name: Install fixture binaries into target/debug
        # Artifacts are zipped without permissions, so everything arrives 0644.
        run: |
          find fixture-bins -type f -exec chmod +x {} +
          mkdir -p target/debug/examples
          find fixture-bins -maxdepth 1 -type f -exec cp -p {} target/debug/ \;
          find fixture-bins/examples -maxdepth 1 -type f -exec cp -p {} target/debug/examples/ \;

      - name: cargo nextest
        id: nextest
        # Keep going on failure so the JUnit report still publishes; the report
        # step below is what fails the job.
        continue-on-error: true
        run: ./dev cargo nextest run --workspace --profile ci --locked

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Rust tests
          detailed_summary: true
          fail_on_failure: true
          require_tests: true

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-rust
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  rust-build:
    name: Rust build
    runs-on: ubuntu-latest
    # Runs first. Both test checks depend on it, because several suites exec
    # workspace binaries rather than linking them, and jobs get separate
    # runners — the only way to share a built binary is to publish it.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # The only job that writes the nix cache. A single writer means no two
      # jobs can race to save the same key — previously this job and rust-lint
      # ran concurrently and both tried.
      #
      # `purge` is deliberately off. GitHub already evicts caches LRU past the
      # 10 GB budget and drops entries untouched for 7 days, so purging is a
      # racier version of what the platform does for free.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          save: ${{ github.ref == 'refs/heads/master' }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo build
        run: ./dev cargo build --workspace --bins --examples --locked

      # Binaries that tests exec by path, not all of target/debug — the whole
      # directory is many GB. Each belongs to a package other than the one whose
      # tests run it, so cargo never builds them as a side effect of those
      # tests, and `CARGO_BIN_EXE_*` is unset for them. The list is everything
      # matched by `grep -r 'target/debug/' packages/*/tests`; if you add a test
      # that shells out to a workspace binary, add it here too.
      #
      # Stripped because these are execution fixtures; nothing reads symbols.
      - name: Stage test fixture binaries
        run: |
          mkdir -p fixture-bins/examples
          for b in tddy-coder tddy-tools tddy-daemon tddy-demo tddy-demo-tui \
                   tddy-acp-stub tddy-sandbox-runner; do
            cp "target/debug/$b" fixture-bins/
          done
          cp target/debug/examples/echo_server fixture-bins/examples/
          strip fixture-bins/* fixture-bins/examples/* 2>/dev/null || true
          du -sh fixture-bins

      - name: Upload test fixture binaries
        uses: actions/upload-artifact@v7
        with:
          name: rust-fixture-bins
          path: fixture-bins
          if-no-files-found: error
          retention-days: 1

      # The deployment set the VM chain leg installs: the five binaries
      # `recipes::deployed_binaries` names, plus the files `./install` reads out
      # of a checkout, flat and under the staged names
      # `BuiltBinaries::from_dist_dir` expects. The AppArmor profile is renamed
      # rather than flattened under its own basename, which would land on top of
      # the tddy-daemon binary.
      #
      # Debug binaries, deliberately. `./release` is a bare `cargo build
      # --release` with no features or flags and no `[profile.release]` section
      # behind it; `./install` never inspects what it installs; and the leg
      # asserts wiring — the unit, the privilege drop, the daemon serving — none
      # of which changes with opt-level. Compiling the workspace a second time in
      # release bought none of that.
      - name: Stage the deployment set
        run: |
          mkdir -p dist
          for b in tddy-supervisor tddy-daemon tddy-coder tddy-tools tddy-sandbox-runner; do
            cp "target/debug/$b" dist/
          done
          cp install daemon.yaml.production supervisor.yaml.production dist/
          cp packages/tddy-daemon/apparmor/tddy-daemon dist/apparmor-tddy-daemon
          strip dist/tddy-* 2>/dev/null || true
          du -sh dist

      - name: Upload the deployment set
        uses: actions/upload-artifact@v7
        with:
          name: tddy-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust-build-arm64:
    name: Rust build (arm64)
    runs-on: ubuntu-24.04-arm
    # The same build on the other architecture this project ships to. Native, not
    # emulated: GitHub's arm64 Linux runners are free for public repositories, and
    # `rustc` there is aarch64-unknown-linux-gnu, so nothing is cross-compiled.
    #
    # It builds and nothing more. The VM tests cannot run here — an arm64 hosted
    # runner has no /dev/kvm node at all, so a guest would fall back to TCG and take
    # hours (measured, see docs/dev/guides/ci.md).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Keyed on the architecture as well as the OS. `runner.os` is "Linux" on both,
      # so sharing the x86_64 job's key would restore a store full of the wrong
      # architecture's paths — useless here, and a race to save over each other.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G
          save: ${{ github.ref == 'refs/heads/master' }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-arm64
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: cargo build
        run: ./dev cargo build --workspace --bins --examples --locked

  web:
    name: Web tests
    runs-on: ubuntu-latest
    needs: rust-build
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # tddy-livekit-web's specs exec examples/echo_server against a Docker
      # LiveKit server.
      - name: Fetch test fixture binaries
        uses: actions/download-artifact@v7
        with:
          name: rust-fixture-bins
          path: fixture-bins

      - name: Install fixture binaries into target/debug
        run: |
          find fixture-bins -type f -exec chmod +x {} +
          mkdir -p target/debug/examples
          find fixture-bins -maxdepth 1 -type f -exec cp -p {} target/debug/ \;
          find fixture-bins/examples -maxdepth 1 -type f -exec cp -p {} target/debug/examples/ \;

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # rust-build is the sole writer; see the comment there

      # Cypress drives a bundled Electron, which needs these at runtime. Bun and
      # node still come from the nix shell.
      - name: Install Cypress runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: bun install
        run: ./dev bun install --frozen-lockfile

      - name: Build web bundle
        run: ./dev bun run build

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          mkdir -p reports/junit
          ./dev bun run --filter tddy-web test:unit:ci

      - name: Transport package tests
        id: transports
        continue-on-error: true
        run: |
          # Run both suites even if the first fails, so one broken package does
          # not hide the other's results.
          status=0
          ./dev bun run --filter tddy-rpc-web test:ci || status=1
          ./dev bun run --filter tddy-tauri-web test:ci || status=1
          exit $status

      - name: Component tests
        id: component
        continue-on-error: true
        run: |
          mkdir -p reports/junit
          # Run both suites even if the first fails, so one broken package does
          # not hide the other's results from the report.
          status=0
          ./dev bun run --filter tddy-web cypress:component:ci || status=1
          ./dev bun run --filter tddy-livekit-web cypress:component:ci || status=1
          exit $status

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit/*.xml
          check_name: Web tests
          detailed_summary: true
          fail_on_failure: true
          require_tests: true

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-web
          path: reports/junit
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: packages/*/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # ── VM-backed production tests ───────────────────────────────────────────────
  #
  # The QEMU legs, gated on `Rust build` so they inherit its artifacts and never
  # boot a guest for a workspace that does not compile. They are **not** required
  # checks — that is a property of the branch ruleset's list of contexts, not of
  # which workflow file they live in. See docs/dev/guides/ci.md.
  vm-suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # `Rust build` publishes both the binaries this deploys and the compile that
    # proves the workspace builds at all — no point booting a guest if it failed.
    needs: rust-build
    # Per leg: the two cheap ones boot a guest, the chain bakes three images and
    # compiles the workspace inside one of them. 350 is under GitHub's 360-minute
    # ceiling for a hosted job, so the leg fails on its own timeout with logs
    # rather than being killed by the platform.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      # One suite's guest failing says nothing about the other's, and cancelling
      # the survivor would throw away the console transcript that explains it.
      fail-fast: false
      matrix:
        include:
          # The launcher itself: boot, serial console, 9p, SSH, graceful shutdown.
          - name: VM boot control
            slug: boot-control
            package: tddy-vm
            test_binary: vm_boot_control_acceptance
            # No filter: the whole suite is the check.
            filter: ""
            expected_passing: 6
            timeout_minutes: 90
          # The bake, used rather than inspected: cloud-init bakes a prepared
          # base, a VM is created from it, and the guest is logged into over
          # SSH. Deliberately one test — its two siblings in the same binary
          # inspect the artifact instead of booting it, so they cost a second
          # bake each and prove less than this one does.
          - name: Cloudinit VM boot
            slug: cloudinit-vm-boot
            package: tddy-vm
            test_binary: cloud_init_acceptance
            filter: "--exact a_baked_prepared_base_boots_as_a_vm_that_answers_over_ssh"
            expected_passing: 1
            timeout_minutes: 90
          # Cloud-init layers all the way to a serving daemon: bake tddy-nix-base,
          # bake the test host on top of it, install the binaries `Rust build`
          # produced with the real ./install --systemd --headless, and assert the
          # supervisor is active as root, the daemon dropped to its service
          # account, and the daemon answers on its own web port.
          - name: Cloudinit + nix + tddy
            slug: cloudinit-nix-tddy
            package: tddy-e2e
            test_binary: tddy_image_chain_acceptance
            filter: ""
            expected_passing: 1
            timeout_minutes: 90
    # The cloud image these boot. amd64 to match the x86_64 runner: VmArch::host()
    # reads std::env::consts::ARCH, and the guest image must match it.
    env:
      IMAGE_NAME: debian-12-genericcloud-amd64.qcow2
      IMAGE_BASE_URL: https://cloud.debian.org/images/cloud/bookworm/latest
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          # The chain's builder overlay carries a Nix store and a full release
          # `target/`; the preloaded Docker images are ~10 GB nothing here uses.
          sudo docker image prune -af || true
          df -h /

      # /dev/kvm exists on the runner image but is root:kvm 0660, so the runner
      # account can see it and not open it. tddy-vm tests openability, not
      # existence (packages/tddy-vm/src/vm.rs:72), and silently falls back to
      # TCG — which would not fail, it would blow the suite's 180s boot budget.
      - name: Grant access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Fail in seconds if virtualisation is unavailable, rather than after an
      # hour of TCG. This is the same read-write open the Rust code performs.
      - name: Require working KVM
        run: |
          ls -l /dev/kvm || true
          if ! ( exec 3<>/dev/kvm ) 2>/dev/null; then
            echo "::error::/dev/kvm is not openable read-write. The suite would fall back to TCG and time out."
            exit 1
          fi
          echo "/dev/kvm is openable — guests will run accelerated."

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # ci.yml's rust-build is the sole writer

      # Both legs compile the same crate, so they share one cache to restore
      # from — but only one may write it, or they race to save the same key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vm
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.slug == 'boot-control' }}

      # The testkit never downloads anything by design, so CI supplies the image
      # itself. Cached because it is 331 MB and Debian's mirrors are a courtesy.
      - name: Cache Debian cloud image
        id: image-cache
        uses: actions/cache@v6
        with:
          path: ~/vm-images
          key: debian-cloud-image-${{ env.IMAGE_NAME }}-v1

      - name: Download Debian cloud image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vm-images
          cd ~/vm-images
          curl -fsSL -O "${IMAGE_BASE_URL}/${IMAGE_NAME}"
          curl -fsSL -O "${IMAGE_BASE_URL}/SHA512SUMS"
          # `latest` moves, so verify against the checksums published beside it
          # rather than pinning a snapshot that eventually 404s.
          grep " ${IMAGE_NAME}\$" SHA512SUMS | sha512sum -c -
          rm -f SHA512SUMS

      # Only the leg that deploys them. `download-artifact` does not preserve the
      # executable bit; `TestHostVm::deploy` chmods everything in the guest after
      # the copy, which is where it has to happen anyway.
      - name: Fetch the deployable binaries
        if: matrix.slug == 'cloudinit-nix-tddy'
        uses: actions/download-artifact@v7
        with:
          name: tddy-dist
          path: dist

      - name: Run ${{ matrix.test_binary }}
        run: |
          set -o pipefail
          export TDDY_CLOUDINIT_BASE_IMAGE="$HOME/vm-images/${IMAGE_NAME}"
          # The fixtures put their images in a tempdir that is removed when the
          # test ends, taking the guest's console transcript with it. Redirect
          # the transcripts somewhere that outlives the run so they can be
          # uploaded — a guest failure is usually only explicable from its own
          # console, and there is no other way to see it from a runner.
          export TDDY_VM_CONSOLE_LOG_DIR="$GITHUB_WORKSPACE/vm-console-logs"
          # Empty for the legs that do not deploy; the test that needs it fails
          # loudly when it is unset rather than skipping.
          export TDDY_PREBUILT_DIST_DIR="$GITHUB_WORKSPACE/dist"
          # An unset or wrong path makes every test pass without booting, so
          # check before spending the runtime rather than after.
          test -f "$TDDY_CLOUDINIT_BASE_IMAGE" \
            || { echo "::error::base image missing at $TDDY_CLOUDINIT_BASE_IMAGE"; exit 1; }
          # Deliberately not `./vm-tests`, which runs all ten suites including
          # the multi-hour bake. --test-threads=1 is not optional: these bind
          # fixed host ports (2231-2236 for boot control, 2296-2297 for the
          # cloud-init boot, 2293-2294 for the Nix layer) and QEMU derives its
          # monitor socket path from the port alone.
          ./dev cargo test -p ${{ matrix.package }} --test ${{ matrix.test_binary }} \
            -- --ignored --nocapture --test-threads=1 ${{ matrix.filter }} \
            2>&1 | tee vm-tests.log

      # These tests now *fail* when the image variable is unset
      # (`require_base_image`), so a broken download or mistyped path is red at
      # the test rather than green here. The grep stays as a regression guard —
      # it matches the wording of the skip-and-return these tests used to do, so
      # reintroducing that pattern fails the job instead of quietly reporting a
      # check that booted nothing. The count is the assertion that carries.
      - name: Assert a guest was actually booted
        run: |
          if grep -q "skipping production test" vm-tests.log; then
            echo "::error::Tests skipped — TDDY_CLOUDINIT_BASE_IMAGE never reached them. This is a false green, not a pass."
            exit 1
          fi
          if ! grep -qE "test result: ok\. ${{ matrix.expected_passing }} passed" vm-tests.log; then
            echo "::error::Expected ${{ matrix.expected_passing }} passing tests from ${{ matrix.test_binary }}; the suite did not report them."
            exit 1
          fi
          echo "${{ matrix.expected_passing }} test(s) from ${{ matrix.test_binary }} ran against a real guest."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-${{ matrix.slug }}-logs
          # vm-tests.log is what the harness printed; vm-console-logs/ is what
          # each guest itself said, written by QEMU rather than by the test, so
          # it survives a guest that wedged before the test could read it.
          path: |
            vm-tests.log
            vm-console-logs/
          if-no-files-found: warn
          retention-days: 7
