name: Web package tests

# One JS workspace package's PR check, shared by every `web-<package>.yml` caller. Three jobs:
#
#   gate    → build-gate.yml: a draft skips the work, as every other check does
#   changes → scripts/web-affected.ts: does this run touch the package, or a workspace package it
#             depends on? Pushes to master and manual dispatches always say yes.
#   tests   → the package's build and test scripts, run only when both of the above say so
#
# A skipped job reports success, so an unaffected package's check is present and green rather than
# pending. See docs/dev/guides/ci.md § Web package checks.
#
# The tests job is named `<package> tests`, but GitHub prefixes a called workflow's jobs with the
# calling job's id: the check a PR shows is `web / <package> tests`, the same way `gate` shows as
# `gate / Draft build gate`. Required-check contexts are written with that prefix.

on:
  workflow_call:
    inputs:
      package:
        description: "The workspace package, by the name in its package.json"
        type: string
        required: true
      needs-web-bundle:
        description: >-
          Build tddy-web's bundle (packages/tddy-web/dist) before the tests. tddy-web's own tests run
          against it, and tddy-rust-typescript-tests serves it.
        type: boolean
        default: false
      needs-tddy-coder:
        description: >-
          Build the tddy-coder binary (target/debug/tddy-coder) before the tests. Its tests spawn it.
        type: boolean
        default: false
      needs-rust-fixture:
        description: >-
          Build the echo_server example (target/debug/examples/echo_server) before the tests.
          tddy-livekit-web's Cypress specs exec it.
        type: boolean
        default: false
      needs-livekit-image:
        description: "Pull the LiveKit server image before the tests, outside any Cypress task timeout."
        type: boolean
        default: false
      has-cypress:
        description: "Install Cypress's runtime libraries and run the package's cypress:component:ci."
        type: boolean
        default: false

permissions:
  contents: read
  checks: write # action-junit-report publishes the test check run
  pull-requests: read # the build gate reads a draft's comments for #forcebuild

env:
  # Incremental state and full debuginfo are per-crate scratch a one-shot CI build never reuses; see ci.yml.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  gate:
    uses: ./.github/workflows/build-gate.yml

  changes:
    name: Affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
    steps:
      # The diff needs history: the base commit of a pull request is not on the shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # one writer for the nix cache, not one per package check

      - name: Decide whether the package is affected
        id: detect
        env:
          PACKAGE: ${{ inputs.package }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range=(--base "$BASE" --head "$HEAD")
          else
            range=(--all)
          fi
          # The dev shell prints a banner on stdout, so only the decision line is kept.
          ./dev bun scripts/web-affected.ts --package "$PACKAGE" "${range[@]}" \
            | grep '^affected=' >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ inputs.package }} tests
    needs: [gate, changes]
    # A failed detection fails this check instead of skipping it: a skipped job reports success, so
    # a broken `changes` job would otherwise pass every package. A gate that decided not to build
    # still skips, as it does for every other check.
    if: ${{ always() && needs.gate.outputs.build == 'true' && (needs.changes.result == 'failure' || needs.changes.outputs.affected == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Stop when affected-package detection failed
        if: needs.changes.result == 'failure'
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          echo "::error::Could not decide whether $PACKAGE is affected; see the changes job's log."
          exit 1

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false # one writer for the nix cache, not one per package check

      - name: Build tddy-coder
        if: inputs.needs-tddy-coder
        run: ./dev cargo build --locked -p tddy-coder-cli --bin tddy-coder

      - name: Build the echo_server fixture
        if: inputs.needs-rust-fixture
        run: ./dev cargo build --locked -p tddy-livekit --example echo_server

      # Cypress drives a bundled Electron, which needs these at runtime. Bun and
      # node still come from the nix shell.
      - name: Install Cypress runtime libraries
        if: inputs.has-cypress
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Cache Cypress binary
        if: inputs.has-cypress
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: bun install
        # The Cypress binary is ~250 MB; only the packages that run Cypress need it.
        env:
          CYPRESS_INSTALL_BINARY: ${{ inputs.has-cypress && '1' || '0' }}
        run: ./dev bun install --frozen-lockfile

      - name: Build web bundle
        if: inputs.needs-web-bundle
        run: ./dev bun run --filter tddy-web build

      # tddy-livekit-web's livekitDockerTestkit.ts starts this image inside a
      # Cypress task whose 60s timeout also covered pulling it on a fresh
      # runner, and a slow pull failed both specs' `before all` hooks. Pulled
      # here, the task only starts the container. Keep the tag in step with
      # LIVEKIT_IMAGE in that file.
      - name: Pull the LiveKit image
        if: inputs.needs-livekit-image
        run: docker pull livekit/livekit-server:master

      - name: Prepare the report directory
        run: mkdir -p reports/junit

      # Every suite runs even if an earlier one fails, so one broken suite does not hide the others'
      # results. The final step fails the check on any failure.
      - name: Unit tests
        id: unit
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
        run: ./dev bun run --if-present --filter "$PACKAGE" test:ci

      - name: Component tests
        id: component
        if: inputs.has-cypress
        continue-on-error: true
        env:
          PACKAGE: ${{ inputs.package }}
          # FIXME(livekit-web-echo-server-hang): `startEchoServer` intermittently exceeds its 60 s
          # task timeout (seen on master at b73c97e0 and on other branches, same image digest). This
          # prints each phase of the testkit start so a failing run names the stalled one. Remove once
          # the hang is understood and fixed.
          DEBUG: ${{ inputs.package == 'tddy-livekit-web' && 'tddy:livekit-web:*' || '' }}
        run: ./dev bun run --filter "$PACKAGE" cypress:component:ci

      - name: Publish test report
        if: hashFiles('reports/junit/*.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit/*.xml
          check_name: ${{ inputs.package }} report
          detailed_summary: true
          fail_on_failure: true
          require_tests: true

      - name: Fail when a suite failed
        if: always() && (steps.unit.outcome == 'failure' || steps.component.outcome == 'failure')
        run: |
          echo "::error::A test suite failed; see the steps above."
          exit 1

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ inputs.package }}
          path: reports/junit
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-${{ inputs.package }}
          path: packages/${{ inputs.package }}/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
