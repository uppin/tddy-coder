name: Web tddy-livekit-rpc-web

# Runs this package's tests when a PR touches it or a workspace package it depends on
# (scripts/web-affected.ts); otherwise the check passes without running them. The work is in
# web-package.yml; see docs/dev/guides/ci.md § Web package checks.
# Its Cypress specs exec the echo_server example, which this check builds itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-tddy-livekit-rpc-web-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # action-junit-report publishes the test check run
  pull-requests: read # the build gate reads a draft's comments for #forcebuild

jobs:
  web:
    uses: ./.github/workflows/web-package.yml
    with:
      package: tddy-livekit-rpc-web
      needs-rust-fixture: true
      needs-livekit-image: true
      has-cypress: true
