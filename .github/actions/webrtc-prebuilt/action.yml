name: Prebuilt libwebrtc
description: >-
  Restore LiveKit's prebuilt libwebrtc from the Actions cache, downloading it (with retries) only on
  a miss, and point webrtc-sys at it through LK_CUSTOM_WEBRTC. Without this every cold build fetches
  ~150 MB from LiveKit's GitHub release, and a 504 there fails the build.

# The tag is the one webrtc-sys-build hard-codes (WEBRTC_TAG). scripts/webrtc-prebuilt.test.ts fails
# when Cargo.lock locks a different webrtc-sys-build than WEBRTC_SYS_BUILD_VERSION, so a bump has to
# revisit both values here.
#   WEBRTC_SYS_BUILD_VERSION: 0.3.18
#   WEBRTC_TAG: webrtc-51ef663

runs:
  using: composite
  steps:
    - name: Name the libwebrtc archive
      id: archive
      shell: bash
      env:
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        tag=webrtc-51ef663
        case "$RUNNER_ARCH_NAME" in
          X64) arch=x64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::No prebuilt libwebrtc for runner arch $RUNNER_ARCH_NAME"; exit 1 ;;
        esac
        triple="linux-$arch-release"
        dir="$HOME/.cache/livekit-webrtc/$tag"
        {
          echo "tag=$tag"
          echo "triple=$triple"
          echo "dir=$dir"
        } >> "$GITHUB_OUTPUT"

    - name: Restore libwebrtc
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.archive.outputs.dir }}/${{ steps.archive.outputs.triple }}
        key: webrtc-${{ steps.archive.outputs.tag }}-${{ steps.archive.outputs.triple }}

    - name: Download libwebrtc
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.archive.outputs.tag }}
        TRIPLE: ${{ steps.archive.outputs.triple }}
        DIR: ${{ steps.archive.outputs.dir }}
      run: |
        set -euo pipefail
        name="webrtc-$TRIPLE.zip"
        zip="$RUNNER_TEMP/$name"
        # Through the release-asset API, not the github.com/…/releases/download URL: that redirect
        # has answered 504 for hours while the API served the same asset. The release metadata
        # carries the asset's sha256, which the download is checked against.
        read -r asset_id digest < <(gh api "repos/livekit/rust-sdks/releases/tags/$TAG" \
          --jq ".assets[] | select(.name == \"$name\") | \"\\(.id) \\(.digest // \"\")\"")
        if [ -z "${asset_id:-}" ]; then
          echo "::error::livekit/rust-sdks release $TAG has no asset $name"; exit 1
        fi
        for attempt in 1 2 3 4 5; do
          if gh api -H "Accept: application/octet-stream" \
              "repos/livekit/rust-sdks/releases/assets/$asset_id" > "$zip"; then
            break
          fi
          if [ "$attempt" = 5 ]; then
            echo "::error::Could not download $name (asset $asset_id) from livekit/rust-sdks $TAG after 5 attempts."
            exit 1
          fi
          sleep $((attempt * 30))
        done
        if [ -n "${digest:-}" ]; then
          echo "${digest#sha256:}  $zip" | sha256sum --check --status \
            || { echo "::error::$name does not match the release's $digest"; exit 1; }
        fi
        mkdir -p "$DIR"
        rm -rf "${DIR:?}/$TRIPLE"
        unzip -o -q "$zip" -d "$DIR"
        test -f "$DIR/$TRIPLE/webrtc.ninja" || { echo "::error::$name did not unpack to $TRIPLE/"; exit 1; }
        rm -f "$zip"

    - name: Point webrtc-sys at it
      shell: bash
      env:
        DIR: ${{ steps.archive.outputs.dir }}
        TRIPLE: ${{ steps.archive.outputs.triple }}
      run: echo "LK_CUSTOM_WEBRTC=$DIR/$TRIPLE" >> "$GITHUB_ENV"
