[workspace]
resolver = "2"
members = [
    "packages/tddy-acp",
    "packages/tddy-acp-stub",
    "packages/tddy-build",
    "packages/tddy-build-rust",
    "packages/tddy-build-typescript",
    "packages/tddy-build-docker",
    "packages/tddy-build-buildroot",
    "packages/tddy-build-qemu",
    "packages/tddy-bsp",
    "packages/tddy-demo-runner",
    "packages/tddy-graph",
    "packages/tddy-discovery",
    "packages/tddy-core",
    "packages/tddy-rpc",
    "packages/tddy-stdio",
    "packages/tddy-coder",
    "packages/tddy-tui",
    "packages/tddy-demo",
    "packages/tddy-demo-tui",
    "packages/tddy-tools",
    "packages/tddy-vm",
    "packages/tddy-vm-build",
    "packages/tddy-vm-testkit",
    "packages/tddy-service",
    "packages/tddy-tui-testkit",
    "packages/tddy-e2e",
    "packages/tddy-livekit",
    "packages/tddy-codegen",
    "packages/tddy-livekit-testkit",
    "packages/tddy-connectrpc",
    "packages/tddy-github",
    "packages/tddy-daemon",
    "packages/tddy-workflow-recipes",
    "packages/tddy-actions",
    "packages/tddy-task",
    "packages/tddy-lsp",
    "packages/tddy-lsp-executor",
    "packages/tddy-pty",
    "packages/tddy-terminal-rpc",
    "packages/tddy-remote-git-repo",
    "packages/tddy-tool-engine",
    "packages/tddy-semantic-index",
    "packages/tddy-testing-commons",
    "packages/tddy-workflow",
    "packages/tddy-integration-tests",
    "packages/tddy-livekit-screen-capture",
    "packages/tddy-vnc",
    "packages/tddy-screenshare",
    "packages/tddy-rdp",
    "packages/tddy-sandbox",
    "packages/tddy-sandbox-runner",
    "packages/tddy-sandbox-cgroups",
    "packages/tddy-sandbox-darwin",
    "packages/tddy-sandbox-recipes",
    "packages/tddy-sandbox-app",
    "packages/tddy-sandbox-qemu",
    "packages/tddy-supervisor",
]
exclude = [
    # Real cargo workspace used as a tddy-build example fixture; built by the
    # tddy-build-rust integration tests, not a member of this workspace.
    "packages/tddy-build-rust/examples/workspace",
]

[workspace.dependencies]
rstest = "0.24"
pretty_assertions = "1"
sysinfo = "0.33"

# Debug builds keep only line tables, not full variable/type DWARF. Panic backtraces (the custom
# `std::panic::set_hook`s in tddy-coder/tddy-tui/tddy-sandbox-runner) and anyhow errors still resolve
# to file:line, but the debug-symbol bulk that dominated `target/` size is dropped. This applies to
# dependencies too (where most of that bulk lives). For a full-symbol build on demand:
# `CARGO_PROFILE_DEV_DEBUG=2 cargo build`. Release (`./release`) is unaffected.
[profile.dev]
debug = "line-tables-only"

# `test` inherits from `dev`; set explicitly so the per-crate test binaries (the biggest `target/`
# contributor under `cargo test --workspace`) also carry only line tables.
[profile.test]
debug = "line-tables-only"
