exclude = [
    # Real cargo workspace used as a tddy-build example fixture; built by the
    # tddy-build-rust integration tests, not a member of this workspace.
    "packages/tddy-build-rust/examples/workspace",
]

[workspace.dependencies]
rstest = "0.24"
pretty_assertions = "1"
sysinfo = "0.33"

# Debug builds keep only line tables, not full variable/type DWARF. Panic backtraces (the custom
# `std::panic::set_hook`s in tddy-coder/tddy-tui/tddy-sandbox-runner) and anyhow errors still resolve
# to file:line, but the debug-symbol bulk that dominated `target/` size is dropped. This applies to
# dependencies too (where most of that bulk lives). For a full-symbol build on demand:
# `CARGO_PROFILE_DEV_DEBUG=2 cargo build`. Release (`./release`) is unaffected.
[profile.dev]
debug = "line-tables-only"

# `test` inherits from `dev`; set explicitly so the per-crate test binaries (the biggest `target/`
# contributor under `cargo test --workspace`) also carry only line tables.
[profile.test]
debug = "line-tables-only"

# The bignum arithmetic behind RSA keygen is optimised even in test builds.
#
# `packages/tddy-daemon/src/host_keypair.rs` generates an RSA-2048 host-prompt key per test that
# answers a host prompt, each inside a 10s timeout, while 750+ tests run in parallel — so a keygen
# that costs seconds on an idle machine is a wall-clock flake under load. Measured with
# `-- --test-threads=1`, unoptimised then with this override:
#
# - `--lib host_keypair` (5 tests, 6 keygens): 20.13s → 1.08s
# - `--lib host_add_key_handler_tests` (18 tests, one keygen each): 81.86s → 13.63s
#
# `num-bigint-dig` and not `rsa`: the same measurement with `rsa` alone at opt-level 3 was 20.53s,
# i.e. unchanged. The prime search is the cost, and it lives here.
[profile.test.package.num-bigint-dig]
opt-level = 3
