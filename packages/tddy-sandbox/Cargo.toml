[package]
name = "tddy-sandbox"
version = "0.1.0"
edition = "2021"
description = "Cross-platform sandbox abstraction for running confined agent processes"

[dependencies]
# `#fs-port`: the filesystem port every disk read and write goes through.
tddy-fs = { path = "../tddy-fs" }
anyhow = "1"
glob = "0.3"
log = "0.4"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = "3"
walkdir = "2"
