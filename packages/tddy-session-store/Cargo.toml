[package]
name = "tddy-session-store"
version = "0.1.0"
edition = "2021"
description = "Session storage on disk: atomic writes, session directories, the workflow error type and declarative session actions"

[lib]
name = "tddy_session_store"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
glob = "0.3"
jsonschema = { version = "0.44", default-features = false }
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }
# `ClarificationQuestion`, for `WorkflowError`'s one clarification variant, and the session
# artifact layout `output` writes into.
tddy-workflow = { path = "../tddy-workflow" }
# `session_actions/runtime.rs` runs every manifest as a task on the action runtime. Neither crate
# depends on `tddy-core`, so these add no cycle.
tddy-actions = { path = "../tddy-actions" }
tddy-task = { path = "../tddy-task" }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
