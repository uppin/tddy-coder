[package]
name = "tddy-projects"
version = "0.1.0"
edition = "2021"
description = "The repositories a daemon knows, their hosts and their branches — project.ProjectService. Extracted from tddy-daemon"

[lib]
name = "tddy_projects"
path = "src/lib.rs"

[dependencies]
tddy-core = { path = "../tddy-core" }
tddy-rpc = { path = "../tddy-rpc" }
thiserror = "2"

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = "3"
