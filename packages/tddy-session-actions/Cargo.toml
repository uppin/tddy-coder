[package]
name = "tddy-session-actions"
version = "0.1.0"
edition = "2021"
description = "Session actions run against one session: session-directory listing and invocation, action jobs and the action pipeline"

[dependencies]
glob = "0.3"
jsonschema = { version = "0.44", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `open(2)` for a child process's capture files, without naming `std::fs` (see `open_truncate_for_child`).
libc = "0.2"
tddy-changeset = { path = "../tddy-changeset" }
# `#fs-port`: job layout, job records and channel manifests go through the port.
tddy-fs = { path = "../tddy-fs" }
tddy-session-store = { path = "../tddy-session-store" }
# The task registry an action job is tracked in. Depends on no crate above this one.
tddy-task = { path = "../tddy-task" }

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
tempfile = "3"
tddy-testing-commons = { path = "../tddy-testing-commons" }
