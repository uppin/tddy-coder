[package]
name = "tddy-session-actions"
version = "0.1.0"
edition = "2021"
description = "Session actions run against one session: session-directory listing and invocation, action jobs and the action pipeline"

[dependencies]
glob = "0.3"
jsonschema = { version = "0.44", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tddy-changeset = { path = "../tddy-changeset" }
tddy-session-store = { path = "../tddy-session-store" }
# The task registry an action job is tracked in. Depends on no crate above this one.
tddy-task = { path = "../tddy-task" }

[dev-dependencies]
tempfile = "3"
tddy-testing-commons = { path = "../tddy-testing-commons" }
