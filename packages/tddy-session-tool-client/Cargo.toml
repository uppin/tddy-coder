[package]
name = "tddy-session-tool-client"
version = "0.1.0"
edition = "2021"
description = "Reaching a session's daemon from inside it: transport detection and tool dispatch over sandbox IPC, daemon HTTP or LiveKit RPC"

[lib]
name = "tddy_session_tool_client"
path = "src/lib.rs"

[dependencies]
# Every message this crate sends is defined by a proto in tddy-service.
tddy-service = { path = "../tddy-service" }
# `session_id_from_env` — the jail's own name for the session it belongs to.
tddy-sandbox = { path = "../tddy-sandbox" }
# The sandbox socket is a duplex byte stream; `StdioEndpoint::from_duplex` wraps it as one.
tddy-stdio = { path = "../tddy-stdio" }
tddy-rpc = { path = "../tddy-rpc" }
# `env_non_empty` — one spelling of "unset or blank" for the whole workspace.
tddy-core = { path = "../tddy-core" }
async-trait = "0.1"
log = "0.4"
prost = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The client room transport port: a split session's worktree is on another host, and the room that
# reaches it is joined through this. The binary installs the transport.
tddy-room-client = { path = "../tddy-room-client" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tddy-room-client = { path = "../tddy-room-client", features = ["test-support"] }
serial_test = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
# The wire tests serve the daemon's real `/rpc` router: `connect_router` mounts it, `axum` serves it.
# Both are already in the workspace tree, so no new crate is fetched.
tddy-connectrpc = { path = "../tddy-connectrpc" }
axum = "0.8"
