[package]
name = "tddy-livekit"
version = "0.1.0"
edition = "2021"
description = "LiveKit RPC transport for tddy-coder (custom protobuf over data channels)"

[lib]
name = "tddy_livekit"
path = "src/lib.rs"

[dependencies]
prost = "0.13"
tddy-rpc = { path = "../tddy-rpc" }
tddy-service = { path = "../tddy-service" }
# TLS for the signal websocket, so `wss://` servers connect; feature unification gives every crate
# in the workspace that uses `livekit` the same backend. Native roots: the OS trust store decides.
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
livekit-api = "0.5"
livekit-protocol = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "fs", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
dashmap = "5"
log = { version = "0.4", features = ["std"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tddy-livekit-testkit = { path = "../tddy-livekit-testkit" }
tddy-service = { path = "../tddy-service" }
tddy-core = { path = "../tddy-core" }
tddy-workflow-recipes = { path = "../tddy-workflow-recipes" }
tddy-rpc = { path = "../tddy-rpc" }
# The workspace's polling waits: `docs/dev/guides/testing.md` mandates them over hand-rolled
# sleep-poll loops, so a timeout reports what it last observed instead of only that it gave up.
tddy-testing-commons = { path = "../tddy-testing-commons" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"
env_logger = "0.11"
serial_test = "3"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rstest = { workspace = true }
pretty_assertions = { workspace = true }
# `signal_tls` installs the shipped binaries' crypto provider. A workspace-wide test build also links
# `aws-lc-rs` (through `ironrdp` and `tddy-integration-tests`), and rustls refuses to choose between
# two compiled-in providers. Already in Cargo.lock; `ring` only, so this adds no second provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
