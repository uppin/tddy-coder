syntax = "proto3";

package session;

import "types.proto";

// A session's whole life: listing, starting, connecting, resuming, signalling and deleting.
//
// Split out of `the pre-unbundle monolithic RPC coordinate` by `#unbundle` node 9 — family C, the last and hardest
// of the nine. This is the family that made the god object a god object: `ConnectionServiceImpl`'s
// 60 fields, its 21 `with_*` builders and its `Weak` self-handle existed to serve these eight
// methods, which is why the eight-node plan could move 73 of 90 methods and still leave the defect
// standing.
//
// Imports `types.proto` for all four of its shared types — `HostDocumentScope` (a start names the
// staged attachments to materialise), `SessionAgentStatus` and `SessionAgentActivity` and
// `BranchSession` (a listing reports each). Those four were justified in nodes 6-8 on the grounds
// that a *staying* family reached them; this node moves that family, so all four are now shared
// between services that all moved. The file is still right; its reason changed.
//
// `StartSession` and `StreamStartSession` share `StartSessionRequest`, which is why they cannot be
// split across services.

service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  // Streaming twin of StartSession, for a request carrying attachments the host must materialize
  // before the agent launches. Emits one AttachmentMaterializationProgress per attachment, then
  // exactly one terminal StartSessionResponse. A failure terminates the stream with the error and
  // never emits a result; the partial attachments are rolled back first. Unary StartSession stays
  // the entry point for every non-interactive caller.
  rpc StreamStartSession(StartSessionRequest) returns (stream StartSessionEvent);
  rpc ConnectSession(ConnectSessionRequest) returns (ConnectSessionResponse);
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  rpc SignalSession(SignalSessionRequest) returns (SignalSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // One measurement of a session's checkout, for the daemon hosting that session's room.
  //
  // A session room lives on the daemon running the session's agent; when the repo is remote that
  // daemon has no checkout to measure, so it asks the codebase daemon for the same snapshot the
  // codebase daemon would take of itself. One round trip per poll rather than three, because the
  // measurement is assembled where the files are.
  rpc GetWorktreeSnapshot(GetWorktreeSnapshotRequest) returns (GetWorktreeSnapshotResponse);
}

message AgentClonePlacement {
  // The session on the facilitating daemon this checkout mirrors. Names the room to join
  // (`session-{session_id}`) and the WIP ref to restore from.
  string session_id = 1;
  // The facilitating daemon, as it is addressed in that room (`daemon-{instance_id}`). Every
  // mutating tool call a roster agent on this host makes is proxied there — a mutation applied to
  // the clone would be overwritten by the next sync tick and would never reach the branch.
  string facilitating_daemon_instance_id = 2;
  // The facilitating daemon's Connect-HTTP root — the only address a peer that has never seen the
  // project can clone it from. `tddy-remote-git-repo` calls `auth.LiveKitTokenService/MintLiveKitToken`
  // against this URL to mint a common-room LiveKit token, then drives `remote_git.RemoteGitService/Serve`
  // over that room. Empty only when the owning daemon is the facilitating daemon itself, in which
  // case there is no clone to provision (PRD AC37).
  string facilitating_daemon_url = 3;
  // The first admission token — a scoped, short-TTL LiveKit token the facilitating daemon mints for
  // the owning daemon as part of the room-admission handshake (PRD § "What attach does" step 3). The
  // owning daemon joins `session-{session_id}` with this token and nothing else, then runs the
  // re-admit loop against `session_admission.SessionAdmissionService/AdmitOwningDaemon` over the
  // common room before it expires. Empty only when the facilitating daemon cannot mint (LiveKit not
  // configured), in which case the owning daemon falls back to self-minting — a recorded deviation,
  // never a silent one.
  string first_admission_token = 4;
  // The LiveKit server the admission token is valid against, and the session room it grants —
  // returned alongside `first_admission_token` so the owning daemon joins the right room on the
  // right server without re-deriving either. Empty when `first_admission_token` is empty.
  string first_admission_url = 5;
  string first_admission_room = 6;
}

// Progress materializing one of a start-session request's attachments.
message AttachmentMaterializationProgress {
  // SessionAttachment.basename of the attachment this event is about.
  string basename = 1;
  // Zero-based position of this attachment in the request's `attachments` list.
  uint32 attachment_index = 2;
  // Number of attachments in the request, so a consumer can render "n of m" from any single event.
  uint32 attachment_count = 3;
  // Bytes of this attachment materialized so far, and its full size.
  uint64 bytes_done = 4;
  uint64 bytes_total = 5;
}

// A refused session creation: the requested new branch is already owned by another session.
message BranchConflict {
  // The requested branch that is already owned.
  string branch = 1;
  // The session that owns it — prefers an active session, then the most recently updated.
  // `exists` is always true here.
  types.BranchSession owner = 2;
  // The first free suffixed name (e.g. "feat/auth-1") — what on_branch_conflict = "" would have
  // created. Pre-fills the rename field in the operator's prompt.
  string suggested_branch_name = 3;
}

message ConnectSessionRequest {
  string session_token = 1;
  string session_id = 2;
}

message ConnectSessionResponse {
  string livekit_room = 1;
  string livekit_url = 2;
  string livekit_server_identity = 3;
}

message DeleteSessionRequest {
  string session_token = 1;
  string session_id = 2;
}

message DeleteSessionResponse {
  bool ok = 1;
}

// Asks the daemon holding a checkout to measure it. `session_id` names the session on the
// ANSWERING daemon whose `repo_path` is the checkout — for a split session that is the paired
// `workspace` session, not the agent's own id.
message GetWorktreeSnapshotRequest {
  string session_token = 1;
  string session_id = 2;
  // Routing, as on ExecuteTool: the daemon expected to answer. Empty means the one being called.
  string daemon_instance_id = 3;
}

// The same fields `snapshot_worktree` produces locally, so a remote measurement and a local one are
// the same value and neither the poll loop nor the room metadata can tell them apart.
message GetWorktreeSnapshotResponse {
  string head_commit = 1;
  string branch = 2;
  repeated string changed_paths = 3;
  uint32 changed_files = 4;
  int64 lines_added = 5;
  int64 lines_removed = 6;
  uint32 untracked_files = 7;
  // Basenames under the session's `artifacts/attachments/`, so the room's metadata lists what the
  // answering daemon actually holds rather than what the asking one guesses.
  repeated string attachments = 8;
}

// Reference to a document that already exists on a connected host — an artifacts/ planning doc, a
// file previously uploaded to a session, a worktree file, or a checked-in project doc.
message HostDocumentRef {
  // Host authority that owns the document. The read is performed by that daemon under its own
  // os_user mapping — the referencing client's host grants it no access. Empty = the daemon
  // handling the call.
  string daemon_instance_id = 1;
  // Root that `relative_path` resolves against. There is deliberately no "absolute host path"
  // scope: the owning daemon resolves the root itself and refuses a path that escapes it, so a
  // caller cannot name an arbitrary file on that host.
  types.HostDocumentScope scope = 2;
  // Owning session for the SESSION_* scopes; ignored otherwise.
  string session_id = 3;
  // Owning project for HOST_DOCUMENT_SCOPE_PROJECT_REPO; ignored otherwise.
  string project_id = 4;
  // Path relative to the resolved root: POSIX separators, no "." / ".." segments, not absolute.
  // Separators are permitted and the whole path is resolved under the root, so a nested document
  // is addressable: for SESSION_ARTIFACT this is a SessionContextDoc's `relative_path`, which may
  // be a bare basename, "attachments/<basename>" or "prs/<node_id>/<basename>". For SESSION_UPLOAD
  // it is "<upload_id>/<file_name>" (see SessionUploadEntry).
  string relative_path = 5;
}

message ListSessionsRequest {
  string session_token = 1;
}

message ListSessionsResponse {
  repeated SessionEntry sessions = 1;
}

message ResumeSessionRequest {
  string session_token = 1;
  string session_id = 2;
}

message ResumeSessionResponse {
  string session_id = 1;
  string livekit_room = 2;
  string livekit_url = 3;
  string livekit_server_identity = 4;
}

// One document attached to a session at start. The daemon running the session materializes each
// attachment under {session_dir}/artifacts/attachments/<basename> before launching the agent, so
// the agent sees a plain local file regardless of which source variant produced it.
message SessionAttachment {
  // Basename the document is materialized under. Basename only — path separators, "." / ".." and
  // empty are rejected; duplicate basenames within one StartSessionRequest are a request error
  // (no silent renaming).
  string basename = 1;
  // Where the bytes come from. Exactly one variant must be set; an unset source is a request error.
  oneof source {
    // Bytes uploaded ahead of the session by UploadStagedAttachmentChunk.
    StagedAttachmentRef staged = 2;
    // A document that already exists on one of the connected hosts.
    HostDocumentRef host_document = 3;
  }
}

// A planning document surfaced for a session (web Docs tab, child "Start session" prompts): either
// a recipe-manifest–derived artifact or a user attachment, told apart by `kind`. `path` is the
// absolute on-disk location; `exists` reflects whether the file is currently on disk, and
// `size_bytes` its size there (0 when it does not exist).
message SessionContextDoc {
  string key = 1;
  string basename = 2;
  string path = 3;
  string description = 4;
  bool exists = 5;
  SessionContextDocKind kind = 6;
  uint64 size_bytes = 7;
  // Path relative to the session's artifacts root — the address a HostDocumentRef under
  // HOST_DOCUMENT_SCOPE_SESSION_ARTIFACT uses. A stack-level manifest doc is its own basename, an
  // attachment is "attachments/<basename>", a per-PR document is "prs/<node_id>/<basename>". Sent
  // because a client cannot derive it: nothing in `kind` distinguishes a nested document from a
  // flat one.
  string relative_path = 8;
}

// Whether a context doc is recipe-owned or user-attached (docs/ft/coder/session-attachments.md).
enum SessionContextDocKind {
  // Recipe-owned planning artifact under artifacts/ (the zero value, so a producer or reader that
  // knows nothing about `kind` keeps treating rows as recipe-owned docs).
  SESSION_CONTEXT_DOC_KIND_MANIFEST = 0;
  // User-attached document under artifacts/attachments/.
  SESSION_CONTEXT_DOC_KIND_ATTACHMENT = 1;
}

message SessionEntry {
  string session_id = 1;
  string created_at = 2;
  string status = 3;
  string repo_path = 4;
  uint32 pid = 5;
  bool is_active = 6;
  string project_id = 7;
  // Owning daemon instance for multi-host selection (local id for sessions on this daemon).
  string daemon_instance_id = 8;
  // Workflow / TUI parity (from .session.yaml + changeset.yaml enrichment).
  string workflow_goal = 9;
  string workflow_state = 10;
  // Human-readable elapsed for the active goal/step, or persisted timestamp display.
  string elapsed_display = 11;
  string agent = 12;
  string model = 13;
  // True when the session is blocked waiting for human input (elicitation).
  bool pending_elicitation = 14;
  // Granular activity status for claude-cli sessions (Started, Running, ExecutingTool,
  // WaitingForInput, Done, Ended). Empty string for tool/changeset sessions.
  string activity_status = 15;
  // Extra .session.yaml fields surfaced for the session inspector.
  string tool = 16;
  string session_type = 17;
  string updated_at = 18;
  string livekit_room = 19;
  string previous_session_id = 20;
  // Back-reference to the orchestrating PR-stack session that spawned this child session.
  // Empty string for non-child sessions.
  string orchestrator_session_id = 21;
  // Workflow recipe used when spawning this session (e.g. "tdd", "orchestrate-pr-stack",
  // "plan-pr-stack"). Empty string for claude-cli and workspace sessions.
  string recipe = 22;
  // JSON-serialized `Stack` (see tddy_core::changeset::Stack) for "pr-stack" orchestrator
  // sessions that have a plan. Empty string when this session is not a pr-stack orchestrator,
  // or the plan has not been written yet. Powers the PR-Stack Chat Screen's planned-PR list
  // (docs/ft/web/session-drawer.md § Per-Workflow Session Views).
  string stack_plan_json = 23;
  // Cumulative bytes received over the session's transport (LiveKit for tddy-coder sessions with
  // a participant; the gRPC terminal stream for claude-cli / cursor-cli / workspace sessions the
  // daemon owns). Populated by the daemon `ListSessions` for sessions it can observe; zero for
  // tddy-coder sessions with no LiveKit participant. Inspector fallback when no live runtime
  // exists (changeset 2026-07-12-fast-session-change).
  uint64 bytes_in = 24;
  // Cumulative bytes sent over the session's transport. See `bytes_in`.
  uint64 bytes_out = 25;
  // Epoch-milliseconds of the most recent data received over the session's transport, as a string.
  // Empty when no data has ever been received. Inspector fallback when no live runtime exists.
  string last_data_received_at = 26;
  // Recipe-manifest–derived planning documents for this session (e.g. exploration notes, the
  // stack plan) with per-doc existence and human descriptions. Empty for sessions whose recipe
  // is blank or unknown.
  repeated SessionContextDoc context_docs = 27;
  // The session's git branch (from Changeset.branch). Empty when the session has no branch yet.
  // Lets the PR-Stack view resolve the in-progress child session for a planned node by branch
  // (docs/ft/coder/pr-stack-live-status.md).
  string branch = 28;
  // Daemon instance holding this session's worktree, when it is not the daemon running the agent.
  // Empty for co-located sessions. Read from .session.yaml rather than stamped at read time like
  // `daemon_instance_id`: a split session has two hosts, and each would claim its own half. Lets
  // the web render "agent on A / codebase on B" (docs/ft/daemon/remote-managed-worktree.md).
  string codebase_daemon_instance_id = 29;
  // The paired `workspace` session on that daemon whose worktree this session works in.
  // Empty for co-located sessions.
  string codebase_session_id = 30;
  // What this session's agent is doing, inferred from its own ACP transcript and activity stream
  // (docs/ft/daemon/agent-session-status.md). The same vocabulary a roster agent reports, so one
  // badge renders both. UNSPECIFIED is "this daemon has nothing to say", never "idle" — and it is
  // what every non-agent session (workspace, tool, changeset) reports, because none runs an agent.
  //
  // `agent_status`, not `status`: field 3 is already a session's lifecycle string. The two are
  // different subjects — one is the session, one is the agent inside it. Distinct from
  // `activity_status` (15) too: that is the raw hook word a claude-cli or cursor worktree reports,
  // and this is an inference built partly on top of it.
  types.SessionAgentStatus agent_status = 31;
  // The last thing this session's agent was observed doing; unset when nothing has been observed,
  // and unset when the status came from the hook word alone (a bare timestamp with no summary
  // renders as an agent that did something unnameable just now).
  types.SessionAgentActivity last_activity = 32;
}

enum Signal {
  SIGNAL_SIGINT = 0;
  SIGNAL_SIGTERM = 1;
  SIGNAL_SIGKILL = 2;
}

message SignalSessionRequest {
  string session_token = 1;
  string session_id    = 2;
  int32  signal        = 3;
  // Control token; required when the session has an active terminal controller.
  string control_token = 4;
}

message SignalSessionResponse {
  bool ok = 1;
  string message = 2;
}

// What makes a `workspace` session an agent clone. See StartSessionRequest.agent_clone.
// The agent half of a split placement, as the codebase daemon is told about it when it is asked to
// create the `workspace` session holding that agent's worktree
// (docs/ft/daemon/remote-managed-worktree.md).
//
// Both fields or neither: a daemon named with no session on it names a host but nothing that works
// in the checkout, which is exactly the claim the workspace session is persisting.
message SplitAgentPlacement {
  // The session whose agent works in the workspace session's worktree, reaching it only through
  // mcp__tddy-tools__* over that session's room.
  string session_id = 1;
  // The daemon running that session, as it is addressed in the common room (`daemon-{instance_id}`).
  string agent_daemon_instance_id = 2;
}

// Reference to a file in a host's pre-session staging area.
message StagedAttachmentRef {
  // Host authority holding the staged bytes — the daemon_instance_id UploadStagedAttachmentChunk
  // was addressed to. Must be the host the session starts on; a mismatch is a request error rather
  // than a cross-host fetch. Empty = the daemon handling the call.
  string daemon_instance_id = 1;
  string staging_id = 2;
  // Basename under the staging batch. Untrusted — validated as a basename contained under the
  // staging root. May differ from SessionAttachment.basename (the UI can rename an attachment).
  string file_name = 3;
}

// One event of a StreamStartSession response: progress while attachments materialize, then exactly
// one terminal result. The result is always the last event; a failure terminates the stream with a
// status instead, never with a result.
message StartSessionEvent {
  oneof event {
    AttachmentMaterializationProgress attachment_progress = 1;
    StartSessionResponse result = 2;
  }
}

message StartSessionRequest {
  string session_token = 1;
  // Path to the binary to spawn for this session only (from daemon allowlist). Not stored on the project.
  string tool_path = 2;
  string project_id = 3;
  // Per new session: passed to spawned tddy-coder as --agent (skips interactive backend menu). Not stored on the project.
  string agent = 4;
  // Target daemon instance to run this session on. Empty or matching local instance = spawn locally.
  string daemon_instance_id = 5;
  // Workflow recipe for the new session ("tdd" or "bugfix"). Empty means default (tdd).
  string recipe = 6;
  // Session type: "tool" (default/empty) spawns tddy-coder; "claude-cli" spawns the Claude Code CLI in a PTY.
  string session_type = 7;
  // Model id for claude-cli sessions (e.g. "claude-opus-4-8"). Required when session_type = "claude-cli".
  string model = 8;
  // Branch/worktree intent for claude-cli sessions. One of: "new_branch_from_base",
  // "work_on_selected_branch". Empty defaults to "new_branch_from_base" with a generated name.
  string branch_worktree_intent = 9;
  // Required when branch_worktree_intent = "new_branch_from_base". Name for the new branch.
  string new_branch_name = 10;
  // Optional override for the integration base ref (e.g. "origin/master"). When empty, the project's
  // main_branch_ref (or the daemon default) is used.
  string selected_integration_base_ref = 11;
  // Required when branch_worktree_intent = "work_on_selected_branch". The existing branch to check out.
  string selected_branch_to_work_on = 12;
  // Optional first prompt to pass as a positional argument to the claude CLI process on launch
  // (e.g. `claude "build feature X"`). Only used when session_type = "claude-cli". Empty = no prompt.
  // The session is still started interactively; the prompt seeds the first user turn.
  string initial_prompt = 13;
  // Permission mode for claude-cli sessions. Empty string defaults to "auto".
  // Valid values: "auto", "default", "acceptEdits", "plan", "bypassPermissions".
  // Passed as `--permission-mode <mode>` to the claude binary.
  string permission_mode = 14;
  // Optional: session ID of the orchestrating PR-stack session. When set, the spawned tddy-coder
  // receives `--stack-parent <id>` so it can back-reference the orchestrator.
  string stack_parent = 15;
  // When true with session_type = "claude-cli", spawn claude inside a platform sandbox (darwin Seatbelt).
  bool sandbox = 16;
  // Managed-codebase mode (see docs/ft/coder/managed-codebase-subagents.md): the sandboxed jail does
  // not mount the repo — the agent reaches it only via mcp__tddy-tools__* exec tools. Only meaningful
  // when session_type = "claude-cli" (and typically sandbox = true).
  bool managed_codebase = 17;
  // Names of specialized subagents (see docs/ft/coder/specialized-subagents.md) to wire into this
  // session's mcp__tddy-tools__subagent_* tools. Each name must resolve to a builtin or
  // <tddyhome>/agents/*.yaml def; an unresolvable name is a request error.
  repeated string specialized_agents = 18;
  // Absolute path to a local git checkout to use as the session worktree, sent by a local client
  // (e.g. tddy-sandbox-app) instead of selecting a configured project_id. When set, it overrides
  // project_id-based resolution. The session still runs as the caller's mapped os_user, so this
  // grants no access beyond that user. Empty = resolve from project_id as before.
  string repo_path = 24;
  // Extra arguments forwarded verbatim to the in-jail `claude` for claude-cli sessions (after any
  // recipe/config args; a trailing positional prompt lands last). Sent by local clients that carry
  // their own SandboxAppConfig. Empty = none.
  repeated string claude_args = 25;
  // When true with session_type = "claude-cli", pass `--dangerously-skip-permissions` to the claude
  // binary, bypassing all permission prompts. Mutually exclusive with permission_mode: when set, the
  // daemon omits `--permission-mode` (the claude CLI rejects using both together).
  bool dangerously_skip_permissions = 26;
  // Managed-codebase sessions with this set index the worktree before launch and expose the
  // SemanticSearch tool. Only meaningful when managed_codebase = true. See
  // docs/ft/coder/semantic-index.md.
  bool semantic_index = 27;
  // When true in "new_branch_from_base" mode, push the freshly created branch to origin
  // (`git push -u origin <branch>`) at session start and record Changeset.remote_pushed = true.
  // A push failure fails the session start (no silent fallback). See
  // docs/ft/coder/1-WIP/PRD-2026-07-25-branch-query-and-remote-branch.md.
  bool create_remote_branch = 28;
  // Documents to attach to the new session. Each descriptor names the basename the document is
  // materialized under plus where its bytes come from — a pre-session staged upload, or a document
  // that already exists on a connected host. The daemon materializes every attachment into
  // {session_dir}/artifacts/attachments/ before the agent launches; any failure fails the whole
  // start with no partial attachments left behind. Empty = no attachments. See
  // packages/tddy-daemon/docs/connection-service.md § Start-session attachments.
  repeated SessionAttachment attachments = 29;
  // How to handle `new_branch_name` naming a branch another session already owns. Only consulted in
  // "new_branch_from_base" mode with a non-empty `new_branch_name` — a generated branch name is
  // derived from the session uuid and cannot collide.
  //   ""       — create a suffixed branch (`<name>-1`, `-2`, …). What every existing caller gets.
  //   "reject" — create nothing; report the conflict in StartSessionResponse.branch_conflict.
  // Opt-in by design: only a surface that can prompt an operator asks to be rejected. See
  // docs/ft/daemon/session-branch-conflict.md.
  string on_branch_conflict = 30;
  // Existing session whose branch seeds a new pr-stack orchestrator's stack as its single root
  // node. Refused unless `recipe` resolves to "pr-stack". Empty leaves the stack unseeded, which is
  // the pre-existing behaviour (the agent plans it).
  string pr_stack_base_session_id = 31;
  // Daemon instance whose filesystem holds this session's git worktree. Empty or matching
  // `daemon_instance_id` = co-located (the pre-existing behaviour). When it names a different
  // eligible daemon, that daemon creates a `workspace` session holding the worktree and the agent
  // reaches it only via mcp__tddy-tools__* over LiveKit.
  // Requires managed_codebase = true and session_type = "claude-cli" — an agent that still has
  // native filesystem tools has nothing to proxy through, and cursor-cli cannot be prevented from
  // using them. A request breaking either rule is refused, not silently co-located. See
  // docs/ft/daemon/remote-managed-worktree.md.
  string codebase_daemon_instance_id = 32;
  // Session id to create the session under, chosen by the caller instead of generated by the
  // serving daemon. Only honoured for session_type = "workspace"; sending it with any other type is
  // a request error rather than a silently ignored field.
  // It exists for one reason: the daemon that places a split session's worktree on another host
  // must be able to name — and therefore delete — the workspace session even when the forwarded
  // StartSession never answers. Without it, a codebase daemon slower than the forward deadline
  // creates a worktree its originator can no longer identify, which is an orphan nothing points at.
  // Must be a single safe path segment and must not name a session that already exists on the
  // serving daemon. Empty = the serving daemon generates one, as before.
  // See docs/ft/daemon/remote-managed-worktree.md § Failure is atomic.
  string requested_session_id = 33;
  // Set when this `workspace` session is an **agent clone** — the independent checkout an owning
  // daemon reads its roster agents' files from (docs/ft/daemon/session-agent-roster.md § Clones).
  // Absent for every other workspace session, including the codebase half of a split placement.
  //
  // It carries the two facts the owning daemon cannot derive from the request: which session on the
  // facilitating daemon this checkout mirrors, and which daemon that is. Both are needed before a
  // single byte is synced — the first names the room to join and the WIP ref to restore from, the
  // second names the participant every mutating tool call is proxied back to. Deriving either from
  // the clone's own id would encode control flow in a string, which is exactly the kind of coupling
  // that breaks silently when an id format changes.
  AgentClonePlacement agent_clone = 34;
  // Set when this `workspace` session is the codebase half of a **split placement** — the worktree an
  // agent session on another daemon works in, reaching it only through mcp__tddy-tools__*. Absent for
  // every other workspace session, agent clones included, and refused outright for any other session
  // type: a caller that believed it had recorded a pairing would go on to attach agents the session
  // cannot enforce.
  //
  // It carries the one fact the codebase daemon cannot derive from the request — which session, on
  // which daemon, works in the checkout it is about to cut — and the workspace session persists it.
  // That is what makes the pairing readable from either half; the agent half already records the
  // codebase half in `codebase_daemon_instance_id` / `codebase_session_id`.
  //
  // Enforcement depends on it. A tool the roster withdraws from a split session's main agent is
  // refused inside the jail the *agent* half runs, and the attach that withdraws it is routed to this
  // half, where it reads this session's metadata. A `workspace` session no agent is paired with —
  // a standalone checkout, an agent clone — therefore enforces nothing, and an agent that replaces
  // tools is refused on it rather than accepted unenforced. See
  // docs/ft/daemon/session-agent-roster.md § Enforced at two layers.
  SplitAgentPlacement split_agent = 35;
  // Daemon whose sessions tree holds `stack_parent`. Empty or matching the local instance = this
  // daemon resolves the parent from its own disk, which is what every single-host deployment sends.
  //
  // It exists because `stack_parent` is a bare session id and the base it resolves to is read out
  // of the parent's own `changeset.yaml`. The new-session form's orchestrator picker is fed by a
  // fanned-out, all-host `ListSessions`, so the orchestrator it offers routinely lives on a
  // different daemon than the child is started on — and resolved against this daemon's sessions
  // tree that parent reads as a missing file rather than as a session one host over, which refuses
  // the spawn. Named here, the base is resolved by `ResolveStackBase` on the daemon that owns it.
  //
  // Routing only: the child session itself is still created by the daemon this request names in
  // `daemon_instance_id`, and still records `stack_parent` as its orchestrator.
  string stack_parent_daemon_instance_id = 36;
  // The planned pr-stack node this child materializes, sent by the surface that rendered the
  // Start-session control. The daemon records the spawn on exactly this node instead of re-deriving
  // one from the branch (D34): the branch is `new_branch_name`, which the operator can edit in the
  // create dialog before confirming, so a rename silently unlinks the node from the row that started
  // it — and a daemon that does not hold the orchestrator cannot look the node up at all.
  //
  // Empty keeps the branch-derived local lookup, which is what the orchestrator agent's own
  // `spawn-child` uses: it always runs on the orchestrator's host, where that lookup is correct.
  // Meaningful only together with `stack_parent`, which names the orchestrator holding the node.
  string stack_node_id = 37;
  // Removed: discovery_subagent (single-name alias), fastcontext_url/fastcontext_model/
  // fastcontext_max_turns/subagent_replaces. All specialized-agent configuration (name, model,
  // base_url, max_turns, replaces) now comes exclusively from `specialized_agents` resolved
  // against the caller's YAML defs (or the builtin `fastcontext` def) — no caller-facing override,
  // no single-name alias. No backwards compatibility retained.
  reserved 19, 20, 21, 22, 23;
}

message StartSessionResponse {
  string session_id = 1;
  string livekit_room = 2;
  string livekit_url = 3;
  string livekit_server_identity = 4;
  // Set only when the request asked for on_branch_conflict = "reject" and a session already owns the
  // requested branch. `session_id` is then empty: no session directory, no branch and no worktree
  // were created. See docs/ft/daemon/session-branch-conflict.md.
  BranchConflict branch_conflict = 5;
}
