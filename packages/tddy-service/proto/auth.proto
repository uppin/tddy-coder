syntax = "proto3";

package auth;

service AuthService {
  rpc GetAuthUrl(GetAuthUrlRequest) returns (GetAuthUrlResponse);
  rpc ExchangeCode(ExchangeCodeRequest) returns (ExchangeCodeResponse);
  rpc GetAuthStatus(GetAuthStatusRequest) returns (GetAuthStatusResponse);
  // Mint a fresh short-lived access token (and a slid refresh token) from a currently-valid,
  // long-lived refresh token. The web client calls this when its access token is near/at expiry
  // to keep the session alive without re-login; an expired or non-refresh token is rejected.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Begin the OAuth device flow — the sign-in a desktop deployment uses, which needs a public
  // client id and no client secret. The response is shown to the operator; approval happens in
  // their browser against GitHub.
  rpc StartDeviceLogin(StartDeviceLoginRequest) returns (StartDeviceLoginResponse);
  // Ask whether the device code has been approved. The client polls this no faster than the
  // interval it was given, widening it whenever the answer says to.
  rpc PollDeviceLogin(PollDeviceLoginRequest) returns (PollDeviceLoginResponse);
  // Open the caller's credential vault with its passphrase — or, with `create`, create it under a
  // first passphrase when none exists — seal the GitHub token their login is holding for it, and
  // hand this lineage an unlock slot. A wrong passphrase is `failed_precondition` naming the lock,
  // and changes nothing on disk.
  rpc UnlockVault(UnlockVaultRequest) returns (UnlockVaultResponse);
  // The forgotten-passphrase path: set the caller's vault aside (renamed on the daemon's disk,
  // never deleted), create a fresh one under `new_passphrase`, and seal the GitHub token their login
  // is holding for it. Every stored credential must be linked again; the old file stays recoverable
  // by whoever still knows its passphrase.
  rpc ResetVault(ResetVaultRequest) returns (ResetVaultResponse);
}

// Where the caller's credential vault stands on the answering daemon.
enum VaultState {
  VAULT_STATE_UNSPECIFIED = 0;
  // The daemon keeps no vault for this login: a stub/demo login, or no `auth_storage`. Nothing to
  // unlock and nothing to prompt for.
  VAULT_STATE_NONE = 1;
  // Open: stored credentials are in use. No prompt.
  VAULT_STATE_OPEN = 2;
  // A vault exists and is closed on this daemon. Its passphrase opens it (`UnlockVault`); until
  // then the GitHub token this login received is held in memory, and GitHub-backed reads report
  // themselves unavailable.
  VAULT_STATE_LOCKED = 3;
  // No vault exists yet. Choosing a passphrase creates it (`UnlockVault` with `create`).
  VAULT_STATE_UNINITIALIZED = 4;
}

message GetAuthUrlRequest {}
message GetAuthUrlResponse {
  string authorize_url = 1;
  string state = 2;
}

message ExchangeCodeRequest {
  string code = 1;
  string state = 2;
}
message ExchangeCodeResponse {
  // Short-lived access token used to authenticate RPCs.
  string session_token = 1;
  GitHubUser user = 2;
  // Long-lived refresh token used only to mint fresh access tokens (never sent on normal RPCs).
  string refresh_token = 3;
  // A wrap key for this session lineage's slot in the daemon's credential vault — not a stored
  // credential. Alone it opens nothing: it is useful only together with the vault file, which never
  // leaves the daemon's disk. Opaque; hold it beside the refresh token. Empty unless `vault_state`
  // is OPEN: a LOCKED or UNINITIALIZED vault hands one out at `UnlockVault`, and a stub/demo login
  // or a daemon without `auth_storage` keeps no vault. The GitHub token itself is never carried on
  // any response.
  string vault_unlock_key = 4;
  // Where this login's vault stands. LOCKED and UNINITIALIZED are signed in all the same — the
  // client prompts for the passphrase rather than refusing the login.
  VaultState vault_state = 5;
}

message GetAuthStatusRequest {
  string session_token = 1;
}
message GetAuthStatusResponse {
  bool authenticated = 1;
  GitHubUser user = 2;
  // Where the authenticated caller's vault stands, so a page that reloads while it is LOCKED or
  // UNINITIALIZED prompts again. UNSPECIFIED when not authenticated.
  VaultState vault_state = 3;
}

message RefreshSessionRequest {
  // Long-lived refresh token presented to mint a fresh access token.
  string refresh_token = 1;
  // The vault unlock key the last login or refresh returned, sent back so the daemon can reopen
  // this user's credential vault after a restart. A wrap key, not a stored credential: alone it
  // opens nothing. Presenting it rotates it — use the one in the response from now on.
  string vault_unlock_key = 2;
}
message RefreshSessionResponse {
  // Freshly minted short-lived access token.
  string session_token = 1;
  GitHubUser user = 2;
  // Freshly minted refresh token (sliding window) that replaces the presented one.
  string refresh_token = 3;
  // The rotated vault unlock key that replaces the presented one; the presented one opens nothing
  // any more. Empty when none was presented, or when the presented one no longer opens its slot —
  // the session is still refreshed, and `vault_state` says what opens the vault instead. A wrap
  // key, not a stored credential: alone it opens nothing.
  string vault_unlock_key = 4;
  // Where the caller's vault stands after this refresh.
  VaultState vault_state = 5;
}

message LogoutRequest {
  string session_token = 1;
  // The vault unlock key this session lineage holds, so the daemon can remove its slot from the
  // credential vault. A wrap key, not a stored credential. Empty removes nothing.
  string vault_unlock_key = 2;
}
message LogoutResponse {}

message StartDeviceLoginRequest {}
message StartDeviceLoginResponse {
  // The daemon's half of the exchange. The client sends it back on every poll and never shows it.
  string device_code = 1;
  // The operator's half — the short code they type at `verification_uri`.
  string user_code = 2;
  string verification_uri = 3;
  // How long the codes stay valid, and the minimum seconds between polls.
  uint64 expires_in_seconds = 4;
  uint64 interval_seconds = 5;
}

message PollDeviceLoginRequest {
  string device_code = 1;
}

// Where one poll left the attempt. The client's next move differs for every state, so they are
// distinct values rather than an empty response plus an error string.
enum DeviceLoginState {
  DEVICE_LOGIN_STATE_UNSPECIFIED = 0;
  // Not approved yet. Poll again after the interval.
  DEVICE_LOGIN_STATE_PENDING = 1;
  // Polled too fast. Adopt `interval_seconds` from the response, then poll again.
  DEVICE_LOGIN_STATE_SLOW_DOWN = 2;
  // The operator refused. The attempt is over.
  DEVICE_LOGIN_STATE_DENIED = 3;
  // The codes outlived their window. Start a new login.
  DEVICE_LOGIN_STATE_EXPIRED = 4;
  // Approved. The token fields carry the session, in the same shape `ExchangeCode` returns.
  DEVICE_LOGIN_STATE_COMPLETE = 5;
}

message PollDeviceLoginResponse {
  DeviceLoginState state = 1;
  // Set only on SLOW_DOWN — the interval the client must adopt.
  uint64 interval_seconds = 2;
  // All four set only on COMPLETE, and identical in meaning to `ExchangeCodeResponse`.
  string session_token = 3;
  GitHubUser user = 4;
  string refresh_token = 5;
  // As `ExchangeCodeResponse.vault_unlock_key`: a wrap key for this lineage's vault slot, not a
  // stored credential, and useless without the vault file.
  string vault_unlock_key = 6;
  // As `ExchangeCodeResponse.vault_state`. Set only on COMPLETE.
  VaultState vault_state = 7;
}

message UnlockVaultRequest {
  // The caller's access token: whose vault this is.
  string session_token = 1;
  // Never logged, never stored; Argon2id derives the vault's key-encryption key from it.
  string passphrase = 2;
  // Create the vault under `passphrase` rather than open it. Refused when a vault already exists.
  bool create = 3;
}
message UnlockVaultResponse {
  // OPEN on success.
  VaultState vault_state = 1;
  // This lineage's unlock slot key, as `ExchangeCodeResponse.vault_unlock_key`. Replaces any the
  // client holds.
  string vault_unlock_key = 2;
}

message ResetVaultRequest {
  // The caller's access token: whose vault this is.
  string session_token = 1;
  // The fresh vault's passphrase. Never logged, never stored.
  string new_passphrase = 2;
}
message ResetVaultResponse {
  // OPEN on success.
  VaultState vault_state = 1;
  // This lineage's unlock slot key to the fresh vault. Every key to the old vault opens nothing.
  string vault_unlock_key = 2;
}

// Mint a LiveKit room JWT for an already-authenticated caller.
//
// A client that held the LiveKit API secret could mint itself a room JWT for any room under any
// participant identity, including a daemon's. Clients therefore ask the daemon for a room JWT
// instead of minting one. The room and the participant identity are chosen by the daemon and are
// never read from the request. (The secret signs room JWTs only: session tokens are signed with
// each daemon's own Ed25519 key.)
service LiveKitTokenService {
  rpc MintLiveKitToken(MintLiveKitTokenRequest) returns (MintLiveKitTokenResponse);
}

message MintLiveKitTokenRequest {
  // Daemon access token, verified exactly as on every other token-gated RPC. A refresh-kind or
  // expired token is rejected.
  string session_token = 1;
}
message MintLiveKitTokenResponse {
  // Short-lived LiveKit JWT. Its embedded identity is server-generated.
  string token = 1;
  // The LiveKit server the token is valid against.
  string url = 2;
  // The daemon's configured common room — the only room the token grants.
  string room = 3;
  uint64 ttl_seconds = 4;
}

message GitHubUser {
  string login = 1;
  string avatar_url = 2;
  string name = 3;
  uint64 id = 4;
}
