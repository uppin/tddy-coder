syntax = "proto3";
package screen_sharing;

// Control-plane service: add/list/remove a user's screen-sharing targets, and start/stop the
// bridge for one of them. A target's password is a `screen-sharing` record in the credential store
// (`#keyring` 3/9), which the caller's own session opens — so NO RPC HERE CARRIES A PASSPHRASE, and
// none may be added. A second secret, typed by a person and sent over a wire, existed only because
// the daemon had no other way to know the person was present; after `#keyring` 2/9 and 3/9 it does.
// Implemented by tddy-daemon and consumed by the browser via HTTP Connect.
// Supports VNC and RDP protocols via the Protocol enum on each target.
service ScreenSharingService {
  rpc ListTargets  (ListTargetsRequest)  returns (ListTargetsResponse);
  rpc AddTarget    (AddTargetRequest)    returns (AddTargetResponse);
  rpc RemoveTarget (RemoveTargetRequest) returns (RemoveTargetResponse);
  rpc StartStream  (StartStreamRequest)  returns (StartStreamResponse);
  rpc StopStream   (StopStreamRequest)   returns (StopStreamResponse);

  // --- Host-scoped targets (#hosts-screen 8/8) ---
  //
  // A desktop belongs to a MACHINE, not to a coding session. Every RPC above carries a session_id
  // and its vault lives under the session directory, so there is no way to say "this host's
  // desktop" today. These mirror the session-scoped calls, addressed by daemon_instance_id.
  //
  // The bridge, the LiveKit republishing and the browser overlay are all REUSED unchanged — this is
  // a scoping change, not a second implementation. There is no browser-side VNC/RDP client and there
  // must never be one.
  rpc ListHostTargets(ListHostTargetsRequest) returns (ListHostTargetsResponse);
  rpc AddHostTarget(AddHostTargetRequest) returns (AddHostTargetResponse);
  rpc StartHostStream(StartHostStreamRequest) returns (StartStreamResponse);
  rpc StopHostStream(StopHostStreamRequest) returns (StopHostStreamResponse);
}

// --- Protocol ---

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VNC = 1;
  PROTOCOL_RDP = 2;
}

// --- Shared types ---

message ScreenSharingTarget {
  string   id       = 1;  // UUID assigned by daemon on add
  string   label    = 2;  // Human-readable name chosen by the user
  string   host     = 3;
  uint32   port     = 4;
  Protocol protocol = 5;
  string   username = 6;  // Login user (required for RDP, optional for VNC)
}

// --- ListTargets ---

message ListTargetsRequest {
  string session_token = 1;
  string session_id    = 2;
}

message ListTargetsResponse {
  repeated ScreenSharingTarget targets = 1;
  // The store exists and this session's key does not open it — the login credential changed.
  //
  // A field rather than an error, and for the same reason `accounts.proto` makes it one: an
  // open-and-empty store (`targets` empty, `vault_locked` false) and a locked one are different
  // situations with different remedies, and rendering the second as "no targets" tells the person
  // to add targets they already have.
  bool vault_locked = 2;
}

// --- AddTarget ---

message AddTargetRequest {
  string   session_token = 1;
  string   session_id    = 2;
  string   label         = 3;
  string   host          = 4;
  uint32   port          = 5;
  // Plaintext password. The daemon seals it as this target's `screen-sharing` record, under the
  // key the caller's own session already holds — there is nothing for the caller to unlock first.
  // Leave empty for password-less targets.
  string   password      = 6;
  Protocol protocol      = 7;
  // Login username (required for RDP, optional for VNC).
  string   username      = 8;
}

message AddTargetResponse {
  ScreenSharingTarget target = 1;
}

// --- RemoveTarget ---

message RemoveTargetRequest {
  string session_token = 1;
  string session_id    = 2;
  string target_id     = 3;
}

message RemoveTargetResponse {
  bool ok = 1;
}

// --- StartStream ---

message StartStreamRequest {
  string session_token = 1;
  string session_id    = 2;
  string target_id     = 3;
}

// Response carries the LiveKit coordinates so the browser knows which participant
// and track to subscribe to, and which identity to send input events to.
message StartStreamResponse {
  string livekit_room    = 1;
  string livekit_url     = 2;
  string bridge_identity = 3;  // e.g. "screenshare-<session>-<target>"
  string track_name      = 4;  // e.g. "screenshare:<target_id>"
  uint32 width           = 5;
  uint32 height          = 6;
}

// --- StopStream ---

message StopStreamRequest {
  string session_token = 1;
  string session_id    = 2;
  string target_id     = 3;
}

message StopStreamResponse {
  bool ok = 1;
}

// --- Host-scoped target model (#hosts-screen 8/8) ---

message ListHostTargetsRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
}
message ListHostTargetsResponse {
  repeated ScreenSharingTarget targets = 1;
}

message AddHostTargetRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
  string label = 3;
  string host = 4;
  uint32 port = 5;
  Protocol protocol = 6;
  string username = 7;
}
message AddHostTargetResponse {
  string target_id = 1;
}

// Starts a bridge for a HOST-scoped target. Returns the same StartStreamResponse the session-scoped
// call does, because the browser overlay consumes exactly those fields already.
//
// The desktop password is deliberately NOT a field here. It is asked for on the #hosts-screen 6/8
// prompt channel while this call is blocked: HostPromptEvent is the only place a host publishes the
// public key an answer is encrypted under, so a caller has nothing to encrypt with until the daemon
// has asked. Nothing persists the answer either — the session-scoped vault's storing model is
// deliberately not followed for a host desktop.
message StartHostStreamRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
  string target_id = 3;
}

message StopHostStreamRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
  string target_id = 3;
}
message StopHostStreamResponse {
  bool ok = 1;
}
