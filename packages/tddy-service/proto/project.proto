syntax = "proto3";

package project;

// Projects: the repositories a daemon knows, their hosts, and their branches.
//
// Split out of `the pre-unbundle monolithic RPC coordinate` by `#unbundle` node 9 — family D — into a crate of its
// own rather than joining `tddy-worktree-service`. The two are adjacent (a worktree belongs to a
// project) but a project outlives every worktree cut from it, and `ListProjectBranches` reads the
// project's *main checkout*, not a worktree.
//
// Imports nothing: its messages are reached by no other service.

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Make an existing project available on another host (daemon instance), reusing its project_id.
  // Routed to the target daemon (local or forwarded over the LiveKit common room) which clones the
  // repo and registers a projects.yaml row with the same project_id. See
  // docs/ft/web/projects-screen-multi-host.md.
  rpc AddProjectToHost(AddProjectToHostRequest) returns (AddProjectToHostResponse);
  rpc ListProjectBranches(ListProjectBranchesRequest) returns (ListProjectBranchesResponse);
  // Set a project's default integration base ref (logical-project scope: forwarded to peer hosts
  // owning the same project_id). See docs/ft/coder/git-integration-base-ref.md.
  rpc SetProjectDefaultBranch(SetProjectDefaultBranchRequest) returns (SetProjectDefaultBranchResponse);
  // Set which account a project uses at each provider (logical-project scope: forwarded to peer
  // hosts owning the same project_id, exactly as SetProjectDefaultBranch is). The list REPLACES the
  // stored one, so two people editing concurrently cannot interleave into a set neither chose. At
  // most one account per provider; a second is refused rather than silently winning. See
  // `#keyring` 5/9.
  rpc SetProjectAccounts(SetProjectAccountsRequest) returns (SetProjectAccountsResponse);
  // Save (or clear) what a new orchestrator for the project starts with on one host — the "+"
  // composer's model, effort and provider account (`#orchestrators` 11/11). **Per-host scope**, as
  // main is: routed to the host `daemon_instance_id` names (local or forwarded), and never fanned
  // out to the project's other hosts. The defaults REPLACE the stored ones; absent clears them.
  rpc SetProjectOrchestratorDefaults(SetProjectOrchestratorDefaultsRequest) returns (SetProjectOrchestratorDefaultsResponse);
  // Edit a project's metadata — its display name — on every host owning it (**logical-project
  // scope, daemon fan-out**): the receiving daemon writes its own row, then forwards the request
  // with `local_only` to every eligible peer. A peer without the row answers not_found and is
  // skipped. The repository identity (git_url, main_repo_path) and project_id are not editable;
  // the default branch and accounts keep their own RPCs. See docs/ft/daemon/project-concept.md.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  // **Soft-delete** a project on every host owning it (same fan-out as UpdateProject): each row is
  // tombstoned (`deleted_at`, `deleted_by`) and nothing is removed from disk — the main checkout,
  // worktrees, session directories, stacks and settings are all kept. Refused (failed_precondition,
  // naming them) while any reachable host runs one of the project's ordinary sessions; the
  // project's read-only project-home session is stopped, not removed. Repeating it is a no-op.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // Clear a project's tombstone on every host owning it (same fan-out), recording `restored_at`.
  // Restoring a project that is not deleted is a no-op.
  rpc RestoreProject(RestoreProjectRequest) returns (RestoreProjectResponse);
}

// A host that a fanned-out project write (UpdateProject, DeleteProject, RestoreProject) could not
// confirm: it did not answer, or answered with an error other than not_found. Whether it holds the
// project is unknown; it converges the next time any host lists projects with it reachable.
message UnconfirmedHost {
  string daemon_instance_id = 1;
  // Why it is unconfirmed, as the forward failed.
  string reason = 2;
}

// What a project's orchestrator composer starts with on one host (`#orchestrators` 11/11). Each
// field empty means "the agent's own default" — the composer then shows what the agent serves.
message OrchestratorDefaults {
  // A model id the agent's catalogue lists.
  string model = 1;
  // One of the agent's served effort levels (`AgentInfo.effort_levels`).
  string effort = 2;
  // A provider account (`accounts.AccountSummary.account_id`) the agent runs on instead of its vendor.
  string provider_account_id = 3;
}

// One provider's account, as assigned to a project.
//
// An account id is minted by the daemon that holds the credential and is unique only **within its
// provider**, so an assignment names both. Carries no secret and no label: it is a reference into a
// daemon's vault, resolved against `accounts.AccountsService` when it is needed.
message AccountAssignment {
  // Provider this assignment is for ("github", "cloudflare", ...).
  string provider = 1;
  // Account at that provider, as `accounts.AccountSummary.account_id` reports it.
  string account_id = 2;
}

message AddProjectToHostRequest {
  string session_token = 1;
  // Existing logical project id to reuse on the target host.
  string project_id = 2;
  string name = 3;
  string git_url = 4;
  // Optional integration base ref for the cloned checkout (empty = documented default).
  string main_branch_ref = 5;
  // Target daemon instance to add the project to. Empty or matching local instance = add locally.
  string daemon_instance_id = 6;
  // Optional clone destination relative to the OS user's home (same semantics as CreateProject).
  string user_relative_path = 7;
}

message AddProjectToHostResponse {
  // The registry row created (or already present) on the target host.
  ProjectEntry project = 1;
}

message CreateProjectRequest {
  string session_token = 1;
  string name = 2;
  string git_url = 3;
  // Optional path relative to the OS user's home (POSIX segments, e.g. "Code/my-app" or "~/Code/my-app").
  // When empty, the clone destination is ~/{repos_base_path}/{name}/ (default repos_base_path: "repos").
  string user_relative_path = 4;
}

message CreateProjectResponse {
  ProjectEntry project = 1;
}

message ListProjectBranchesRequest {
  string session_token = 1;
  string project_id = 2;
  string daemon_instance_id = 3;
}

message ListProjectBranchesResponse {
  repeated string branches = 1;
  // The default remote name the listed branches are tracked under (`origin`, `upstream`, ...).
  // Clients strip this prefix to recover local branch names. Empty means undetected; clients fall
  // back to `origin` only as a last resort.
  string default_remote = 2;
}

message ListProjectsRequest {
  string session_token = 1;
  // When true, return only this daemon's local registry rows and skip peer fan-out. Set by the
  // peer-project aggregation path so a fanned-out ListProjects does not recurse back into peers.
  bool local_only = 2;
  // When true, soft-deleted projects are listed too (their rows carry `deleted_at`). Default:
  // deleted projects are left out. A peer aggregation asks for them so a tombstone on any host wins.
  bool include_deleted = 3;
}

message ListProjectsResponse {
  repeated ProjectEntry projects = 1;
}

message ProjectEntry {
  string project_id = 1;
  string name = 2;
  string git_url = 3;
  string main_repo_path = 4;
  // Owning daemon for this registry row (multi-daemon aggregated ListProjects).
  string daemon_instance_id = 5;
  // Stored default integration base ref (`<remote>/<branch>`, possibly multi-segment). Empty =
  // unset; legacy rows resolve their default live from the repository. See
  // docs/ft/coder/git-integration-base-ref.md.
  string main_branch_ref = 6;
  // Resolved default remote name for the project's main repo (`origin`, `upstream`, ...). Empty when
  // undetected (legacy rows without an upstream and without a stored `remote_name`). Clients use this
  // to normalize `<remote>/<branch>` picker values to local branch names without assuming `origin`.
  string default_remote = 7;
  // Accounts this project is assigned at each provider. Empty means **unassigned**, which is a
  // final answer rather than an invitation to guess: with no assignment the daemon resolves no
  // credential and the operation that wanted one fails. At most one entry per provider.
  repeated AccountAssignment accounts = 8;
  // The project's sessions take their GitHub identity from the host's own GitHub CLI (`gh auth
  // login` on each host, as the session's OS user) instead of from a vault account. A project with
  // this set has no github entry in `accounts`. See docs/ft/daemon/github-identity.md.
  bool local_gh = 9;
  // Retired: the agent name a project's project-home session ran (`home_agent`).
  reserved 10;
  reserved "home_agent";
  // The session this project runs as its **main** (project-home session) on this host, recorded by
  // `EnsureProjectHomeSession`. Empty = main is not set up.
  string home_session_id = 11;
  // What a new orchestrator for this project starts with on this host, saved from the project's
  // settings pane by `SetProjectOrchestratorDefaults`. Absent = none saved.
  OrchestratorDefaults orchestrator_defaults = 12;
  // RFC 3339 time the logical project was soft-deleted (DeleteProject). Empty = not deleted. A
  // listing reconciles every host's row of a project to its newest delete or restore event, so a
  // host that missed a delete shows the tombstone too.
  string deleted_at = 13;
  // The GitHub user who deleted it. Empty when not deleted.
  string deleted_by = 14;
  // RFC 3339 time the project was last restored (RestoreProject). Empty = never restored.
  string restored_at = 15;
}

message SetProjectDefaultBranchRequest {
  string session_token = 1;
  string project_id = 2;
  string main_branch_ref = 3;
  string daemon_instance_id = 4;
}

message SetProjectDefaultBranchResponse {
  ProjectEntry project = 1;
}

message SetProjectAccountsRequest {
  string session_token = 1;
  string project_id = 2;
  // The project's whole assignment set after this call. An empty list clears every assignment,
  // which is how a project is returned to "unassigned" — there is no separate clear RPC.
  repeated AccountAssignment accounts = 3;
  // Host to apply this to. Empty or matching the local instance = local; otherwise forwarded.
  string daemon_instance_id = 4;
  // The project's whole Local gh setting after this call, written together with `accounts`. Set
  // together with a github entry in `accounts` is refused: a project has one GitHub source.
  bool local_gh = 5;
}

message SetProjectAccountsResponse {
  ProjectEntry project = 1;
}

message SetProjectOrchestratorDefaultsRequest {
  string session_token = 1;
  string project_id = 2;
  // Host whose defaults these are. Empty or matching the local instance = local; otherwise
  // forwarded to that peer. Only that host's row changes.
  string daemon_instance_id = 3;
  // The project's whole defaults on that host after this call. Absent clears them.
  OrchestratorDefaults defaults = 4;
}

message SetProjectOrchestratorDefaultsResponse {
  // The project's row on the host that saved the defaults.
  ProjectEntry project = 1;
}

message UpdateProjectRequest {
  string session_token = 1;
  string project_id = 2;
  // The new display name. Required; the same rules as CreateProject's name.
  string name = 3;
  // Apply on this host only, without fanning out. Set on the forwarded calls of a fan-out.
  bool local_only = 4;
  // The project's new git URL. Empty = leave unchanged. Edits fan out with the rename: the URL is
  // a property of the logical project, the same on every host.
  string git_url = 5;
  // The project's new main checkout path on the host applying this change. Empty = leave unchanged.
  // Each host owns its own checkout, so a path never fans out: it must arrive with `local_only`.
  string main_repo_path = 6;
}

message UpdateProjectResponse {
  // The project's row on the first host that applied the change (this host when it owns one).
  ProjectEntry project = 1;
  // Every host that applied it.
  repeated string applied_hosts = 2;
  repeated UnconfirmedHost unconfirmed_hosts = 3;
}

message DeleteProjectRequest {
  string session_token = 1;
  string project_id = 2;
  // Apply on this host only, without fanning out. Set on the forwarded calls of a fan-out.
  bool local_only = 3;
  // Check, do not write: answer failed_precondition naming the project's running ordinary sessions
  // on this host, or OK. The fan-out's first phase, so no host is tombstoned while another refuses.
  bool preflight_only = 4;
  // The tombstone's time and author as the coordinating host stamped them; set on forwarded calls
  // so every host stores the same tombstone. Empty = stamp here.
  string deleted_at = 5;
  string deleted_by = 6;
}

message DeleteProjectResponse {
  ProjectEntry project = 1;
  repeated string applied_hosts = 2;
  repeated UnconfirmedHost unconfirmed_hosts = 3;
  // Project-home sessions the delete stopped (their data is kept), on every host that applied it.
  repeated string stopped_session_ids = 4;
}

message RestoreProjectRequest {
  string session_token = 1;
  string project_id = 2;
  // Apply on this host only, without fanning out. Set on the forwarded calls of a fan-out.
  bool local_only = 3;
  // The restore's time as the coordinating host stamped it; set on forwarded calls. Empty = stamp
  // here.
  string restored_at = 4;
}

message RestoreProjectResponse {
  ProjectEntry project = 1;
  repeated string applied_hosts = 2;
  repeated UnconfirmedHost unconfirmed_hosts = 3;
}
