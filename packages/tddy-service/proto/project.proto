syntax = "proto3";

package project;

// Projects: the repositories a daemon knows, their hosts, and their branches.
//
// Split out of `the pre-unbundle monolithic RPC coordinate` by `#unbundle` node 9 — family D — into a crate of its
// own rather than joining `tddy-worktree-service`. The two are adjacent (a worktree belongs to a
// project) but a project outlives every worktree cut from it, and `ListProjectBranches` reads the
// project's *main checkout*, not a worktree.
//
// Imports nothing: its messages are reached by no other service.

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Make an existing project available on another host (daemon instance), reusing its project_id.
  // Routed to the target daemon (local or forwarded over the LiveKit common room) which clones the
  // repo and registers a projects.yaml row with the same project_id. See
  // docs/ft/web/projects-screen-multi-host.md.
  rpc AddProjectToHost(AddProjectToHostRequest) returns (AddProjectToHostResponse);
  rpc ListProjectBranches(ListProjectBranchesRequest) returns (ListProjectBranchesResponse);
  // Set a project's default integration base ref (logical-project scope: forwarded to peer hosts
  // owning the same project_id). See docs/ft/coder/git-integration-base-ref.md.
  rpc SetProjectDefaultBranch(SetProjectDefaultBranchRequest) returns (SetProjectDefaultBranchResponse);
  // Set which account a project uses at each provider (logical-project scope: forwarded to peer
  // hosts owning the same project_id, exactly as SetProjectDefaultBranch is). The list REPLACES the
  // stored one, so two people editing concurrently cannot interleave into a set neither chose. At
  // most one account per provider; a second is refused rather than silently winning. See
  // `#keyring` 5/9.
  rpc SetProjectAccounts(SetProjectAccountsRequest) returns (SetProjectAccountsResponse);
  // Set the agent a project's project-home session runs (logical-project scope, routed exactly as
  // SetProjectDefaultBranch is). An empty `home_agent` clears it; an id `CatalogService.ListAgents`
  // does not list is refused and nothing is written. See `#project-home` 1/7.
  rpc SetProjectHomeAgent(SetProjectHomeAgentRequest) returns (SetProjectHomeAgentResponse);
}

// One provider's account, as assigned to a project.
//
// An account id is minted by the daemon that holds the credential and is unique only **within its
// provider**, so an assignment names both. Carries no secret and no label: it is a reference into a
// daemon's vault, resolved against `accounts.AccountsService` when it is needed.
message AccountAssignment {
  // Provider this assignment is for ("github", "cloudflare", ...).
  string provider = 1;
  // Account at that provider, as `accounts.AccountSummary.account_id` reports it.
  string account_id = 2;
}

message AddProjectToHostRequest {
  string session_token = 1;
  // Existing logical project id to reuse on the target host.
  string project_id = 2;
  string name = 3;
  string git_url = 4;
  // Optional integration base ref for the cloned checkout (empty = documented default).
  string main_branch_ref = 5;
  // Target daemon instance to add the project to. Empty or matching local instance = add locally.
  string daemon_instance_id = 6;
  // Optional clone destination relative to the OS user's home (same semantics as CreateProject).
  string user_relative_path = 7;
}

message AddProjectToHostResponse {
  // The registry row created (or already present) on the target host.
  ProjectEntry project = 1;
}

message CreateProjectRequest {
  string session_token = 1;
  string name = 2;
  string git_url = 3;
  // Optional path relative to the OS user's home (POSIX segments, e.g. "Code/my-app" or "~/Code/my-app").
  // When empty, the clone destination is ~/{repos_base_path}/{name}/ (default repos_base_path: "repos").
  string user_relative_path = 4;
}

message CreateProjectResponse {
  ProjectEntry project = 1;
}

message ListProjectBranchesRequest {
  string session_token = 1;
  string project_id = 2;
  string daemon_instance_id = 3;
}

message ListProjectBranchesResponse {
  repeated string branches = 1;
  // The default remote name the listed branches are tracked under (`origin`, `upstream`, ...).
  // Clients strip this prefix to recover local branch names. Empty means undetected; clients fall
  // back to `origin` only as a last resort.
  string default_remote = 2;
}

message ListProjectsRequest {
  string session_token = 1;
  // When true, return only this daemon's local registry rows and skip peer fan-out. Set by the
  // peer-project aggregation path so a fanned-out ListProjects does not recurse back into peers.
  bool local_only = 2;
}

message ListProjectsResponse {
  repeated ProjectEntry projects = 1;
}

message ProjectEntry {
  string project_id = 1;
  string name = 2;
  string git_url = 3;
  string main_repo_path = 4;
  // Owning daemon for this registry row (multi-daemon aggregated ListProjects).
  string daemon_instance_id = 5;
  // Stored default integration base ref (`<remote>/<branch>`, possibly multi-segment). Empty =
  // unset; legacy rows resolve their default live from the repository. See
  // docs/ft/coder/git-integration-base-ref.md.
  string main_branch_ref = 6;
  // Resolved default remote name for the project's main repo (`origin`, `upstream`, ...). Empty when
  // undetected (legacy rows without an upstream and without a stored `remote_name`). Clients use this
  // to normalize `<remote>/<branch>` picker values to local branch names without assuming `origin`.
  string default_remote = 7;
  // Accounts this project is assigned at each provider. Empty means **unassigned**, which is a
  // final answer rather than an invitation to guess: with no assignment the daemon resolves no
  // credential and the operation that wanted one fails. At most one entry per provider.
  repeated AccountAssignment accounts = 8;
  // The project's sessions take their GitHub identity from the host's own GitHub CLI (`gh auth
  // login` on each host, as the session's OS user) instead of from a vault account. A project with
  // this set has no github entry in `accounts`. See docs/ft/daemon/github-identity.md.
  bool local_gh = 9;
  // Agent id (a `CatalogService.ListAgents` row) the project's project-home session runs. Empty =
  // no home agent configured.
  string home_agent = 10;
}

message SetProjectDefaultBranchRequest {
  string session_token = 1;
  string project_id = 2;
  string main_branch_ref = 3;
  string daemon_instance_id = 4;
}

message SetProjectDefaultBranchResponse {
  ProjectEntry project = 1;
}

message SetProjectAccountsRequest {
  string session_token = 1;
  string project_id = 2;
  // The project's whole assignment set after this call. An empty list clears every assignment,
  // which is how a project is returned to "unassigned" — there is no separate clear RPC.
  repeated AccountAssignment accounts = 3;
  // Host to apply this to. Empty or matching the local instance = local; otherwise forwarded.
  string daemon_instance_id = 4;
  // The project's whole Local gh setting after this call, written together with `accounts`. Set
  // together with a github entry in `accounts` is refused: a project has one GitHub source.
  bool local_gh = 5;
}

message SetProjectAccountsResponse {
  ProjectEntry project = 1;
}

message SetProjectHomeAgentRequest {
  string session_token = 1;
  string project_id = 2;
  // Agent id to store; empty clears the setting.
  string home_agent = 3;
  // Host to apply this to. Empty or matching the local instance = local; otherwise forwarded.
  string daemon_instance_id = 4;
}

message SetProjectHomeAgentResponse {
  ProjectEntry project = 1;
}
