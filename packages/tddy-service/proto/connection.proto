// --- Agent Activity: the agent's own tool calls, streamed to the web pane ---

// One recorded state of an agent tool call. Mirrors tddy_core::agent_activity::AgentActivityRecord.
// The same call_id appears on the running row and the terminal row; the read side coalesces them.
message AgentActivityRecord {
  string call_id                     = 1;
  string tool_name                   = 2;
  google.protobuf.Value input        = 3;
  string status                      = 4;  // "running" | "completed" | "error"
  google.protobuf.Value result       = 5;
  string error_message               = 6;
  uint64 started_unix_ms             = 7;
  uint64 completed_unix_ms           = 8;
  string source                      = 9;  // "coder" | "cursor-cli" | "claude-cli" | "sandbox"
}

// Whether the stream replays the persisted history before tailing live records.
enum StreamMode {
  SNAPSHOT_THEN_LIVE = 0;   // default: replay the coalesced history, then tail live records
  LIVE_ONLY          = 1;   // skip the snapshot; deliver only records that arrive after subscribe
  // Count-first (StreamAcpReplay only): emit the current activity count as the first frame, then a
  // new count for each frame appended live. Carries no transcript payload — the cheap "minimal
  // activity data" that drives the Agent Activity icon/badge before the pane is opened.
  COUNT_THEN_LIVE    = 2;
  // Tail-first (StreamAcpReplay only): replay only the NEWEST `page_size` persisted frames — in
  // recorded order, oldest-first within the page — then tail live. Older frames are reached by
  // paging backwards with GetAcpReplayPage from the first delivered frame's `seq`.
  TAIL_THEN_LIVE     = 3;
}

message StreamSessionActivityRequest {
  string     session_token      = 1;
  string     session_id         = 2;
  string     daemon_instance_id = 3;
  StreamMode mode               = 4;   // snapshot-then-live (default) vs live-only
}

// Request for the read-only ACP transcript replay. Mirrors StreamSessionActivityRequest — same
// peer-forward routing and StreamMode semantics.
message StreamAcpReplayRequest {
  string     session_token      = 1;
  string     session_id         = 2;
  string     daemon_instance_id = 3;
  StreamMode mode               = 4;   // snapshot-then-live (default) vs live-only
  // TAIL_THEN_LIVE only: how many newest frames to replay. 0 ⇒ the server's default page size.
  uint32     page_size          = 5;
}

// One replay frame: a connection-local wrapper carrying an ACP `tddy.acp.v1.AcpAgentMessage`
// (session_update / error variant) as its protobuf-encoded bytes. Bytes (rather than a direct
// cross-package field) keep connection.proto self-contained — no import, no cross-package codegen —
// while preserving the exact ACP data model: the web decodes the bytes with the AcpAgentMessage
// schema and reuses the same session/update switch as the live ACP stream.
message AcpReplayFrame {
  bytes acp_agent_message = 1;
  // Set only in COUNT_THEN_LIVE frames (the current number of persisted transcript frames); the
  // SNAPSHOT_THEN_LIVE / LIVE_ONLY modes leave this 0 and carry acp_agent_message instead.
  uint64 activity_count = 2;
  // The frame's absolute 0-based position in the session's resolved transcript, oldest = 0. Carried
  // by every transcript frame (snapshot, tail page, and live tail). On the FIRST frame of a tail
  // page it doubles as the reverse cursor: `seq == 0` means the page reaches the transcript head.
  // COUNT_THEN_LIVE frames carry no transcript payload and leave it 0.
  uint64 seq = 3;
}

// Request for one tool call's full body. Mirrors StreamAcpReplayRequest's routing (same
// peer-forward semantics on daemon_instance_id) plus the tool_call_id to look up.
message GetAcpToolCallDetailRequest {
  string session_token      = 1;
  string session_id         = 2;
  string daemon_instance_id = 3;   // same peer-forward routing as StreamAcpReplay
  string tool_call_id       = 4;   // the ToolCall.tool_call_id from a streamed frame
}

// One tool call's stripped-out bodies: the exact JSON strings the stream used to inline. Either may
// be absent (e.g. a still-running call has raw_input but no raw_output yet). A tool_call_id absent
// from the transcript is a NOT_FOUND error, not an empty success.
message GetAcpToolCallDetailResponse {
  optional string raw_input  = 1;
  optional string raw_output = 2;
}

// One page of transcript frames strictly OLDER than `before_seq` — the reverse cursor behind the
// Activities transcript's scroll-up. Mirrors GetAcpToolCallDetail's routing (peer-forwarding on
// daemon_instance_id) and StreamAcpReplay's auth.
message GetAcpReplayPageRequest {
  string session_token      = 1;
  string session_id         = 2;
  string daemon_instance_id = 3;
  uint64 before_seq         = 4;   // exclusive upper bound; frames with seq < before_seq
  uint32 page_size          = 5;   // 0 ⇒ the server's default page size
}

// One page of the resolved transcript, oldest-first. `at_oldest` is an explicit field rather than
// `first_seq == 0` because an EMPTY page (the cursor is already at the head) would otherwise be
// indistinguishable from a one-frame page at the head.
message GetAcpReplayPageResponse {
  // Protobuf-encoded `tddy.acp.v1.AcpAgentMessage` frames, oldest-first, tool bodies stripped —
  // byte-identical in shape to AcpReplayFrame.acp_agent_message.
  repeated bytes frames    = 1;
  uint64         first_seq = 2;   // absolute seq of frames[0]; meaningless when `frames` is empty
  bool           at_oldest = 3;   // true when this page reaches the transcript head
}

/// Sent by `tddy-tools session-hook`; bearer is the per-session hook_token.
message ReportAgentActivityRequest {
  string session_id    = 1;
  string hook_token    = 2;
  string os_user       = 3;
  string event         = 4;  // "PreToolUse" | "PostToolUse"
  string tool_name     = 5;
  string input_json    = 6;
  string result_json   = 7;
  bool   is_error      = 8;
  string error_message = 9;
}

message ReportAgentActivityResponse {
  bool ok = 1;
}

// --- Demo VM lifecycle (UI-driven QEMU boot/shutdown for the demo goal) ---

message StartDemoVmRequest {
  string session_token = 1;
  string session_id    = 2;
}

// State of the demo VM for a session.
enum DemoVmState {
  DEMO_VM_STATE_UNKNOWN = 0;
  DEMO_VM_STATE_BOOTING = 1;
  DEMO_VM_STATE_RUNNING = 2;
  DEMO_VM_STATE_STOPPED = 3;
  DEMO_VM_STATE_ERROR   = 4;
}

message StartDemoVmResponse {
  DemoVmState state   = 1;
  string      message = 2;
}

message StopDemoVmRequest {
  string session_token = 1;
  string session_id    = 2;
}

message StopDemoVmResponse {
  bool   ok      = 1;
  string message = 2;
}

message GetDemoVmStatusRequest {
  string session_token = 1;
  string session_id    = 2;
}

message GetDemoVmStatusResponse {
  DemoVmState state         = 1;
  uint32      ssh_host_port = 2;
  string      message       = 3;
  // Present when state = RUNNING and an app port is configured (e.g. "http://localhost:8080").
  string      share_url     = 4;
}

// --- Single-screen terminal control mutex ---

message ClaimTerminalControlRequest {
  string session_token = 1;
  string session_id    = 2;
  // Stable per-browser-tab screen identity (see presenceIdentity.ts / screenId.ts).
  string screen_id     = 3;
  // When false, only grants if the lease is currently unheld or already held by this screen.
  // When true, always grants — evicts the previous holder and notifies via WatchTerminalControl.
  bool   steal         = 4;
}

message ClaimTerminalControlResponse {
  bool   granted                  = 1;
  // Set when granted = true; present this token in subsequent control RPCs.
  string control_token            = 2;
  // Set when granted = false; identifies the screen currently holding the lease.
  string current_holder_screen_id = 3;
}

message WatchTerminalControlRequest {
  string session_token = 1;
  string session_id    = 2;
  // The control token held by this screen (from ClaimTerminalControlResponse). Empty is valid for
  // a non-controlling observer that wants to watch for when the lease becomes available.
  string control_token = 3;
}

// Emitted once on subscribe (snapshot) and again whenever the lease changes.
message TerminalControlEvent {
  // Screen id of the current holder; empty when no screen holds the lease.
  string holder_screen_id   = 1;
  // True if the subscribing screen is the current controller (its token matches the lease).
  bool   you_are_controller = 2;
}

// --- PR-Stack Chat Screen: manually adding a planned PR ---

message AddPlannedPrRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack the new node is appended to.
  string session_id = 2;
  string title = 3;
  string description = 4;
  // Optional; empty string = none.
  string branch_suggestion = 5;
  // Ancestor node ids (StackNode.parents) chosen from the orchestrator's existing planned PRs.
  // Empty = root node (branches off the stack base).
  repeated string parents = 6;
  // Optional workflow recipe for the eventual child session (e.g. "tdd"). Empty = default ("tdd").
  string child_recipe = 7;
}

message AddPlannedPrResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.stack_plan_json` (field 23)
  // — callers re-use the existing `parseStackPlan` parser rather than a second message schema.
  string stack_plan_json = 1;
  // Node id of the node this call appended, assigned server-side. Named explicitly because the
  // caller cannot infer it: the orchestrator agent appends nodes too, so a plan returned to a web
  // client that last refreshed one poll ago can hold more than one node the client has never seen,
  // and picking any of them by position would open the "Add & start session" dialog on somebody
  // else's node. See docs/ft/coder/pr-stacking.md#seeding-the-stack-from-an-existing-session-added-2026-08-13.
  string node_id = 2;
}

// --- PR-Stack Chat Screen: live PR status & repoint (docs/ft/coder/pr-stack-live-status.md) ---

// Live GitHub PR status for one head branch.
message PrStatusView {
  // False when no PR (open, merged, or closed) exists for the queried head branch.
  bool exists = 1;
  uint64 number = 2;
  string url = 3;
  // "open" | "merged" | "closed" | "draft". Empty when exists = false.
  string state = 4;
  // True when the lookup could not be performed (no GitHub credential, rate limit, transport
  // error). Distinct from exists = false, which means "no PR exists for this head branch".
  bool unavailable = 5;
  // Operator-facing reason when unavailable = true; empty otherwise.
  string unavailable_reason = 6;
}

message GetPrStatusRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session — resolves the repo (owner/repo) to query.
  string session_id = 2;
  // Head branch to look up (the planned PR's branch).
  string branch = 3;
}
message GetPrStatusResponse {
  PrStatusView status = 1;
}

// --- PR-Stack Chat Screen: one-call branch resolution (session + worktree + PR) ---

message QueryBranchRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session — resolves the repo (owner/repo + repo_path) and the
  // sessions root to scan.
  string session_id = 2;
  // Head branch to resolve.
  string branch = 3;
  // The base the branch is compared against for `BranchResolution.base_sync`. Usually
  // `ProjectEntry.main_branch_ref`, so it commonly already carries a `<remote>/` prefix — the
  // daemon normalises one off before probing. Empty means the caller named no base, which is
  // reported as `base_sync.unavailable` rather than substituting one: the count beside a row must
  // describe the same base the row's own base line shows.
  string base_branch = 4;
}
message QueryBranchResponse {
  BranchResolution resolution = 1;
}

// Everything the PR-Stack view needs about one branch, resolved server-side by branch name.
message BranchResolution {
  // Echoes the request; lets a response self-identify.
  string branch = 1;
  // The in-progress child session working the branch.
  BranchSession session = 2;
  // The worktree checked out for the branch on disk.
  BranchWorktree worktree = 3;
  // Live GitHub PR status (reuses the existing PrStatusView).
  PrStatusView pr = 4;
  // The branch on `origin` — whether it can be based onto by a descendant's worktree.
  BranchRemote remote = 5;
  // How the branch stands against the base named in the request. Always present, including when
  // the request named no base — that is reported as `unavailable`, not omitted. Absent only from a
  // daemon that predates the field, which a client must read as "unknown" rather than "in sync".
  BranchBaseSync base_sync = 6;
}

// How a branch stands against its base: how far behind, how far ahead, and whether taking the
// base's commits would conflict.
//
// Computed with `git rev-list --left-right --count` and `git merge-tree --write-tree`, neither of
// which touches the index, the working tree, `HEAD`, any ref, or the network — the probe runs on a
// poll against worktrees that may have a live agent in them. It reads the base as of the last
// fetch, so it can report a branch behind that has just caught up, never the reverse.
message BranchBaseSync {
  // The base that was actually compared, which is not always the one requested: a requested
  // `origin/master` is normalised, and a base resolves remote-first. The row names this, not what
  // it asked for.
  string base_branch = 1;
  // Commits on the base that the branch lacks.
  uint32 behind_count = 2;
  // Commits on the branch that the base lacks.
  uint32 ahead_count = 3;
  // True when taking the base's commits would conflict. Always false when behind_count = 0, which
  // is short-circuited without a merge probe.
  bool has_conflicts = 4;
  // The files that cannot be merged, when has_conflicts = true.
  repeated string conflicted_paths = 5;
  // True when the comparison could not be made at all — no base named, no repository, an
  // unresolvable ref, unrelated histories. A failed comparison is byte-identical to a healthy one
  // (nothing behind, no conflicts), so it carries this discriminator and must never render as
  // "in sync".
  bool unavailable = 6;
  // Operator-facing reason when unavailable = true; empty otherwise.
  string unavailable_reason = 7;
  // The fully-resolved ref the base was read from, e.g. "origin/master" or "master".
  string base_ref = 8;
  // The fully-resolved ref the head was read from, e.g. "feature/x" or "origin/feature/x".
  string head_ref = 9;
}

// The remote-tracking state of a branch on `origin`.
message BranchRemote {
  // False when `origin/<branch>` is absent — a descendant cannot be based onto it yet.
  bool exists = 1;
  // Commit the remote ref points at when exists = true; empty otherwise.
  string sha = 2;
}
message BranchSession {
  // False when no session owns the branch.
  bool exists = 1;
  string session_id = 2;
  bool is_active = 3;
  // e.g. "active" | "idle".
  string status = 4;
}
message BranchWorktree {
  // False when no worktree is checked out for the branch.
  bool exists = 1;
  // Absolute worktree path when exists = true.
  string path = 2;
  // True when the worktree holds uncommitted changes to *tracked* files. Untracked files are
  // deliberately not dirtiness here: git refuses loudly rather than clobbering one, and counting
  // them would leave the pull control permanently blocked in any worktree an agent works in.
  bool dirty = 3;
  // The tracked paths with outstanding changes, when dirty = true.
  repeated string dirty_paths = 4;
}

message RepointPlannedPrRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The planned node to repoint (drop merged parents, rebase, re-target PR base).
  string node_id = 3;
  // The branch the node should be based onto after the repoint — the target the operator's
  // "Repoint to <target>" control named. The daemon retains exactly the parents that own this
  // branch and drops the rest; a target no parent owns means "detach", and the node's base
  // collapses to the project default. Rejected when it names neither the resolved default branch
  // nor any parent's branch. Empty keeps the original behaviour: drop merged parents only.
  string target_base_branch = 4;
}
message RepointPlannedPrResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.stack_plan_json` (field 23).
  string stack_plan_json = 1;
}

// --- PR-Stack Chat Screen: reordering the reading order ---

message ReorderPlannedPrRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The planned node to move.
  string node_id = 3;
  // "up" or "down". Moving past either end is a successful no-op — the control at the end of the
  // list is inert, not wrong.
  string direction = 4;
}
message ReorderPlannedPrResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.stack_plan_json` (field 23).
  string stack_plan_json = 1;
}

// --- PR-Stack Chat Screen: taking base changes into a node's branch ---

message PullBaseIntoBranchRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The node whose branch takes the base's commits. The pull runs in that node's own worktree.
  string node_id = 3;
  // The base to take from — the base the operator's control named, so the operation matches what
  // the row's base-sync badge stated.
  string base_branch = 4;
  // "merge" (default, and what an empty string means) or "rebase". Merge disturbs no review
  // anchors on the open PR and needs no force-push; rebase rewrites history and force-pushes with
  // a lease, which is the right trade only when the operator chooses it.
  string strategy = 5;
  // What to do about uncommitted changes to tracked files in the worktree. Empty refuses the pull
  // and names the paths; "commit" commits and pushes them first, then pulls.
  string dirty_worktree_action = 6;
  // The commit message for dirty_worktree_action = "commit". Meaningless otherwise.
  string commit_message = 7;
}
message PullBaseIntoBranchResponse {
  // The branch re-resolved after the pull, uncached — the refs just moved, so the row repaints
  // without waiting for the next poll tick.
  BranchResolution resolution = 1;
  // The strategy that actually ran: "merge" or "rebase".
  string strategy = 2;
  // False when the branch already contained every commit on its base, in which case nothing was
  // committed and nothing was pushed.
  bool changed = 3;
  // False when the push failed. The local merge or rebase still landed — rolling it back would be
  // strictly worse than reporting the truth.
  bool pushed = 4;
  // Why the push failed, when pushed = false and changed = true.
  string push_error = 5;
}

// --- Local peer-trust token minting (Unix-domain socket only) ---

message MintLocalTokenRequest {}
message MintLocalTokenResponse {
  string session_token = 1;
}

// --- Host Stats Footer: host-level telemetry for the selected daemon ---

message StreamHostStatsRequest {
  string session_token = 1;
}
// A single host-telemetry sample pushed by the daemon. Both blocks are always populated with the
// latest snapshot: on a fast CPU tick the (unchanged) disk block is re-sent, and vice versa.
message HostStatsEvent {
  HostCpuStats cpu = 1;  // always populated — latest CPU snapshot
  HostDiskStats disk = 2; // always populated — latest disk snapshot
}
message HostCpuStats {
  // Utilization percentage (0..100) of each logical core, core 0 first.
  repeated float per_core_percent = 1;
}
message HostDiskStats {
  // Free bytes on the filesystem containing the daemon's default project directory.
  uint64 available_bytes = 1;
  // Total bytes of that filesystem.
  uint64 total_bytes = 2;
  // Absolute path whose filesystem these figures describe (for tooltip/debug).
  string project_dir = 3;
}

// --- Terminal file drop upload ---

message UploadSessionFileChunkRequest {
  string session_token = 1;
  string session_id = 2;
  // Per-drop UUID grouping all files of one drag gesture into uploads/<upload_id>/.
  string upload_id = 3;
  // Basename only — path separators, "." / ".." and empty are rejected by the daemon.
  string file_name = 4;
  // Next chunk of this file's bytes; chunks for a given (upload_id, file_name) arrive in order.
  bytes data = 5;
  // True on the final chunk of this file — response then carries the absolute host_path.
  bool last = 6;
}

message UploadSessionFileChunkResponse {
  // Absolute host path of the written file; populated only when the request's `last` was true.
  string host_path = 1;
}

// --- Session Files inspector tab (list / delete uploaded files) ---

message ListSessionUploadsRequest {
  string session_token = 1;
  string session_id = 2;
}
message ListSessionUploadsResponse {
  repeated SessionUploadEntry uploads = 1;  // newest first
}
message SessionUploadEntry {
  string upload_id = 1;      // per-drop UUID subfolder
  string file_name = 2;      // basename
  string host_path = 3;      // absolute host path
  uint64 size_bytes = 4;
  int64 uploaded_at_ms = 5;  // file mtime, unix milliseconds
}

message DeleteSessionUploadRequest {
  string session_token = 1;
  string session_id = 2;
  string upload_id = 3;  // untrusted — validated as a basename, contained under uploads root
  string file_name = 4;  // untrusted — validated as a basename
}
message DeleteSessionUploadResponse {}

// --- Start-session attachments: pre-session staging upload + StartSessionRequest descriptors ---

message UploadStagedAttachmentChunkRequest {
  string session_token = 1;
  // Host authority to stage the bytes on. Empty or matching the local instance = stage locally.
  // A session can only consume a staged batch that lives on the host it starts on, so this is the
  // same daemon_instance_id the subsequent StartSession is addressed to.
  string daemon_instance_id = 2;
  // Client-generated UUID grouping all files of one Start-Session form into
  // {staging_root}/<staging_id>/. Untrusted — validated as a basename by the daemon.
  string staging_id = 3;
  // Basename only — path separators, "." / ".." and empty are rejected by the daemon.
  string file_name = 4;
  // Next chunk of this file's bytes; chunks for a given (staging_id, file_name) arrive in order.
  bytes data = 5;
  // True on the final chunk of this file — the response then carries the completed entry.
  bool last = 6;
}
message UploadStagedAttachmentChunkResponse {
  // The staged file, populated only when the request's `last` was true. Its `staging_id` /
  // `file_name` are what a StagedAttachmentRef refers to.
  StagedAttachmentEntry entry = 1;
}

message ListStagedAttachmentsRequest {
  string session_token = 1;
  // Host authority holding the staging area (see UploadStagedAttachmentChunkRequest).
  string daemon_instance_id = 2;
  // When set, list only this batch. Empty = every batch still staged for the caller.
  string staging_id = 3;
}
message ListStagedAttachmentsResponse {
  repeated StagedAttachmentEntry attachments = 1;  // newest first
}

message DeleteStagedAttachmentRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
  string staging_id = 3;  // untrusted — validated as a basename, contained under the staging root
  string file_name = 4;   // untrusted — validated as a basename
}
message DeleteStagedAttachmentResponse {}

// One file sitting in a host's pre-session staging area.
message StagedAttachmentEntry {
  // Host authority holding the bytes (the resolved daemon instance, never empty in a response).
  string daemon_instance_id = 1;
  string staging_id = 2;
  string file_name = 3;  // basename
  string host_path = 4;  // absolute host path of the staged file
  uint64 size_bytes = 5;
  int64 staged_at_ms = 6;  // file mtime, unix milliseconds
}

// One document attached to a session at start. The daemon running the session materializes each
// attachment under {session_dir}/attachments/<basename> before launching the agent, so the agent
// sees a plain local file regardless of which source variant produced it.
message SessionAttachment {
  // Basename the document is materialized under. Basename only — path separators, "." / ".." and
  // empty are rejected; duplicate basenames within one StartSessionRequest are a request error
  // (no silent renaming).
  string basename = 1;
  // Where the bytes come from. Exactly one variant must be set; an unset source is a request error.
  oneof source {
    // Bytes uploaded ahead of the session by UploadStagedAttachmentChunk.
    StagedAttachmentRef staged = 2;
    // A document that already exists on one of the connected hosts.
    HostDocumentRef host_document = 3;
  }
}

// Reference to a file in a host's pre-session staging area.
message StagedAttachmentRef {
  // Host authority holding the staged bytes — the daemon_instance_id UploadStagedAttachmentChunk
  // was addressed to. Must be the host the session starts on; a mismatch is a request error rather
  // than a cross-host fetch. Empty = the daemon handling the call.
  string daemon_instance_id = 1;
  string staging_id = 2;
  // Basename under the staging batch. Untrusted — validated as a basename contained under the
  // staging root. May differ from SessionAttachment.basename (the UI can rename an attachment).
  string file_name = 3;
}

// Reference to a document that already exists on a connected host — an artifacts/ planning doc, a
// file previously uploaded to a session, a worktree file, or a checked-in project doc.
message HostDocumentRef {
  // Host authority that owns the document. The read is performed by that daemon under its own
  // os_user mapping — the referencing client's host grants it no access. Empty = the daemon
  // handling the call.
  string daemon_instance_id = 1;
  // Root that `relative_path` resolves against. There is deliberately no "absolute host path"
  // scope: the owning daemon resolves the root itself and refuses a path that escapes it, so a
  // caller cannot name an arbitrary file on that host.
  HostDocumentScope scope = 2;
  // Owning session for the SESSION_* scopes; ignored otherwise.
  string session_id = 3;
  // Owning project for HOST_DOCUMENT_SCOPE_PROJECT_REPO; ignored otherwise.
  string project_id = 4;
  // Path relative to the resolved root: POSIX separators, no "." / ".." segments, not absolute.
  // For SESSION_ARTIFACT the basename of a SessionContextDoc; for SESSION_UPLOAD
  // "<upload_id>/<file_name>" (see SessionUploadEntry).
  string relative_path = 5;
}

enum HostDocumentScope {
  HOST_DOCUMENT_SCOPE_UNSPECIFIED = 0;
  // {session_dir}/artifacts/ — recipe-manifest planning docs (see SessionContextDoc).
  HOST_DOCUMENT_SCOPE_SESSION_ARTIFACT = 1;
  // {session_dir}/uploads/ — files already uploaded to a session (see SessionUploadEntry).
  HOST_DOCUMENT_SCOPE_SESSION_UPLOAD = 2;
  // The session's git worktree.
  HOST_DOCUMENT_SCOPE_SESSION_WORKTREE = 3;
  // The project's main checkout (ProjectEntry.main_repo_path) — e.g. a checked-in docs/ft/*.md.
  HOST_DOCUMENT_SCOPE_PROJECT_REPO = 4;
  // The caller's pre-session staging area on the owning host — the root
  // UploadStagedAttachmentChunk writes into. `relative_path` is "<staging_id>/<file_name>". A
  // staged file whose upload never completed (no final chunk) is refused with
  // FAILED_PRECONDITION, so a fetch never hands back truncated bytes.
  HOST_DOCUMENT_SCOPE_STAGED_ATTACHMENT = 5;
}

// Request to fetch one host document's bytes. Mirrors `HostDocumentRef` plus the caller's
// `session_token` (re-resolved to an os_user by the owning daemon, so the referencing client's
// host grants no access). Routes by `daemon_instance_id` like the staging RPCs: empty / matching
// the local instance = read locally; otherwise forwarded to the peer daemon.
message ReadHostDocumentRequest {
  string session_token = 1;
  string daemon_instance_id = 2;
  HostDocumentScope scope = 3;
  // Owning session for the SESSION_* scopes; ignored otherwise.
  string session_id = 4;
  // Owning project for HOST_DOCUMENT_SCOPE_PROJECT_REPO; ignored otherwise.
  string project_id = 5;
  // Path relative to the resolved root: POSIX separators, no "." / ".." segments, not absolute.
  string relative_path = 6;
}

// The document's bytes. `byte_size` equals `data.len()` — a file over `MAX_HOST_DOCUMENT_BYTES`
// is refused with INVALID_ARGUMENT (not truncated, since a truncated attachment is useless; the
// caller should stage larger docs, since staging is chunked with no single-message limit).
message ReadHostDocumentResponse {
  bytes data = 1;
  uint64 byte_size = 2;
}

// One frame of a StreamReadHostDocument response. The document's bytes are the concatenation of
// every frame's `data`, in arrival order.
message HostDocumentChunk {
  // Next slice of the document. A zero-byte document still yields exactly one frame, so a consumer
  // never has to distinguish "empty" from "nothing arrived".
  bytes data = 1;
  // Total size of the whole document, stamped on **every** frame — a consumer can size a progress
  // bar from the first frame without a separate preamble message.
  uint64 total_byte_size = 2;
}

// One event of a StreamStartSession response: progress while attachments materialize, then exactly
// one terminal result. The result is always the last event; a failure terminates the stream with a
// status instead, never with a result.
message StartSessionEvent {
  oneof event {
    AttachmentMaterializationProgress attachment_progress = 1;
    StartSessionResponse result = 2;
  }
}

// Progress materializing one of a start-session request's attachments.
message AttachmentMaterializationProgress {
  // SessionAttachment.basename of the attachment this event is about.
  string basename = 1;
  // Zero-based position of this attachment in the request's `attachments` list.
  uint32 attachment_index = 2;
  // Number of attachments in the request, so a consumer can render "n of m" from any single event.
  uint32 attachment_count = 3;
  // Bytes of this attachment materialized so far, and its full size.
