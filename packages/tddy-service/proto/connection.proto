// --- Remote-codebase mode: tool execution in session worktrees ---

message ExecuteToolRequest {
  string session_token      = 1;
  string session_id         = 2;
  string tool_name          = 3;
  string args_json          = 4;
  string daemon_instance_id = 5;
}

message ExecuteToolResponse {
  string result_json    = 1;
  bool   is_error       = 2;
  string error_message  = 3;
  string job_id         = 4;
  bool   job_running    = 5;
}

// One frame of a StreamExecuteTool response. The result is the concatenation of every frame's
// `result_chunk`, in arrival order, decoded as the UTF-8 of the unary call's `result_json`.
message ExecuteToolChunk {
  // Next slice of the result. An empty result still yields exactly one frame, so a consumer never
  // has to distinguish "empty result" from "nothing arrived".
  bytes  result_chunk   = 1;
  // Outcome of the call, carried on the final frame only — a tool error is a result, not an RPC
  // failure, exactly as in unary ExecuteTool. Only routing failures terminate the stream.
  bool   is_error       = 2;
  string error_message  = 3;
  string job_id         = 4;
  bool   job_running    = 5;
  // Final-frame marker. A stream that ends without it was truncated, not completed.
  bool   last           = 6;
}

message ListExecToolsRequest {
  string session_token      = 1;
  string daemon_instance_id = 2;
}

message ToolDef {
  string name              = 1;
  string description       = 2;
  string input_schema_json = 3;
}

message ListExecToolsResponse {
  repeated ToolDef tools = 1;
}

message ListSessionToolCallsRequest {
  string session_token      = 1;
  string session_id         = 2;
  string daemon_instance_id = 3;
}
message ToolCallInfo {
  string task_id          = 1;
  string tool_name        = 2;
  string args_json        = 3;
  string result_json      = 4;
  bool   is_error         = 5;
  string error_message    = 6;
  bool   job_running      = 7;
  uint64 created_unix_ms  = 8;
}
message ListSessionToolCallsResponse {
  repeated ToolCallInfo tool_calls = 1;
}

