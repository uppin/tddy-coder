syntax = "proto3";

package connection;

import "google/protobuf/struct.proto";
// `HostDocumentScope` is the one type this service shares with another served one: `StartSession`
// reaches it through `HostDocumentRef`, and `session_files.SessionFilesService` reaches it through
// `ReadHostDocument`. See types.proto for why nothing else lives there.
import "types.proto";

// Families I, J, K, R and S left this service for `session_files.SessionFilesService`
// (packages/tddy-service/proto/session_files.proto, 13 rpcs) and
// `terminal_session.TerminalSessionService`
// (packages/tddy-terminal-rpc/proto/terminal_session.proto, 9 rpcs). Their request, response and
// payload messages went with them; nothing that stayed referenced any of them, so no field number
// on a surviving message was vacated and none needed reserving. Protobuf has no `reserved` for
// service methods, so this note is the record that these 22 coordinates once answered here and
// must not be re-declared.

service ConnectionService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Models selectable for a given agent (or the "claude-cli" pseudo-agent). Enumerated from the
  // underlying agent command where possible (cursor --list-models, ACP available_models), else a
  // curated tddy-core list. Probes the agent subprocess, so it is called on demand per selected
  // agent — not folded into the cheap ListAgents. See docs/ft/web/tool-session-model-selection.md.
  rpc ListAgentModels(ListAgentModelsRequest) returns (ListAgentModelsResponse);
  // Specialized subagents (YAML-defined; see docs/ft/coder/specialized-subagents.md) available to
  // wire into a managed-codebase session — builtin defs plus <tddyhome>/agents/*.yaml.
  rpc ListSubagents(ListSubagentsRequest) returns (ListSubagentsResponse);
  // A session's agent roster (docs/ft/daemon/session-agent-roster.md) — the agents attached to a
  // LIVE session, mutated while it runs. Every call is served by the facilitating daemon, which
  // owns the roster; an agent owned by another daemon is resolved from that daemon and routed to it
  // off the qualified `agent_id` the entry stores.
  //
  // Attach is idempotent on (session, agent_id): re-attaching an already attached agent returns the
  // roster unchanged and does not bump `rev`. Detaching an agent that is not attached is NOT_FOUND,
  // not a silent success — a roster nobody can trust is worse than an error.
  rpc AttachSessionAgent(AttachSessionAgentRequest) returns (SessionAgentRoster);
  rpc DetachSessionAgent(DetachSessionAgentRequest) returns (SessionAgentRoster);
  rpc ListSessionAgents(ListSessionAgentsRequest) returns (SessionAgentRoster);
  // The roster, now and on every change. The first frame is always the current snapshot, so a late
  // subscriber needs no separate priming read, and a no-op attach emits nothing.
  rpc StreamSessionAgents(StreamSessionAgentsRequest) returns (stream SessionAgentRoster);
  // Conversation routing — the in-jail `tddy-tools` calls these on its facilitating daemon for
  // every roster agent, local or remote, so the main agent cannot tell which host answered. The
  // daemon runs a local entry in-process and forwards a remote entry to its owning daemon in the
  // session room.
  rpc OpenAgentConversation(OpenAgentConversationRequest) returns (OpenAgentConversationResponse);
  // Server-streaming for the same reason StreamExecuteTool is: an agent's answer has no useful
  // upper bound, and a payload over tddy_livekit::chunking::MAX_CHUNK_FRAME_BYTES is chunk-framed,
  // where one lost frame wedges the call with no error rather than failing it. Frames are bounded
  // below that budget instead.
  rpc PromptAgentConversation(PromptAgentConversationRequest) returns (stream AgentConversationChunk);
  rpc CancelAgentConversation(CancelAgentConversationRequest) returns (CancelAgentConversationResponse);
  // The owning daemon tells the facilitating daemon how its clone is doing: whether it is ready to
  // serve reads, where the checkout landed, and every reconcile it had to perform. The facilitating
  // daemon owns the roster and answers every read of it, but only the daemon holding the checkout
  // can say any of this — so it is pushed rather than polled, and a reconcile is reported rather
  // than absorbed (docs/ft/daemon/session-agent-roster.md § Kept current from the room).
  rpc ReportAgentCloneState(ReportAgentCloneStateRequest) returns (ReportAgentCloneStateResponse);
  // A conversation whose turn loop runs OUTSIDE the daemon telling it what that loop is doing.
  //
  // The daemon infers a roster agent's `status` from the conversation RPCs above, which works for
  // every agent whose loop it runs. An agent the in-jail `tddy-tools` was *seeded* with runs its
  // loop in the jail instead: the daemon is never asked to open anything, so it has nothing to
  // infer from and the row would report UNSPECIFIED for an agent that is demonstrably working.
  // This is that agent's own report, and the only possible source for it
  // (docs/ft/daemon/session-agent-roster.md § What an agent is doing).
  rpc ReportAgentConversationState(ReportAgentConversationStateRequest) returns (ReportAgentConversationStateResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Make an existing project available on another host (daemon instance), reusing its project_id.
  // Routed to the target daemon (local or forwarded over the LiveKit common room) which clones the
  // repo and registers a projects.yaml row with the same project_id. See
  // docs/ft/web/projects-screen-multi-host.md.
  rpc AddProjectToHost(AddProjectToHostRequest) returns (AddProjectToHostResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc ConnectSession(ConnectSessionRequest) returns (ConnectSessionResponse);
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  rpc SignalSession(SignalSessionRequest) returns (SignalSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListProjectBranches(ListProjectBranchesRequest) returns (ListProjectBranchesResponse);
  // Set a project's default integration base ref (logical-project scope: forwarded to peer hosts
  // owning the same project_id). See docs/ft/coder/git-integration-base-ref.md.
  rpc SetProjectDefaultBranch(SetProjectDefaultBranchRequest) returns (SetProjectDefaultBranchResponse);
  // Remote-codebase mode: execute a tool in a session worktree, or list available tools.
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  // Streaming twin of ExecuteTool, for a result past the transport's message-size budget. A `Read`
  // of a large file or a broad `Grep` crosses it on day one, and over LiveKit an oversized response
  // is chunk-framed with best-effort reassembly — one lost frame wedges the call with no error. The
  // frames here are bounded below that budget instead. Used by the split-placement tool path
  // (docs/ft/daemon/remote-managed-worktree.md); the unary call still serves stdio and HTTP.
  rpc StreamExecuteTool(ExecuteToolRequest) returns (stream ExecuteToolChunk);
  rpc ListExecTools(ListExecToolsRequest) returns (ListExecToolsResponse);
  rpc ListSessionToolCalls(ListSessionToolCallsRequest) returns (ListSessionToolCallsResponse);
  // Per-worktree hooks (claude-cli sessions only) report granular activity status.
  // Auth: `hook_token` is a per-session random token written to .session.yaml at session start.
  rpc ReportSessionStatus(ReportSessionStatusRequest) returns (ReportSessionStatusResponse);
  // Agent Activity pane — the agent's own tool calls (see docs/ft/web/agent-activity.md).
  // StreamSessionActivity replays the persisted agent-activity.jsonl snapshot then streams live
  // records for the session. ReportAgentActivity is called by per-worktree claude-cli hooks to
  // report a PreToolUse (running) / PostToolUse (terminal) pair; bearer is the hook_token.
  rpc StreamSessionActivity(StreamSessionActivityRequest) returns (stream AgentActivityRecord);
  rpc ReportAgentActivity(ReportAgentActivityRequest) returns (ReportAgentActivityResponse);
  // Session notifications — everything that happened in ANY of this daemon's sessions that an
  // operator should know about (docs/ft/daemon/session-notifications.md).
  // One subscription serves the whole session drawer: the events name the session they belong to,
  // so a drawer of twelve rows opens one stream, not twelve. Live-only by construction — a
  // notification describes a moment, and a replayed one would claim an agent is working now
  // because it was working when the tab was last open.
  rpc StreamSessionNotifications(StreamSessionNotificationsRequest) returns (stream SessionNotificationEvent);
  // The patch a call produced, scoped to that call's own files, so a participant can apply an
  // edit rather than merely learn that the checkout moved
  // (docs/ft/daemon/session-worktree-sync.md). This is the INCREMENTAL path only: a client that
  // has fallen behind resyncs by fetching the session's WIP ref over git, not by asking for an
  // ever-larger patch here. Streamed, not unary: a patch has no useful upper bound, and a payload
  // over tddy_livekit::chunking::MAX_CHUNK_FRAME_BYTES is chunk-framed, where a lost chunk wedges
  // the call with no error rather than failing it.
  rpc StreamAgentActivityDelta(AgentActivityDeltaRequest) returns (stream AgentActivityDeltaChunk);
  // Read-only ACP transcript for the activity pane (see docs/ft/web/agent-activity-pane.md
  // § Read-only ACP transcript). Replays the session's persisted acp-transcript.jsonl as ACP
  // session/update frames, then (SNAPSHOT_THEN_LIVE) tails the live presenter. Each AcpReplayFrame
  // wraps one AcpAgentMessage (only its session_update / error variants). Served over HTTP for any
  // session (live or dormant) — unlike the bidi, LiveKit-only AcpService.Session. The frame is
  // wrapped in a connection-local message so the cross-package reference is a field (prost
  // extern_path) rather than a service return type.
  rpc StreamAcpReplay(StreamAcpReplayRequest) returns (stream AcpReplayFrame);
  // On-demand tool-call body lookup for the Agent Activity detail dialog. StreamAcpReplay's
  // SNAPSHOT_THEN_LIVE / LIVE_ONLY frames carry a tool call's metadata only (title/status/kind/id) —
  // its raw_input/raw_output are stripped so the stream's size tracks the number of tool calls, not
  // the volume of their I/O. This unary returns one call's full raw_input/raw_output, resolved from
  // the same coalesced transcript the stream replays (acp-transcript.jsonl + agent-activity.jsonl
  // fallback). See docs/ft/coder/acp-replay-lazy-tool-bodies.md.
  rpc GetAcpToolCallDetail(GetAcpToolCallDetailRequest) returns (GetAcpToolCallDetailResponse);
  // The transcript's reverse cursor: one page of frames strictly OLDER than `before_seq`. A
  // TAIL_THEN_LIVE replay opens on the newest page, so reading further back is paging backwards from
  // the first delivered frame's `seq`. Unary (unlike the replay stream) so it peer-forwards on
  // daemon_instance_id exactly as GetAcpToolCallDetail does. See
  // docs/ft/web/agent-activity-pane.md § Read-only ACP transcript.
  rpc GetAcpReplayPage(GetAcpReplayPageRequest) returns (GetAcpReplayPageResponse);
  // Demo VM lifecycle — UI-driven QEMU boot/shutdown for the demo goal.
  rpc StartDemoVm(StartDemoVmRequest) returns (StartDemoVmResponse);
  rpc StopDemoVm(StopDemoVmRequest) returns (StopDemoVmResponse);
  rpc GetDemoVmStatus(GetDemoVmStatusRequest) returns (GetDemoVmStatusResponse);
  // PR-Stack Chat Screen: manually append a planned PR to an orchestrator session's stack,
  // choosing its ancestors (parent node ids) from the already-planned nodes. See
  // docs/ft/coder/pr-stacking.md § Manually adding a planned PR.
  rpc AddPlannedPr(AddPlannedPrRequest) returns (AddPlannedPrResponse);
  // PR-Stack Chat Screen: live GitHub PR status for one planned-PR branch (number, link, state).
  // Polled by the web so the stack view shows PR status without the orchestrator agent running.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc GetPrStatus(GetPrStatusRequest) returns (GetPrStatusResponse);
  // PR-Stack Chat Screen: repoint a planned node after a predecessor merged — drop merged parents,
  // rebase the local branch onto the effective base, and re-target the open PR's base branch.
  rpc RepointPlannedPr(RepointPlannedPrRequest) returns (RepointPlannedPrResponse);
  // PR-Stack Chat Screen: move one planned node up or down the operator's reading order. Changes
  // only `StackNode.display_order` — the dependency graph (`parents`) is a different fact and is
  // left alone. See docs/ft/coder/pr-stack-live-status.md.
  rpc ReorderPlannedPr(ReorderPlannedPrRequest) returns (ReorderPlannedPrResponse);
  // PR-Stack Chat Screen: take a base branch's commits into a planned node's branch, inside that
  // node's own worktree, and push the result. Merge by default; rebase on request.
  rpc PullBaseIntoBranch(PullBaseIntoBranchRequest) returns (PullBaseIntoBranchResponse);
  // PR-Stack Chat Screen: resolve one head branch to its in-progress child session, on-disk
  // worktree, and live GitHub PR status in a single call. Polled by the web per rendered branch.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc QueryBranch(QueryBranchRequest) returns (QueryBranchResponse);
  // Resolve, on the daemon that **owns** a PR-stack parent, what a child spawn's branch bases off.
  //
  // `stack_parent` is a bare session id, and every resolver behind it reads the parent's
  // `changeset.yaml` out of the serving daemon's own sessions tree. The new-session form's
  // orchestrator picker is fed by a fanned-out, all-host `ListSessions`, so it routinely offers an
  // orchestrator that lives on a different daemon than the child is started on — and resolved
  // locally that parent is not "not yet planned" but simply absent, which refuses the spawn over a
  // session that exists one host over.
  //
  // So the spawning daemon asks the owner instead. The owner is the only place the parent's stack,
  // its already-spawned child sessions and a checkout of the same logical project exist together,
  // which is exactly what the answer is assembled from. See docs/ft/coder/pr-stacking.md.
  rpc ResolveStackBase(ResolveStackBaseRequest) returns (ResolveStackBaseResponse);
  // Record, on the daemon that **owns** a PR-stack orchestrator, that one of its planned nodes has
  // been materialized: which child session did it, and which branch that session created.
  //
  // The write half of `ResolveStackBase`, routed for the same reason. A planned node lives in its
  // orchestrator's own `changeset.yaml`, so a child spawned on another host writing its own sessions
  // tree writes nothing at all — the node keeps neither a branch nor a child, and every descendant
  // stays unspawnable because `Stack::base_ref_for_spawn` gates on a parent owning a branch. See
  // docs/ft/coder/pr-stack-live-status.md (D35).
  rpc LinkStackNode(LinkStackNodeRequest) returns (LinkStackNodeResponse);
  // One measurement of a session's checkout, for the daemon hosting that session's room.
  //
  // A session room lives on the daemon running the session's agent; when the repo is remote that
  // daemon has no checkout to measure, so it asks the codebase daemon for the same snapshot the
  // codebase daemon would take of itself. One round trip per poll rather than three, because the
  // measurement is assembled where the files are.
  rpc GetWorktreeSnapshot(GetWorktreeSnapshotRequest) returns (GetWorktreeSnapshotResponse);
  // Local peer-trust: mint a session token for the caller identified by its SO_PEERCRED peer uid
  // over the daemon's Unix-domain socket. Available only on the local UDS transport (the peer
  // credential is not present on ConnectRPC-HTTP or LiveKit), and only for a peer uid mapped to a
  // configured user.
  rpc MintLocalToken(MintLocalTokenRequest) returns (MintLocalTokenResponse);
  // Streaming twin of StartSession, for a request carrying attachments the host must materialize
  // before the agent launches. Emits one AttachmentMaterializationProgress per attachment, then
  // exactly one terminal StartSessionResponse. A failure terminates the stream with the error and
  // never emits a result; the partial attachments are rolled back first. Unary StartSession stays
  // the entry point for every non-interactive caller.
  rpc StreamStartSession(StartSessionRequest) returns (stream StartSessionEvent);
}

message ListToolsRequest {}
message ListToolsResponse {
  repeated ToolInfo tools = 1;
}
message ToolInfo {
  string path = 1;
  string label = 2;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}
message AgentInfo {
  string id = 1;
  string label = 2;
}

message ListAgentModelsRequest {
  string session_token = 1;
  // Agent id ("claude", "cursor", "codex-acp", …) or the pseudo-agent "claude-cli".
  string agent = 2;
  // Optional daemon instance to run the probe on (multi-host). Empty = local.
  string daemon_instance_id = 3;
}
message ListAgentModelsResponse {
  repeated ModelInfo models = 1;
  // Id (within `models`) to preselect — the backend's current/default model.
  string default_model = 2;
}
message ModelInfo {
  // Value passed as --model (e.g. "gpt-5.2", "opus", "claude-opus-4-8").
  string id = 1;
  // Human-readable label (e.g. "GPT-5.2", "Claude Opus 4.8").
  string label = 2;
}

message ListSubagentsRequest {}
message ListSubagentsResponse {
  repeated SubagentInfo subagents = 1;
}
message SubagentInfo {
  string name = 1;
  string label = 2;
  string model = 3;
  // Stamped by the daemon that resolved this def. A picker fans ListSubagents out across every
  // common-room daemon, and two of them routinely answer with a def called "explorer" — without the
  // stamp the merged list cannot say which host offers which row.
  string daemon_instance_id = 4;
  // "name@daemon_instance_id", ready to hand to AttachSessionAgent. Carried rather than assembled
  // by the caller so the id a picker sends is the one the serving daemon minted, character for
  // character.
  string agent_id = 5;
  // Exec-catalog tools this agent would take over from the main agent, so a picker can warn what
  // the main agent loses before the operator attaches it.
  repeated string replaces = 6;
  // Exec-catalog tools the agent's own loop may call.
  repeated string tools = 7;
}

// ── Session agent roster (docs/ft/daemon/session-agent-roster.md) ──────────────────────────────

// Every roster read is a WHOLE snapshot. A consumer rebuilds its registry from it and never applies
// a delta, so a missed frame costs staleness until the next one rather than a registry that
// silently disagrees with the daemon's — which is the failure that matters here, because a
// disagreeing registry answers `subagent_new_session` for a detached agent and refuses an attached
// one. `rev` exists to detect staleness, not to reconstruct state.
message SessionAgentRoster {
  string session_id = 1;
  // Bumped on every attach and every detach that changed something. Starts at 1 for a session
  // started with a non-empty seed, 0 for one started with none.
  uint64 rev = 2;
  // In attach order. Detaching one leaves the rest where they were.
  repeated SessionAgentEntry agents = 3;
}

message SessionAgentEntry {
  // "explorer@ws-01" — the id the main agent addresses and the entry's identity.
  string agent_id = 1;
  string name = 2;
  string daemon_instance_id = 3;
  // Display only; from the def.
  string label = 4;
  // Display only; from the def.
  string model = 5;
  // Exec-catalog tools this agent takes over from the main agent, snapshotted at attach rather than
  // re-read from the def — otherwise editing a YAML def would silently change what a running
  // session's main agent may call. The union across the roster is what the main agent loses.
  repeated string replaces = 6;
  // Exec-catalog tools the agent's own loop may call. Snapshotted at attach for the same reason.
  repeated string tools = 7;
  // The `workspace` session on `daemon_instance_id` holding that daemon's clone. Empty when the
  // owning daemon is the facilitating daemon — a local agent works the real worktree.
  string codebase_session_id = 8;
  // An agent is attachable before its clone finishes provisioning; a prompt sent meanwhile is
  // refused naming this state, never queued and never served from an empty checkout.
  AgentCloneState clone_state = 9;
  // Why the clone failed, when `clone_state` is ERROR. Empty otherwise.
  string clone_error = 10;
  // What the agent is doing right now, as the facilitating daemon sees it. Rides the whole-snapshot
  // roster rather than a status RPC of its own: a reader that rebuilt its registry from a snapshot
  // and then had to correlate a second stream to learn what each row was doing is a reader that can
  // show a status for a row it no longer holds.
  //
  // UNSPECIFIED is not "idle" — it is "this daemon has nothing to say", which is what a roster
  // restored from `.session.yaml` after a restart honestly reports. Nothing that keeps a status is
  // persisted: what an agent is doing is a fact about a running loop, and a status restored from
  // disk would claim a turn is in flight in a process that never started one.
  SessionAgentStatus status = 11;
  // The agent's most recent observed activity, or unset when this daemon has observed none. Carried
  // beside `status` rather than folded into it because the two answer different questions: the
  // status is what the agent is doing *now*, and this is the last thing it was seen doing — which is
  // the only useful thing to show for an agent that is idle.
  SessionAgentActivity last_activity = 12;
}

// What a roster agent is doing, in the vocabulary the session activity hooks already use
// (tddy_core::session_activity::SessionActivityStatus), plus the two states only an agent whose
// codebase lives on another host can be in.
enum SessionAgentStatus {
  // This daemon has nothing to say about the agent — not a claim that it is idle. The state of a
  // roster read back from disk after a restart, and of any entry no signal has reached yet.
  SESSION_AGENT_STATUS_UNSPECIFIED = 0;
  // Attached and ready, with no turn in flight. An agent with no conversation open at all is IDLE
  // too: from the operator's side "nobody has asked it anything" and "it has answered everything
  // asked" are the same state, and splitting them would show a distinction nothing acts on.
  SESSION_AGENT_STATUS_IDLE = 1;
  // A turn is in flight: the agent has a prompt and has not produced its stop reason yet.
  SESSION_AGENT_STATUS_RUNNING = 2;
  // The agent's own loop is inside a tool call. A refinement of RUNNING, not a separate lifecycle:
  // every EXECUTING_TOOL is also a turn in flight.
  SESSION_AGENT_STATUS_EXECUTING_TOOL = 3;
  // The agent is blocked on an answer only a human can give.
  SESSION_AGENT_STATUS_WAITING_FOR_INPUT = 4;
  // The agent cannot serve a prompt yet because the checkout behind it is still being built. Takes
  // precedence over anything the conversation state would say: an agent whose clone is not ready
  // refuses prompts, so reporting it IDLE would offer an agent that cannot answer.
  SESSION_AGENT_STATUS_CONNECTING = 5;
  // The agent cannot serve prompts at all. `clone_error` on the same entry says why.
  SESSION_AGENT_STATUS_ERROR = 6;
}

// The last thing an agent was observed doing.
message SessionAgentActivity {
  // Unix milliseconds. Never 0 on a populated activity — a summary with no time behind it reads as
  // current forever, which is exactly wrong for the row it is shown on.
  uint64 at_unix_ms = 1;
  // One short human-readable line, already truncated for display ("Read src/main.rs", "prompted:
  // summarise the diff"). Not a structured record: the consumers are a roster pane and an MCP tool
  // that both render it verbatim, and the structured account of a call is StreamSessionActivity's.
  string summary = 2;
}

enum AgentCloneState {
  AGENT_CLONE_STATE_UNSPECIFIED = 0;
  // The owning daemon is the facilitating daemon: there is no clone, and there is nothing to wait
  // for. A distinct value from READY so a UI can say "local" rather than implying a checkout exists.
  AGENT_CLONE_STATE_LOCAL = 1;
  AGENT_CLONE_STATE_PROVISIONING = 2;
  AGENT_CLONE_STATE_READY = 3;
  AGENT_CLONE_STATE_ERROR = 4;
}

message AttachSessionAgentRequest {
  string session_token = 1;
  string session_id = 2;
  // Routing, as on ExecuteTool: which daemon serves the call. Empty = this one.
  string daemon_instance_id = 3;
  // "name@daemon_instance_id" — required, and required to be qualified. An id with no `@` is
  // INVALID_ARGUMENT; there is no "assume the local daemon" reading, because that reading silently
  // picks the wrong host once two daemons offer the same name.
  string agent_id = 4;
}

message DetachSessionAgentRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
  string agent_id = 4;
}

message ListSessionAgentsRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
}

message StreamSessionAgentsRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
}

message OpenAgentConversationRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
  // The roster entry to talk to. Resolved against the LIVE roster, so an id that was valid at spawn
  // and has since been detached is refused rather than served from a stale registry.
  string agent_id = 4;
  // Caller-chosen conversation id, so an open that times out still leaves the caller able to name —
  // and therefore cancel — whatever the daemon built. Empty = the daemon mints one.
  string conversation_id = 5;
}

message OpenAgentConversationResponse {
  string conversation_id = 1;
}

message PromptAgentConversationRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
  string conversation_id = 4;
  string prompt = 5;
}

message AgentConversationChunk {
  // Next slice of the agent's answer. An empty answer still yields exactly one frame, so a consumer
  // never has to distinguish "said nothing" from "nothing arrived".
  string content_chunk = 1;
  // Why the agent's turn ended ("EndTurn", "MaxTurns", …), carried on the final frame only.
  string stop_reason = 2;
  // Final-frame marker. A stream that ends without it was truncated, not completed — a partial
  // answer returned as if complete is exactly what a wedged chunk-framed payload looks like.
  bool last = 3;
}

message CancelAgentConversationRequest {
  string session_token = 1;
  string session_id = 2;
  string daemon_instance_id = 3;
  string conversation_id = 4;
}

message CancelAgentConversationResponse {}

// What makes a `workspace` session an agent clone. See StartSessionRequest.agent_clone.
// The agent half of a split placement, as the codebase daemon is told about it when it is asked to
// create the `workspace` session holding that agent's worktree
// (docs/ft/daemon/remote-managed-worktree.md).
//
// Both fields or neither: a daemon named with no session on it names a host but nothing that works
// in the checkout, which is exactly the claim the workspace session is persisting.
message SplitAgentPlacement {
  // The session whose agent works in the workspace session's worktree, reaching it only through
  // mcp__tddy-tools__* over that session's room.
  string session_id = 1;
  // The daemon running that session, as it is addressed in the common room (`daemon-{instance_id}`).
  string agent_daemon_instance_id = 2;
}
message AgentClonePlacement {
  // The session on the facilitating daemon this checkout mirrors. Names the room to join
  // (`session-{session_id}`) and the WIP ref to restore from.
  string session_id = 1;
  // The facilitating daemon, as it is addressed in that room (`daemon-{instance_id}`). Every
  // mutating tool call a roster agent on this host makes is proxied there — a mutation applied to
  // the clone would be overwritten by the next sync tick and would never reach the branch.
  string facilitating_daemon_instance_id = 2;
  // The facilitating daemon's Connect-HTTP root — the only address a peer that has never seen the
  // project can clone it from. `tddy-remote-git-repo` calls `auth.LiveKitTokenService/MintLiveKitToken`
  // against this URL to mint a common-room LiveKit token, then drives `remote_git.RemoteGitService/Serve`
  // over that room. Empty only when the owning daemon is the facilitating daemon itself, in which
  // case there is no clone to provision (PRD AC37).
  string facilitating_daemon_url = 3;
  // The first admission token — a scoped, short-TTL LiveKit token the facilitating daemon mints for
  // the owning daemon as part of the room-admission handshake (PRD § "What attach does" step 3). The
  // owning daemon joins `session-{session_id}` with this token and nothing else, then runs the
  // re-admit loop against `session_admission.SessionAdmissionService/AdmitOwningDaemon` over the
  // common room before it expires. Empty only when the facilitating daemon cannot mint (LiveKit not
  // configured), in which case the owning daemon falls back to self-minting — a recorded deviation,
  // never a silent one.
  string first_admission_token = 4;
  // The LiveKit server the admission token is valid against, and the session room it grants —
  // returned alongside `first_admission_token` so the owning daemon joins the right room on the
  // right server without re-deriving either. Empty when `first_admission_token` is empty.
  string first_admission_url = 5;
  string first_admission_room = 6;
}

message ReportAgentCloneStateRequest {
  string session_token = 1;
  // The facilitating daemon's session whose roster this clone serves.
  string session_id = 2;
  // The owning daemon reporting — the one holding the checkout.
  string daemon_instance_id = 3;
  // The `workspace` session on it that holds the checkout.
  string codebase_session_id = 4;
  AgentCloneState clone_state = 5;
  string clone_error = 6;
  // Where the checkout is, on the owning daemon's filesystem. The facilitating daemon never opens
  // it — it holds it so an operator (and the roster pane) can be told where a clone actually landed.
  string worktree_path = 7;
  // Reconciles performed since the previous report. Appended rather than replacing what the
  // facilitating daemon already holds: a mirror that repairs itself without saying so hides a real
  // fault, and a report that overwrote the history would hide it one report later instead.
  repeated string divergences = 8;
}

message ReportAgentCloneStateResponse {}

// Authenticated exactly as the conversation RPCs are, and that is not ceremony: the (session,
// agent) pair this names is published in the session's `session.agents` broadcast, so on the pair
// alone any participant that saw a roster frame could park an agent at RUNNING for ever.
message ReportAgentConversationStateRequest {
  string session_token = 1;
  string session_id = 2;
  // Routing, as on ExecuteTool: which daemon serves the call. Empty = this one.
  string daemon_instance_id = 3;
  // The roster agent whose loop is being reported on. An id the roster does not hold is refused
  // rather than recorded — a stale in-jail registry must not be able to invent a row.
  string agent_id = 4;
  // What that loop is doing. Only the four states a *conversation* can be in are accepted:
  // CONNECTING and ERROR belong to the checkout, which the daemon measures itself, and a reporter
  // allowed to send them could hide a broken clone behind a cheerful conversation.
  SessionAgentStatus status = 5;
  // One short line for `last_activity.summary`. Truncated by the daemon rather than trusted at the
  // length it arrives: the summary rides a whole-roster broadcast, where an oversized frame is
  // chunk-framed and one lost chunk wedges the call with no error.
  string summary = 6;
}

message ReportAgentConversationStateResponse {}

message ListSessionsRequest {
  string session_token = 1;
}
message ListSessionsResponse {
  repeated SessionEntry sessions = 1;
}
// Whether a context doc is recipe-owned or user-attached (docs/ft/coder/session-attachments.md).
enum SessionContextDocKind {
  // Recipe-owned planning artifact under artifacts/ (the zero value, so a producer or reader that
  // knows nothing about `kind` keeps treating rows as recipe-owned docs).
  SESSION_CONTEXT_DOC_KIND_MANIFEST = 0;
  // User-attached document under artifacts/attachments/.
  SESSION_CONTEXT_DOC_KIND_ATTACHMENT = 1;
}

// A planning document surfaced for a session (web Docs tab, child "Start session" prompts): either
// a recipe-manifest–derived artifact or a user attachment, told apart by `kind`. `path` is the
// absolute on-disk location; `exists` reflects whether the file is currently on disk, and
// `size_bytes` its size there (0 when it does not exist).
message SessionContextDoc {
  string key = 1;
  string basename = 2;
  string path = 3;
  string description = 4;
  bool exists = 5;
  SessionContextDocKind kind = 6;
  uint64 size_bytes = 7;
  // Path relative to the session's artifacts root — the address a HostDocumentRef under
  // HOST_DOCUMENT_SCOPE_SESSION_ARTIFACT uses. A stack-level manifest doc is its own basename, an
  // attachment is "attachments/<basename>", a per-PR document is "prs/<node_id>/<basename>". Sent
  // because a client cannot derive it: nothing in `kind` distinguishes a nested document from a
  // flat one.
  string relative_path = 8;
}

message SessionEntry {
  string session_id = 1;
  string created_at = 2;
  string status = 3;
  string repo_path = 4;
  uint32 pid = 5;
  bool is_active = 6;
  string project_id = 7;
  // Owning daemon instance for multi-host selection (local id for sessions on this daemon).
  string daemon_instance_id = 8;
  // Workflow / TUI parity (from .session.yaml + changeset.yaml enrichment).
  string workflow_goal = 9;
  string workflow_state = 10;
  // Human-readable elapsed for the active goal/step, or persisted timestamp display.
  string elapsed_display = 11;
  string agent = 12;
  string model = 13;
  // True when the session is blocked waiting for human input (elicitation).
  bool pending_elicitation = 14;
  // Granular activity status for claude-cli sessions (Started, Running, ExecutingTool,
  // WaitingForInput, Done, Ended). Empty string for tool/changeset sessions.
  string activity_status = 15;
  // Extra .session.yaml fields surfaced for the session inspector.
  string tool = 16;
  string session_type = 17;
  string updated_at = 18;
  string livekit_room = 19;
  string previous_session_id = 20;
  // Back-reference to the orchestrating PR-stack session that spawned this child session.
  // Empty string for non-child sessions.
  string orchestrator_session_id = 21;
  // Workflow recipe used when spawning this session (e.g. "tdd", "orchestrate-pr-stack",
  // "plan-pr-stack"). Empty string for claude-cli and workspace sessions.
  string recipe = 22;
  // JSON-serialized `Stack` (see tddy_core::changeset::Stack) for "pr-stack" orchestrator
  // sessions that have a plan. Empty string when this session is not a pr-stack orchestrator,
  // or the plan has not been written yet. Powers the PR-Stack Chat Screen's planned-PR list
  // (docs/ft/web/session-drawer.md § Per-Workflow Session Views).
  string stack_plan_json = 23;
  // Cumulative bytes received over the session's transport (LiveKit for tddy-coder sessions with
  // a participant; the gRPC terminal stream for claude-cli / cursor-cli / workspace sessions the
  // daemon owns). Populated by the daemon `ListSessions` for sessions it can observe; zero for
  // tddy-coder sessions with no LiveKit participant. Inspector fallback when no live runtime
  // exists (changeset 2026-07-12-fast-session-change).
  uint64 bytes_in = 24;
  // Cumulative bytes sent over the session's transport. See `bytes_in`.
  uint64 bytes_out = 25;
  // Epoch-milliseconds of the most recent data received over the session's transport, as a string.
  // Empty when no data has ever been received. Inspector fallback when no live runtime exists.
  string last_data_received_at = 26;
  // Recipe-manifest–derived planning documents for this session (e.g. exploration notes, the
  // stack plan) with per-doc existence and human descriptions. Empty for sessions whose recipe
  // is blank or unknown.
  repeated SessionContextDoc context_docs = 27;
  // The session's git branch (from Changeset.branch). Empty when the session has no branch yet.
  // Lets the PR-Stack view resolve the in-progress child session for a planned node by branch
  // (docs/ft/coder/pr-stack-live-status.md).
  string branch = 28;
  // Daemon instance holding this session's worktree, when it is not the daemon running the agent.
  // Empty for co-located sessions. Read from .session.yaml rather than stamped at read time like
  // `daemon_instance_id`: a split session has two hosts, and each would claim its own half. Lets
  // the web render "agent on A / codebase on B" (docs/ft/daemon/remote-managed-worktree.md).
  string codebase_daemon_instance_id = 29;
  // The paired `workspace` session on that daemon whose worktree this session works in.
  // Empty for co-located sessions.
  string codebase_session_id = 30;
  // What this session's agent is doing, inferred from its own ACP transcript and activity stream
  // (docs/ft/daemon/agent-session-status.md). The same vocabulary a roster agent reports, so one
  // badge renders both. UNSPECIFIED is "this daemon has nothing to say", never "idle" — and it is
  // what every non-agent session (workspace, tool, changeset) reports, because none runs an agent.
  //
  // `agent_status`, not `status`: field 3 is already a session's lifecycle string. The two are
  // different subjects — one is the session, one is the agent inside it. Distinct from
  // `activity_status` (15) too: that is the raw hook word a claude-cli or cursor worktree reports,
  // and this is an inference built partly on top of it.
  SessionAgentStatus agent_status = 31;
  // The last thing this session's agent was observed doing; unset when nothing has been observed,
  // and unset when the status came from the hook word alone (a bare timestamp with no summary
  // renders as an agent that did something unnameable just now).
  SessionAgentActivity last_activity = 32;
}

message ProjectEntry {
  string project_id = 1;
  string name = 2;
  string git_url = 3;
  string main_repo_path = 4;
  // Owning daemon for this registry row (multi-daemon aggregated ListProjects).
  string daemon_instance_id = 5;
  // Stored default integration base ref (`<remote>/<branch>`, possibly multi-segment). Empty =
  // unset; legacy rows resolve their default live from the repository. See
  // docs/ft/coder/git-integration-base-ref.md.
  string main_branch_ref = 6;
  // Resolved default remote name for the project's main repo (`origin`, `upstream`, ...). Empty when
  // undetected (legacy rows without an upstream and without a stored `remote_name`). Clients use this
  // to normalize `<remote>/<branch>` picker values to local branch names without assuming `origin`.
  string default_remote = 7;
}

message ListProjectsRequest {
  string session_token = 1;
  // When true, return only this daemon's local registry rows and skip peer fan-out. Set by the
  // peer-project aggregation path so a fanned-out ListProjects does not recurse back into peers.
  bool local_only = 2;
}
