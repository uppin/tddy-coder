syntax = "proto3";

package connection;

import "google/protobuf/struct.proto";

service ConnectionService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Models selectable for a given agent (or the "claude-cli" pseudo-agent). Enumerated from the
  // underlying agent command where possible (cursor --list-models, ACP available_models), else a
  // curated tddy-core list. Probes the agent subprocess, so it is called on demand per selected
  // agent — not folded into the cheap ListAgents. See docs/ft/web/tool-session-model-selection.md.
  rpc ListAgentModels(ListAgentModelsRequest) returns (ListAgentModelsResponse);
  // Specialized subagents (YAML-defined; see docs/ft/coder/specialized-subagents.md) available to
  // wire into a managed-codebase session — builtin defs plus <tddyhome>/agents/*.yaml.
  rpc ListSubagents(ListSubagentsRequest) returns (ListSubagentsResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // Make an existing project available on another host (daemon instance), reusing its project_id.
  // Routed to the target daemon (local or forwarded over the LiveKit common room) which clones the
  // repo and registers a projects.yaml row with the same project_id. See
  // docs/ft/web/projects-screen-multi-host.md.
  rpc AddProjectToHost(AddProjectToHostRequest) returns (AddProjectToHostResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc ConnectSession(ConnectSessionRequest) returns (ConnectSessionResponse);
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
  rpc SignalSession(SignalSessionRequest) returns (SignalSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListEligibleDaemons(ListEligibleDaemonsRequest) returns (ListEligibleDaemonsResponse);
  rpc ListSessionWorkflowFiles(ListSessionWorkflowFilesRequest) returns (ListSessionWorkflowFilesResponse);
  rpc ReadSessionWorkflowFile(ReadSessionWorkflowFileRequest) returns (ReadSessionWorkflowFileResponse);
  rpc ListWorktreesForProject(ListWorktreesForProjectRequest) returns (ListWorktreesForProjectResponse);
  rpc RemoveWorktree(RemoveWorktreeRequest) returns (RemoveWorktreeResponse);
  // Lazy, semaphore-bounded per-worktree disk usage (docs/ft/web/worktree-disk-usage-streaming.md).
  // StreamWorktreeStats emits a full snapshot frame, then one frame per worktree as its size flips
  // Calculating -> Cached. CalculateWorktreeSize (re)triggers one worktree; the result surfaces on
  // any open stream.
  rpc StreamWorktreeStats(StreamWorktreeStatsRequest) returns (stream WorktreeStatsEvent);
  rpc CalculateWorktreeSize(CalculateWorktreeSizeRequest) returns (CalculateWorktreeSizeResponse);
  // Session Worktree inspector tab (docs/ft/web/session-worktree-inspector.md).
  // CleanWorktree runs `git clean -fdx` in a secondary session worktree (membership-gated, primary
  // refused). RestoreSessionWorktree recreates a missing session worktree from its persisted
  // changeset (reusing tddy-core session-worktree setup).
  rpc CleanWorktree(CleanWorktreeRequest) returns (CleanWorktreeResponse);
  rpc RestoreSessionWorktree(RestoreSessionWorktreeRequest) returns (RestoreSessionWorktreeResponse);
  // Code pane: browse a session's worktree files (docs/ft/web/session-code-pane.md).
  rpc ListWorktreeDirectory(ListWorktreeDirectoryRequest) returns (ListWorktreeDirectoryResponse);
  rpc ReadWorktreeFile(ReadWorktreeFileRequest) returns (ReadWorktreeFileResponse);
  rpc StreamSessionTerminalIO(stream SessionTerminalInput) returns (stream SessionTerminalOutput);
  // Browser-compatible alternative: server-streaming output + separate unary input.
  // (connect-web fetch transport cannot send streaming request bodies required for bidi streaming.)
  rpc StreamTerminalOutput(StreamTerminalOutputRequest) returns (stream SessionTerminalOutput);
  rpc SendTerminalInput(SessionTerminalInput) returns (SendTerminalInputResponse);
  // Lazy history loading (scroll-up): one forward chunk of older output starting at the request's
  // `from_offset`, bounded above by `until_offset` (the anchor `end_offset` from
  // StreamTerminalOutput's initial replay frame), then the stream closes. The client advances
  // `from_offset` to the previous chunk's `end_offset` and calls again — a progressive, append-only
  // forward fill — until an `at_end` chunk terminates the fill. See docs/ft/daemon/terminal-sessions.md
  // § Lazy replay.
  rpc GetTerminalHistory(GetTerminalHistoryRequest) returns (stream TerminalHistoryChunk);
  // Multiple terminals per session — start/stop/list login-shell terminals attached to a session.
  // Every terminal is identified; the main `claude` terminal is the reserved id "main".
  rpc StartTerminalSession(StartTerminalSessionRequest) returns (StartTerminalSessionResponse);
  rpc StopTerminalSession(StopTerminalSessionRequest) returns (StopTerminalSessionResponse);
  rpc ListTerminalSessions(ListTerminalSessionsRequest) returns (ListTerminalSessionsResponse);
  rpc ListProjectBranches(ListProjectBranchesRequest) returns (ListProjectBranchesResponse);
  // Set a project's default integration base ref (logical-project scope: forwarded to peer hosts
  // owning the same project_id). See docs/ft/coder/git-integration-base-ref.md.
  rpc SetProjectDefaultBranch(SetProjectDefaultBranchRequest) returns (SetProjectDefaultBranchResponse);
  // Remote-codebase mode: execute a tool in a session worktree, or list available tools.
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  // Streaming twin of ExecuteTool, for a result past the transport's message-size budget. A `Read`
  // of a large file or a broad `Grep` crosses it on day one, and over LiveKit an oversized response
  // is chunk-framed with best-effort reassembly — one lost frame wedges the call with no error. The
  // frames here are bounded below that budget instead. Used by the split-placement tool path
  // (docs/ft/daemon/remote-managed-worktree.md); the unary call still serves stdio and HTTP.
  rpc StreamExecuteTool(ExecuteToolRequest) returns (stream ExecuteToolChunk);
  rpc ListExecTools(ListExecToolsRequest) returns (ListExecToolsResponse);
  rpc ListSessionToolCalls(ListSessionToolCallsRequest) returns (ListSessionToolCallsResponse);
  // Per-worktree hooks (claude-cli sessions only) report granular activity status.
  // Auth: `hook_token` is a per-session random token written to .session.yaml at session start.
  rpc ReportSessionStatus(ReportSessionStatusRequest) returns (ReportSessionStatusResponse);
  // Agent Activity pane — the agent's own tool calls (see docs/ft/web/agent-activity.md).
  // StreamSessionActivity replays the persisted agent-activity.jsonl snapshot then streams live
  // records for the session. ReportAgentActivity is called by per-worktree claude-cli hooks to
  // report a PreToolUse (running) / PostToolUse (terminal) pair; bearer is the hook_token.
  rpc StreamSessionActivity(StreamSessionActivityRequest) returns (stream AgentActivityRecord);
  rpc ReportAgentActivity(ReportAgentActivityRequest) returns (ReportAgentActivityResponse);
  // Read-only ACP transcript for the activity pane (see docs/ft/web/agent-activity-pane.md
  // § Read-only ACP transcript). Replays the session's persisted acp-transcript.jsonl as ACP
  // session/update frames, then (SNAPSHOT_THEN_LIVE) tails the live presenter. Each AcpReplayFrame
  // wraps one AcpAgentMessage (only its session_update / error variants). Served over HTTP for any
  // session (live or dormant) — unlike the bidi, LiveKit-only AcpService.Session. The frame is
  // wrapped in a connection-local message so the cross-package reference is a field (prost
  // extern_path) rather than a service return type.
  rpc StreamAcpReplay(StreamAcpReplayRequest) returns (stream AcpReplayFrame);
  // On-demand tool-call body lookup for the Agent Activity detail dialog. StreamAcpReplay's
  // SNAPSHOT_THEN_LIVE / LIVE_ONLY frames carry a tool call's metadata only (title/status/kind/id) —
  // its raw_input/raw_output are stripped so the stream's size tracks the number of tool calls, not
  // the volume of their I/O. This unary returns one call's full raw_input/raw_output, resolved from
  // the same coalesced transcript the stream replays (acp-transcript.jsonl + agent-activity.jsonl
  // fallback). See docs/ft/coder/acp-replay-lazy-tool-bodies.md.
  rpc GetAcpToolCallDetail(GetAcpToolCallDetailRequest) returns (GetAcpToolCallDetailResponse);
  // The transcript's reverse cursor: one page of frames strictly OLDER than `before_seq`. A
  // TAIL_THEN_LIVE replay opens on the newest page, so reading further back is paging backwards from
  // the first delivered frame's `seq`. Unary (unlike the replay stream) so it peer-forwards on
  // daemon_instance_id exactly as GetAcpToolCallDetail does. See
  // docs/ft/web/agent-activity-pane.md § Read-only ACP transcript.
  rpc GetAcpReplayPage(GetAcpReplayPageRequest) returns (GetAcpReplayPageResponse);
  // Demo VM lifecycle — UI-driven QEMU boot/shutdown for the demo goal.
  rpc StartDemoVm(StartDemoVmRequest) returns (StartDemoVmResponse);
  rpc StopDemoVm(StopDemoVmRequest) returns (StopDemoVmResponse);
  rpc GetDemoVmStatus(GetDemoVmStatusRequest) returns (GetDemoVmStatusResponse);
  // Single-screen terminal control mutex — at most one screen controls a session's terminals at a
  // time. ClaimTerminalControl issues or steals the exclusive control token; WatchTerminalControl
  // streams ownership changes so a displaced screen can render the "Claim terminal" CTA.
  rpc ClaimTerminalControl(ClaimTerminalControlRequest) returns (ClaimTerminalControlResponse);
  rpc WatchTerminalControl(WatchTerminalControlRequest) returns (stream TerminalControlEvent);
  // PR-Stack Chat Screen: manually append a planned PR to an orchestrator session's stack,
  // choosing its ancestors (parent node ids) from the already-planned nodes. See
  // docs/ft/coder/pr-stacking.md § Manually adding a planned PR.
  rpc AddPlannedPr(AddPlannedPrRequest) returns (AddPlannedPrResponse);
  // PR-Stack Chat Screen: live GitHub PR status for one planned-PR branch (number, link, state).
  // Polled by the web so the stack view shows PR status without the orchestrator agent running.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc GetPrStatus(GetPrStatusRequest) returns (GetPrStatusResponse);
  // PR-Stack Chat Screen: repoint a planned node after a predecessor merged — drop merged parents,
  // rebase the local branch onto the effective base, and re-target the open PR's base branch.
  rpc RepointPlannedPr(RepointPlannedPrRequest) returns (RepointPlannedPrResponse);
  // PR-Stack Chat Screen: move one planned node up or down the operator's reading order. Changes
  // only `StackNode.display_order` — the dependency graph (`parents`) is a different fact and is
  // left alone. See docs/ft/coder/pr-stack-live-status.md.
  rpc ReorderPlannedPr(ReorderPlannedPrRequest) returns (ReorderPlannedPrResponse);
  // PR-Stack Chat Screen: take a base branch's commits into a planned node's branch, inside that
  // node's own worktree, and push the result. Merge by default; rebase on request.
  rpc PullBaseIntoBranch(PullBaseIntoBranchRequest) returns (PullBaseIntoBranchResponse);
  // PR-Stack Chat Screen: resolve one head branch to its in-progress child session, on-disk
  // worktree, and live GitHub PR status in a single call. Polled by the web per rendered branch.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc QueryBranch(QueryBranchRequest) returns (QueryBranchResponse);
  // Local peer-trust: mint a session token for the caller identified by its SO_PEERCRED peer uid
  // over the daemon's Unix-domain socket. Available only on the local UDS transport (the peer
  // credential is not present on ConnectRPC-HTTP or LiveKit), and only for a peer uid mapped to a
  // configured user.
  rpc MintLocalToken(MintLocalTokenRequest) returns (MintLocalTokenResponse);
  // Host Stats Footer (see docs/ft/web/host-stats-footer.md) — host-level telemetry for the
  // selected daemon. Addressed to the daemon directly over the common-room LiveKit connection (no
  // daemon_instance_id payload needed) and validates `session_token`. The server owns the cadence:
  // it emits one HostStatsEvent immediately on subscribe, then refreshes CPU every 5 s and disk
  // every 60 s, pushing an event carrying the latest CPU and disk snapshot on each tick.
  rpc StreamHostStats(StreamHostStatsRequest) returns (stream HostStatsEvent);
  // Terminal file drop upload (see docs/ft/web/web-terminal.md § File drop upload). Files dropped
  // on the web terminal are chunked client-side and uploaded to
  // {session_dir}/uploads/{upload_id}/{file_name}; the response carries each file's absolute host
  // path on its final chunk so the web can type that path into the terminal.
  rpc UploadSessionFileChunk(UploadSessionFileChunkRequest) returns (UploadSessionFileChunkResponse);
  // Session Files inspector tab (see docs/ft/web/session-files-inspector.md). Lists the files
  // already uploaded to a session under {session_dir}/uploads/{upload_id}/{file_name} as a flat,
  // newest-first list, and deletes a single uploaded file on demand.
  rpc ListSessionUploads(ListSessionUploadsRequest) returns (ListSessionUploadsResponse);
  rpc DeleteSessionUpload(DeleteSessionUploadRequest) returns (DeleteSessionUploadResponse);
  // Start-session attachments — pre-session staging. Documents picked in the Start-Session form
  // are uploaded like the terminal "Attach" flow (client-side 48 KiB chunks, one unary per chunk,
  // `last` on the final one), but no session exists yet — so the bytes land in a per-host staging
  // area keyed by `staging_id` and are referenced from StartSessionRequest.attachments. The
  // staging root is restart-cleared (under the host's temp dir), so an abandoned batch does not
  // outlive the host process. List/Delete back the form's attachment chips (re-open, remove
  // before starting). See packages/tddy-daemon/docs/connection-service.md § Start-session
  // attachments.
  rpc UploadStagedAttachmentChunk(UploadStagedAttachmentChunkRequest) returns (UploadStagedAttachmentChunkResponse);
  rpc ListStagedAttachments(ListStagedAttachmentsRequest) returns (ListStagedAttachmentsResponse);
  rpc DeleteStagedAttachment(DeleteStagedAttachmentRequest) returns (DeleteStagedAttachmentResponse);
  // Fetch the bytes of a document that already exists on a connected host, for materializing a
  // `HostDocumentRef` during `StartSession`. Unary so it is forwardable over the LiveKit common
  // room. The owning daemon resolves the scope root under its own os_user mapping and refuses a
  // path that escapes; binary (attachments may be images), so it does not reuse the UTF-8 readers.
  // Capped at the transport's message-size budget — StreamReadHostDocument carries anything
  // larger. See docs/ft/coder/session-attachments.md and
  // packages/tddy-daemon/docs/connection-service.md § Start-session attachments.
  rpc ReadHostDocument(ReadHostDocumentRequest) returns (ReadHostDocumentResponse);
  // Streaming twin of ReadHostDocument, for a document past the unary message-size ceiling. Each
  // frame carries the next slice of bytes plus the document's total size, so a consumer can size a
  // progress bar without a preamble frame. A document over the host's configured attachment cap is
  // refused up front (INVALID_ARGUMENT) rather than streamed and truncated.
  rpc StreamReadHostDocument(ReadHostDocumentRequest) returns (stream HostDocumentChunk);
  // Streaming twin of StartSession, for a request carrying attachments the host must materialize
  // before the agent launches. Emits one AttachmentMaterializationProgress per attachment, then
  // exactly one terminal StartSessionResponse. A failure terminates the stream with the error and
  // never emits a result; the partial attachments are rolled back first. Unary StartSession stays
  // the entry point for every non-interactive caller.
  rpc StreamStartSession(StartSessionRequest) returns (stream StartSessionEvent);
}

message ListToolsRequest {}
message ListToolsResponse {
  repeated ToolInfo tools = 1;
}
message ToolInfo {
  string path = 1;
  string label = 2;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}
message AgentInfo {
  string id = 1;
  string label = 2;
}

message ListAgentModelsRequest {
  string session_token = 1;
  // Agent id ("claude", "cursor", "codex-acp", …) or the pseudo-agent "claude-cli".
  string agent = 2;
  // Optional daemon instance to run the probe on (multi-host). Empty = local.
  string daemon_instance_id = 3;
}
message ListAgentModelsResponse {
  repeated ModelInfo models = 1;
  // Id (within `models`) to preselect — the backend's current/default model.
  string default_model = 2;
}
message ModelInfo {
  // Value passed as --model (e.g. "gpt-5.2", "opus", "claude-opus-4-8").
  string id = 1;
  // Human-readable label (e.g. "GPT-5.2", "Claude Opus 4.8").
  string label = 2;
}

message ListSubagentsRequest {}
message ListSubagentsResponse {
  repeated SubagentInfo subagents = 1;
}
message SubagentInfo {
  string name = 1;
  string label = 2;
  string model = 3;
}

message ListSessionsRequest {
  string session_token = 1;
}
message ListSessionsResponse {
  repeated SessionEntry sessions = 1;
}
// Whether a context doc is recipe-owned or user-attached (docs/ft/coder/session-attachments.md).
enum SessionContextDocKind {
  // Recipe-owned planning artifact under artifacts/ (the zero value, so a producer or reader that
  // knows nothing about `kind` keeps treating rows as recipe-owned docs).
  SESSION_CONTEXT_DOC_KIND_MANIFEST = 0;
  // User-attached document under artifacts/attachments/.
  SESSION_CONTEXT_DOC_KIND_ATTACHMENT = 1;
}

// A planning document surfaced for a session (web Docs tab, child "Start session" prompts): either
// a recipe-manifest–derived artifact or a user attachment, told apart by `kind`. `path` is the
// absolute on-disk location; `exists` reflects whether the file is currently on disk, and
// `size_bytes` its size there (0 when it does not exist).
message SessionContextDoc {
  string key = 1;
  string basename = 2;
  string path = 3;
  string description = 4;
  bool exists = 5;
  SessionContextDocKind kind = 6;
  uint64 size_bytes = 7;
}

message SessionEntry {
  string session_id = 1;
  string created_at = 2;
  string status = 3;
  string repo_path = 4;
  uint32 pid = 5;
  bool is_active = 6;
  string project_id = 7;
  // Owning daemon instance for multi-host selection (local id for sessions on this daemon).
  string daemon_instance_id = 8;
  // Workflow / TUI parity (from .session.yaml + changeset.yaml enrichment).
  string workflow_goal = 9;
  string workflow_state = 10;
  // Human-readable elapsed for the active goal/step, or persisted timestamp display.
  string elapsed_display = 11;
  string agent = 12;
  string model = 13;
  // True when the session is blocked waiting for human input (elicitation).
  bool pending_elicitation = 14;
  // Granular activity status for claude-cli sessions (Started, Running, ExecutingTool,
  // WaitingForInput, Done, Ended). Empty string for tool/changeset sessions.
  string activity_status = 15;
  // Extra .session.yaml fields surfaced for the session inspector.
  string tool = 16;
  string session_type = 17;
  string updated_at = 18;
  string livekit_room = 19;
  string previous_session_id = 20;
  // Back-reference to the orchestrating PR-stack session that spawned this child session.
  // Empty string for non-child sessions.
  string orchestrator_session_id = 21;
  // Workflow recipe used when spawning this session (e.g. "tdd", "orchestrate-pr-stack",
  // "plan-pr-stack"). Empty string for claude-cli and workspace sessions.
  string recipe = 22;
  // JSON-serialized `Stack` (see tddy_core::changeset::Stack) for "pr-stack" orchestrator
  // sessions that have a plan. Empty string when this session is not a pr-stack orchestrator,
  // or the plan has not been written yet. Powers the PR-Stack Chat Screen's planned-PR list
  // (docs/ft/web/session-drawer.md § Per-Workflow Session Views).
  string stack_plan_json = 23;
  // Cumulative bytes received over the session's transport (LiveKit for tddy-coder sessions with
  // a participant; the gRPC terminal stream for claude-cli / cursor-cli / workspace sessions the
  // daemon owns). Populated by the daemon `ListSessions` for sessions it can observe; zero for
  // tddy-coder sessions with no LiveKit participant. Inspector fallback when no live runtime
  // exists (changeset 2026-07-12-fast-session-change).
  uint64 bytes_in = 24;
  // Cumulative bytes sent over the session's transport. See `bytes_in`.
  uint64 bytes_out = 25;
  // Epoch-milliseconds of the most recent data received over the session's transport, as a string.
  // Empty when no data has ever been received. Inspector fallback when no live runtime exists.
  string last_data_received_at = 26;
  // Recipe-manifest–derived planning documents for this session (e.g. exploration notes, the
  // stack plan) with per-doc existence and human descriptions. Empty for sessions whose recipe
  // is blank or unknown.
  repeated SessionContextDoc context_docs = 27;
  // The session's git branch (from Changeset.branch). Empty when the session has no branch yet.
  // Lets the PR-Stack view resolve the in-progress child session for a planned node by branch
  // (docs/ft/coder/pr-stack-live-status.md).
  string branch = 28;
  // Daemon instance holding this session's worktree, when it is not the daemon running the agent.
  // Empty for co-located sessions. Read from .session.yaml rather than stamped at read time like
  // `daemon_instance_id`: a split session has two hosts, and each would claim its own half. Lets
  // the web render "agent on A / codebase on B" (docs/ft/daemon/remote-managed-worktree.md).
  string codebase_daemon_instance_id = 29;
  // The paired `workspace` session on that daemon whose worktree this session works in.
  // Empty for co-located sessions.
  string codebase_session_id = 30;
}

message ProjectEntry {
  string project_id = 1;
  string name = 2;
  string git_url = 3;
  string main_repo_path = 4;
  // Owning daemon for this registry row (multi-daemon aggregated ListProjects).
  string daemon_instance_id = 5;
  // Stored default integration base ref (`<remote>/<branch>`, possibly multi-segment). Empty =
  // unset; legacy rows resolve their default live from the repository. See
  // docs/ft/coder/git-integration-base-ref.md.
  string main_branch_ref = 6;
  // Resolved default remote name for the project's main repo (`origin`, `upstream`, ...). Empty when
  // undetected (legacy rows without an upstream and without a stored `remote_name`). Clients use this
  // to normalize `<remote>/<branch>` picker values to local branch names without assuming `origin`.
  string default_remote = 7;
}

message ListProjectsRequest {
  string session_token = 1;
  // When true, return only this daemon's local registry rows and skip peer fan-out. Set by the
  // peer-project aggregation path so a fanned-out ListProjects does not recurse back into peers.
  bool local_only = 2;
}
message ListProjectsResponse {
  repeated ProjectEntry projects = 1;
}

message CreateProjectRequest {
  string session_token = 1;
  string name = 2;
  string git_url = 3;
  // Optional path relative to the OS user's home (POSIX segments, e.g. "Code/my-app" or "~/Code/my-app").
  // When empty, the clone destination is ~/{repos_base_path}/{name}/ (default repos_base_path: "repos").
  string user_relative_path = 4;
}
message CreateProjectResponse {
  ProjectEntry project = 1;
}

message AddProjectToHostRequest {
  string session_token = 1;
  // Existing logical project id to reuse on the target host.
  string project_id = 2;
  string name = 3;
  string git_url = 4;
  // Optional integration base ref for the cloned checkout (empty = documented default).
  string main_branch_ref = 5;
  // Target daemon instance to add the project to. Empty or matching local instance = add locally.
  string daemon_instance_id = 6;
  // Optional clone destination relative to the OS user's home (same semantics as CreateProject).
  string user_relative_path = 7;
}
message AddProjectToHostResponse {
  // The registry row created (or already present) on the target host.
  ProjectEntry project = 1;
}

message StartSessionRequest {
  string session_token = 1;
  // Path to the binary to spawn for this session only (from daemon allowlist). Not stored on the project.
  string tool_path = 2;
  string project_id = 3;
  // Per new session: passed to spawned tddy-coder as --agent (skips interactive backend menu). Not stored on the project.
  string agent = 4;
  // Target daemon instance to run this session on. Empty or matching local instance = spawn locally.
  string daemon_instance_id = 5;
  // Workflow recipe for the new session ("tdd" or "bugfix"). Empty means default (tdd).
  string recipe = 6;
  // Session type: "tool" (default/empty) spawns tddy-coder; "claude-cli" spawns the Claude Code CLI in a PTY.
  string session_type = 7;
  // Model id for claude-cli sessions (e.g. "claude-opus-4-8"). Required when session_type = "claude-cli".
  string model = 8;
  // Branch/worktree intent for claude-cli sessions. One of: "new_branch_from_base",
  // "work_on_selected_branch". Empty defaults to "new_branch_from_base" with a generated name.
  string branch_worktree_intent = 9;
  // Required when branch_worktree_intent = "new_branch_from_base". Name for the new branch.
  string new_branch_name = 10;
  // Optional override for the integration base ref (e.g. "origin/master"). When empty, the project's
  // main_branch_ref (or the daemon default) is used.
  string selected_integration_base_ref = 11;
  // Required when branch_worktree_intent = "work_on_selected_branch". The existing branch to check out.
  string selected_branch_to_work_on = 12;
  // Optional first prompt to pass as a positional argument to the claude CLI process on launch
  // (e.g. `claude "build feature X"`). Only used when session_type = "claude-cli". Empty = no prompt.
  // The session is still started interactively; the prompt seeds the first user turn.
  string initial_prompt = 13;
  // Permission mode for claude-cli sessions. Empty string defaults to "auto".
  // Valid values: "auto", "default", "acceptEdits", "plan", "bypassPermissions".
  // Passed as `--permission-mode <mode>` to the claude binary.
  string permission_mode = 14;
  // Optional: session ID of the orchestrating PR-stack session. When set, the spawned tddy-coder
  // receives `--stack-parent <id>` so it can back-reference the orchestrator.
  string stack_parent = 15;
  // When true with session_type = "claude-cli", spawn claude inside a platform sandbox (darwin Seatbelt).
  bool sandbox = 16;
  // Managed-codebase mode (see docs/ft/coder/managed-codebase-subagents.md): the sandboxed jail does
  // not mount the repo — the agent reaches it only via mcp__tddy-tools__* exec tools. Only meaningful
  // when session_type = "claude-cli" (and typically sandbox = true).
  bool managed_codebase = 17;
  // Names of specialized subagents (see docs/ft/coder/specialized-subagents.md) to wire into this
  // session's mcp__tddy-tools__subagent_* tools. Each name must resolve to a builtin or
  // <tddyhome>/agents/*.yaml def; an unresolvable name is a request error.
  repeated string specialized_agents = 18;
  // Absolute path to a local git checkout to use as the session worktree, sent by a local client
  // (e.g. tddy-sandbox-app) instead of selecting a configured project_id. When set, it overrides
  // project_id-based resolution. The session still runs as the caller's mapped os_user, so this
  // grants no access beyond that user. Empty = resolve from project_id as before.
  string repo_path = 24;
  // Extra arguments forwarded verbatim to the in-jail `claude` for claude-cli sessions (after any
  // recipe/config args; a trailing positional prompt lands last). Sent by local clients that carry
  // their own SandboxAppConfig. Empty = none.
  repeated string claude_args = 25;
  // When true with session_type = "claude-cli", pass `--dangerously-skip-permissions` to the claude
  // binary, bypassing all permission prompts. Mutually exclusive with permission_mode: when set, the
  // daemon omits `--permission-mode` (the claude CLI rejects using both together).
  bool dangerously_skip_permissions = 26;
  // Managed-codebase sessions with this set index the worktree before launch and expose the
  // SemanticSearch tool. Only meaningful when managed_codebase = true. See
  // docs/ft/coder/semantic-index.md.
  bool semantic_index = 27;
  // When true in "new_branch_from_base" mode, push the freshly created branch to origin
  // (`git push -u origin <branch>`) at session start and record Changeset.remote_pushed = true.
  // A push failure fails the session start (no silent fallback). See
  // docs/ft/coder/1-WIP/PRD-2026-07-25-branch-query-and-remote-branch.md.
  bool create_remote_branch = 28;
  // Documents to attach to the new session. Each descriptor names the basename the document is
  // materialized under plus where its bytes come from — a pre-session staged upload, or a document
  // that already exists on a connected host. The daemon materializes every attachment into
  // {session_dir}/artifacts/attachments/ before the agent launches; any failure fails the whole
  // start with no partial attachments left behind. Empty = no attachments. See
  // packages/tddy-daemon/docs/connection-service.md § Start-session attachments.
  repeated SessionAttachment attachments = 29;
  // How to handle `new_branch_name` naming a branch another session already owns. Only consulted in
  // "new_branch_from_base" mode with a non-empty `new_branch_name` — a generated branch name is
  // derived from the session uuid and cannot collide.
  //   ""       — create a suffixed branch (`<name>-1`, `-2`, …). What every existing caller gets.
  //   "reject" — create nothing; report the conflict in StartSessionResponse.branch_conflict.
  // Opt-in by design: only a surface that can prompt an operator asks to be rejected. See
  // docs/ft/daemon/session-branch-conflict.md.
  string on_branch_conflict = 30;
  // Existing session whose branch seeds a new pr-stack orchestrator's stack as its single root
  // node. Refused unless `recipe` resolves to "pr-stack". Empty leaves the stack unseeded, which is
  // the pre-existing behaviour (the agent plans it).
  string pr_stack_base_session_id = 31;
  // Daemon instance whose filesystem holds this session's git worktree. Empty or matching
  // `daemon_instance_id` = co-located (the pre-existing behaviour). When it names a different
  // eligible daemon, that daemon creates a `workspace` session holding the worktree and the agent
  // reaches it only via mcp__tddy-tools__* over LiveKit.
  // Requires managed_codebase = true and session_type = "claude-cli" — an agent that still has
  // native filesystem tools has nothing to proxy through, and cursor-cli cannot be prevented from
  // using them. A request breaking either rule is refused, not silently co-located. See
  // docs/ft/daemon/remote-managed-worktree.md.
  string codebase_daemon_instance_id = 32;
  // Session id to create the session under, chosen by the caller instead of generated by the
  // serving daemon. Only honoured for session_type = "workspace"; sending it with any other type is
  // a request error rather than a silently ignored field.
  // It exists for one reason: the daemon that places a split session's worktree on another host
  // must be able to name — and therefore delete — the workspace session even when the forwarded
  // StartSession never answers. Without it, a codebase daemon slower than the forward deadline
  // creates a worktree its originator can no longer identify, which is an orphan nothing points at.
  // Must be a single safe path segment and must not name a session that already exists on the
  // serving daemon. Empty = the serving daemon generates one, as before.
  // See docs/ft/daemon/remote-managed-worktree.md § Failure is atomic.
  string requested_session_id = 33;
  // Removed: discovery_subagent (single-name alias), fastcontext_url/fastcontext_model/
  // fastcontext_max_turns/subagent_replaces. All specialized-agent configuration (name, model,
  // base_url, max_turns, replaces) now comes exclusively from `specialized_agents` resolved
  // against the caller's YAML defs (or the builtin `fastcontext` def) — no caller-facing override,
  // no single-name alias. No backwards compatibility retained.
  reserved 19, 20, 21, 22, 23;
}
message StartSessionResponse {
  string session_id = 1;
  string livekit_room = 2;
  string livekit_url = 3;
  string livekit_server_identity = 4;
  // Set only when the request asked for on_branch_conflict = "reject" and a session already owns the
  // requested branch. `session_id` is then empty: no session directory, no branch and no worktree
  // were created. See docs/ft/daemon/session-branch-conflict.md.
  BranchConflict branch_conflict = 5;
}

// A refused session creation: the requested new branch is already owned by another session.
message BranchConflict {
  // The requested branch that is already owned.
  string branch = 1;
  // The session that owns it — prefers an active session, then the most recently updated.
  // `exists` is always true here.
  BranchSession owner = 2;
  // The first free suffixed name (e.g. "feat/auth-1") — what on_branch_conflict = "" would have
  // created. Pre-fills the rename field in the operator's prompt.
  string suggested_branch_name = 3;
}

