syntax = "proto3";

package work_queue;

import "types.proto";
import "session.proto";

// Planning, querying and repointing a stack of dependent pull requests.
//
// Split out of `the pre-unbundle monolithic RPC coordinate` by `#unbundle` node 8 — family P — and served from
// `tddy-workflow-recipes`, which already owns `orchestrate_pr_stack`, `work_queue`, `plan_pr_stack`
// and — since node 5 — the 14 PR-stack MCP tools. A `tddy-work-queue-service` crate would have split
// one domain across two.
//
// Imports `types.proto` for `BranchSession`, which `ListSessions` reaches too.

service WorkQueueService {
  // PR-Stack Chat Screen: manually append a planned PR to an orchestrator session's stack,
  // choosing its ancestors (parent node ids) from the already-planned nodes. See
  // docs/ft/coder/pr-stacking.md § Manually adding a planned PR.
  rpc AddWorkItem(AddWorkItemRequest) returns (AddWorkItemResponse);
  // PR-Stack Chat Screen: live GitHub PR status for one planned-PR branch (number, link, state).
  // Polled by the web so the stack view shows PR status without the orchestrator agent running.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc GetPrStatus(GetPrStatusRequest) returns (GetPrStatusResponse);
  // PR-Stack Chat Screen: repoint a planned node after a predecessor merged — drop merged parents,
  // rebase the local branch onto the effective base, and re-target the open PR's base branch.
  rpc RepointWorkItem(RepointWorkItemRequest) returns (RepointWorkItemResponse);
  // PR-Stack Chat Screen: move one planned node up or down the operator's reading order. Changes
  // only `WorkItem.display_order` — the dependency graph (`parents`) is a different fact and is
  // left alone. See docs/ft/coder/pr-stack-live-status.md.
  rpc ReorderWorkItem(ReorderWorkItemRequest) returns (ReorderWorkItemResponse);
  // PR-Stack Chat Screen: take a base branch's commits into a planned node's branch, inside that
  // node's own worktree, and push the result. Merge by default; rebase on request.
  rpc PullBaseIntoBranch(PullBaseIntoBranchRequest) returns (PullBaseIntoBranchResponse);
  // PR-Stack Chat Screen: resolve one head branch to its in-progress child session, on-disk
  // worktree, and live GitHub PR status in a single call. Polled by the web per rendered branch.
  // See docs/ft/coder/pr-stack-live-status.md.
  rpc QueryBranch(QueryBranchRequest) returns (QueryBranchResponse);
  // Resolve, on the daemon that **owns** a PR-stack parent, what a child spawn's branch bases off.
  //
  // `work_queue_parent` is a bare session id, and every resolver behind it reads the parent's
  // `changeset.yaml` out of the serving daemon's own sessions tree. The new-session form's
  // orchestrator picker is fed by a fanned-out, all-host `ListSessions`, so it routinely offers an
  // orchestrator that lives on a different daemon than the child is started on — and resolved
  // locally that parent is not "not yet planned" but simply absent, which refuses the spawn over a
  // session that exists one host over.
  //
  // So the spawning daemon asks the owner instead. The owner is the only place the parent's stack,
  // its already-spawned child sessions and a checkout of the same logical project exist together,
  // which is exactly what the answer is assembled from. See docs/ft/coder/pr-stacking.md.
  rpc ResolveWorkItemBase(ResolveWorkItemBaseRequest) returns (ResolveWorkItemBaseResponse);
  // Record, on the daemon that **owns** a PR-stack orchestrator, that one of its planned nodes has
  // been materialized: which child session did it, and which branch that session created.
  //
  // The write half of `ResolveWorkItemBase`, routed for the same reason. A planned node lives in its
  // orchestrator's own `changeset.yaml`, so a child spawned on another host writing its own sessions
  // tree writes nothing at all — the node keeps neither a branch nor a child, and every descendant
  // stays unspawnable because `Stack::base_ref_for_spawn` gates on a parent owning a branch. See
  // docs/ft/coder/pr-stack-live-status.md (D35).
  rpc LinkWorkItem(LinkWorkItemRequest) returns (LinkWorkItemResponse);
  // A project's work queues on every host that holds the project — one per owning session
  // (`#workqueue` 5/14). The daemon the call arrives on answers from its own sessions' queues and
  // asks each eligible peer for its own; a peer that does not answer is named in `unreachable_hosts`, never silently dropped.
  // See docs/ft/coder/pr-stacking.md.
  rpc ListProjectWorkQueues(ListProjectWorkQueuesRequest) returns (ListProjectWorkQueuesResponse);
  // One work queue by its address, served by the daemon that holds its owning session — forwarded
  // there when the address names another host.
  rpc GetWorkQueue(GetWorkQueueRequest) returns (GetWorkQueueResponse);

  // `#workqueue` 6/14: an existing PR, and tddy sessions, linked to a work item. Each answers the queue
  // after the change (same wire shape as `GetWorkQueueResponse.work_queue_json`).
  rpc AssignWorkItemPr(AssignWorkItemPrRequest) returns (WorkItemLinksResponse);
  rpc UnassignWorkItemPr(UnassignWorkItemPrRequest) returns (WorkItemLinksResponse);
  rpc LinkWorkItemSession(LinkWorkItemSessionRequest) returns (WorkItemLinksResponse);
  rpc UnlinkWorkItemSession(UnlinkWorkItemSessionRequest) returns (WorkItemLinksResponse);
  // `#workqueue` 6/14: the queue's PR state and check counts per item — a snapshot, then a new one
  // whenever the daemon's GitHub inbox reports a change to a PR or its checks. No browser polls.
  rpc StreamWorkQueueStatus(StreamWorkQueueStatusRequest) returns (stream WorkQueueStatusView);
  // The queue itself, live: its current snapshot first, then one per new revision — every write,
  // whoever makes it (an agent's tool, another session, this or any other view, a schedule firing).
  // Each snapshot is the whole queue, so a client replaces what it holds with the newest revision it
  // has seen; a reconnect's first snapshot resyncs it. Ends with `not_found` when the queue goes.
  // Served by the daemon that holds the queue: a client opens it on that host.
  rpc WatchWorkQueue(WatchWorkQueueRequest) returns (stream WorkQueueSnapshot);
  // `#workqueue` 7/14: labels and keyed badges on a work item; each answers the queue after the change.
  rpc SetWorkItemLabels(SetWorkItemLabelsRequest) returns (WorkItemLinksResponse);
  rpc SetWorkItemBadge(SetWorkItemBadgeRequest) returns (WorkItemLinksResponse);
  rpc ClearWorkItemBadge(ClearWorkItemBadgeRequest) returns (WorkItemLinksResponse);

  // `#workqueue` 9/14: replace what an item needs (its stored dependency edges). Refused when an item
  // is unknown or the edges would close a cycle (`failed_precondition`, naming the cycle); answers the
  // queue after the change.
  rpc SetWorkQueueDependencies(SetWorkQueueDependenciesRequest) returns (WorkItemLinksResponse);
  // `#workqueue` 9/14: the queue's lineage — each item's line edge (read from its PR's base through the
  // daemon's GitHub inbox, else its planned base) and the stored dependency edges.
  rpc GetWorkQueueGraph(GetWorkQueueGraphRequest) returns (WorkQueueGraphResponse);
  // `#workqueue` 10/14: the queue's waves, derived line and each item's readiness — computed from the
  // stored dependency edges; nothing is stored. A cycle is refused (`failed_precondition`, naming it).
  rpc GetWorkQueueWaves(GetWorkQueueWavesRequest) returns (WorkQueueWavesResponse);
  // `#workqueue` 11/14: what an item is missing (its inbox, each commit with its source and a conflict
  // prediction), what it owes its successors (its outbox), and every item's counts for the queue rows.
  // Read from remote tips after a fetch; no local branch, index or worktree is touched.
  rpc GetWorkItemInbox(GetWorkItemCommitFlowRequest) returns (WorkItemInboxResponse);
  rpc GetWorkItemOutbox(GetWorkItemCommitFlowRequest) returns (WorkItemOutboxResponse);
  rpc GetWorkQueueCommitCounts(GetWorkQueueGraphRequest) returns (WorkQueueCommitCountsResponse);
  // `#workqueue` 13/14: arm a merge or a propagation on an item (replacing what was armed), arm a wave's
  // merges bottom-up, disarm, and list with every condition evaluated live. Nothing here fires a
  // schedule (`#workqueue` 14/14).
  rpc ScheduleWorkItem(ScheduleWorkItemRequest) returns (ScheduleWorkItemResponse);
  rpc ScheduleWorkQueueWave(ScheduleWorkQueueWaveRequest) returns (ListWorkQueueSchedulesResponse);
  rpc UnscheduleWorkItem(UnscheduleWorkItemRequest) returns (ListWorkQueueSchedulesResponse);
  rpc ListWorkQueueSchedules(ListWorkQueueSchedulesRequest) returns (ListWorkQueueSchedulesResponse);
  // `#workqueue` 14/14: rebase an item onto its line parent's tip and push with lease (a refusal is an
  // answer naming the state and the actions that fix it), and land a range of waves in line order,
  // propagating what sits on each landed item before the next.
  rpc PropagateWorkItem(PropagateWorkItemRequest) returns (PropagateWorkItemResponse);
  rpc LandWorkQueue(LandWorkQueueRequest) returns (LandWorkQueueResponse);
  // Work item files: promote one uploaded or on-host file into an item's durable store, and remove
  // one. Both are served by the daemon that holds the queue (forwarded there when the address names
  // another host) and answer the queue after the change, so the queue view's attachment icon and
  // list update live. See docs/ft/coder/work-item-files.md.
  rpc AttachWorkItemFile(AttachWorkItemFileRequest) returns (WorkItemLinksResponse);
  rpc DetachWorkItemFile(DetachWorkItemFileRequest) returns (WorkItemLinksResponse);
}

// Where a work queue lives: the project it belongs to, its id — **the id of the session that owns it**
// (`#workqueue` 5/14) — and the daemon that holds that session.
//
// Carried by every request that reads or edits one queue, beside the owning `session_id` those
// requests may name instead. One of the two is required, and the address wins when both are set.
message WorkQueueAddress {
  // The logical project id — the same on every host that holds the project.
  string project_id = 1;
  // The owning session's id: a queue belongs to the session it was started with.
  string queue_id = 2;
  // The daemon whose store holds the stack. Empty or this daemon's own id = the daemon the call
  // arrived on; a peer's id = the call is forwarded there.
  string daemon_instance_id = 3;
}

message AddWorkItemRequest {
  string session_token = 1;
  // The session whose work queue the new item is appended to. A session that owns no queue is refused.
  string session_id = 2;
  string title = 3;
  string description = 4;
  // Optional; empty string = none.
  string branch_suggestion = 5;
  // Ancestor node ids (WorkItem.parents) chosen from the orchestrator's existing planned PRs.
  // Empty = root node (branches off the stack base).
  repeated string parents = 6;
  // Optional workflow recipe for the eventual child session (e.g. "tdd"). Empty = default ("tdd").
  string child_recipe = 7;
  // The stack this request acts on (`#orchestrators` 9/11). Required unless `session_id` names a
  // session whose changeset names its stack; wins over `session_id` when both are set.
  WorkQueueAddress stack = 8;
}

message AddWorkItemResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.work_queue_json` (field 23)
  // — callers re-use the existing `parseWorkQueue` parser rather than a second message schema.
  string work_queue_json = 1;
  // Node id of the node this call appended, assigned server-side. Named explicitly because the
  // caller cannot infer it: the orchestrator agent appends nodes too, so a plan returned to a web
  // client that last refreshed one poll ago can hold more than one node the client has never seen,
  // and picking any of them by position would open the "Add & start session" dialog on somebody
  // else's node. See docs/ft/coder/pr-stacking.md#seeding-the-stack-from-an-existing-session-added-2026-08-13.
  string item_id = 2;
}

// How a branch stands against its base: how far behind, how far ahead, and whether taking the
// base's commits would conflict.
//
// Computed with `git rev-list --left-right --count` and `git merge-tree --write-tree`, neither of
// which touches the index, the working tree, `HEAD`, any ref, or the network — the probe runs on a
// poll against worktrees that may have a live agent in them. It reads the base as of the last
// fetch, so it can report a branch behind that has just caught up, never the reverse.
message BranchBaseSync {
  // The base that was actually compared, which is not always the one requested: a requested
  // `origin/master` is normalised, and a base resolves remote-first. The row names this, not what
  // it asked for.
  string base_branch = 1;
  // Commits on the base that the branch lacks.
  uint32 behind_count = 2;
  // Commits on the branch that the base lacks.
  uint32 ahead_count = 3;
  // True when taking the base's commits would conflict. Always false when behind_count = 0, which
  // is short-circuited without a merge probe.
  bool has_conflicts = 4;
  // The files that cannot be merged, when has_conflicts = true.
  repeated string conflicted_paths = 5;
  // True when the comparison could not be made at all — no base named, no repository, an
  // unresolvable ref, unrelated histories. A failed comparison is byte-identical to a healthy one
  // (nothing behind, no conflicts), so it carries this discriminator and must never render as
  // "in sync".
  bool unavailable = 6;
  // Operator-facing reason when unavailable = true; empty otherwise.
  string unavailable_reason = 7;
  // The fully-resolved ref the base was read from, e.g. "origin/master" or "master".
  string base_ref = 8;
  // The fully-resolved ref the head was read from, e.g. "feature/x" or "origin/feature/x".
  string head_ref = 9;
}

// The remote-tracking state of a branch on `origin`.
message BranchRemote {
  // False when `origin/<branch>` is absent — a descendant cannot be based onto it yet.
  bool exists = 1;
  // Commit the remote ref points at when exists = true; empty otherwise.
  string sha = 2;
}

// Everything the PR-Stack view needs about one branch, resolved server-side by branch name.
message BranchResolution {
  // Echoes the request; lets a response self-identify.
  string branch = 1;
  // The in-progress child session working the branch.
  types.BranchSession session = 2;
  // The worktree checked out for the branch on disk.
  BranchWorktree worktree = 3;
  // Live GitHub PR status (reuses the existing PrStatusView).
  PrStatusView pr = 4;
  // The branch on `origin` — whether it can be based onto by a descendant's worktree.
  BranchRemote remote = 5;
  // How the branch stands against the base named in the request. Always present, including when
  // the request named no base — that is reported as `unavailable`, not omitted. Absent only from a
  // daemon that predates the field, which a client must read as "unknown" rather than "in sync".
  BranchBaseSync base_sync = 6;
}

message BranchWorktree {
  // False when no worktree is checked out for the branch.
  bool exists = 1;
  // Absolute worktree path when exists = true.
  string path = 2;
  // True when the worktree holds uncommitted changes to *tracked* files. Untracked files are
  // deliberately not dirtiness here: git refuses loudly rather than clobbering one, and counting
  // them would leave the pull control permanently blocked in any worktree an agent works in.
  bool dirty = 3;
  // The tracked paths with outstanding changes, when dirty = true.
  repeated string dirty_paths = 4;
}

message GetPrStatusRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session — resolves the repo (owner/repo) to query.
  string session_id = 2;
  // Head branch to look up (the planned PR's branch).
  string branch = 3;
  // The stack whose project resolves the repo (`#orchestrators` 9/11). Required unless `session_id`
  // names a session whose changeset names its stack; wins over `session_id` when both are set.
  WorkQueueAddress stack = 4;
}

message GetPrStatusResponse {
  PrStatusView status = 1;
}

// Record a child session and its branch on a planned node of a pr-stack orchestrator, on the daemon
// that owns that orchestrator.
message LinkWorkItemRequest {
  string session_token = 1;
  // The daemon whose sessions tree holds `orchestrator_session_id`. Empty or matching the local
  // instance = this daemon answers from its own disk.
  string daemon_instance_id = 2;
  // The pr-stack orchestrator whose plan holds the node.
  string orchestrator_session_id = 3;
  // The planned node to link. Required — a link is never derived from the branch on this path (D34).
  string item_id = 4;
  // The child session that materialized the node.
  string child_session_id = 5;
  // The branch that session created. Recorded as the node's `branch`, which is what makes the
  // node's descendants spawnable.
  string branch = 6;
}

message LinkWorkItemResponse {
  // The plan as it stands after the link, so a caller that renders it does not re-read.
  string work_queue_json = 1;
}

// Live GitHub PR status for one head branch.
message PrStatusView {
  // False when no PR (open, merged, or closed) exists for the queried head branch.
  bool exists = 1;
  uint64 number = 2;
  string url = 3;
  // "open" | "merged" | "closed" | "draft". Empty when exists = false.
  string state = 4;
  // True when the lookup could not be performed (no GitHub credential, rate limit, transport
  // error). Distinct from exists = false, which means "no PR exists for this head branch".
  bool unavailable = 5;
  // Operator-facing reason when unavailable = true; empty otherwise.
  string unavailable_reason = 6;
}

message PullBaseIntoBranchRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The node whose branch takes the base's commits. The pull runs in that node's own worktree.
  string item_id = 3;
  // The base to take from — the base the operator's control named, so the operation matches what
  // the row's base-sync badge stated.
  string base_branch = 4;
  // "merge" (default, and what an empty string means) or "rebase". Merge disturbs no review
  // anchors on the open PR and needs no force-push; rebase rewrites history and force-pushes with
  // a lease, which is the right trade only when the operator chooses it.
  string strategy = 5;
  // What to do about uncommitted changes to tracked files in the worktree. Empty refuses the pull
  // and names the paths; "commit" commits and pushes them first, then pulls.
  string dirty_worktree_action = 6;
  // The commit message for dirty_worktree_action = "commit". Meaningless otherwise.
  string commit_message = 7;
  // The stack this request acts on (`#orchestrators` 9/11). Required unless `session_id` names a
  // session whose changeset names its stack; wins over `session_id` when both are set.
  WorkQueueAddress stack = 8;
}

message PullBaseIntoBranchResponse {
  // The branch re-resolved after the pull, uncached — the refs just moved, so the row repaints
  // without waiting for the next poll tick.
  BranchResolution resolution = 1;
  // The strategy that actually ran: "merge" or "rebase".
  string strategy = 2;
  // False when the branch already contained every commit on its base, in which case nothing was
  // committed and nothing was pushed.
  bool changed = 3;
  // False when the push failed. The local merge or rebase still landed — rolling it back would be
  // strictly worse than reporting the truth.
  bool pushed = 4;
  // Why the push failed, when pushed = false and changed = true.
  string push_error = 5;
}

message QueryBranchRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session — resolves the repo (owner/repo + repo_path) and the
  // sessions root to scan.
  string session_id = 2;
  // Head branch to resolve.
  string branch = 3;
  // The base the branch is compared against for `BranchResolution.base_sync`. Usually
  // `ProjectEntry.main_branch_ref`, so it commonly already carries a `<remote>/` prefix — the
  // daemon normalises one off before probing. Empty means the caller named no base, which is
  // reported as `base_sync.unavailable` rather than substituting one: the count beside a row must
  // describe the same base the row's own base line shows.
  string base_branch = 4;
  // The stack whose project resolves the repo and the sessions to scan (`#orchestrators` 9/11).
  // Required unless `session_id` names a session whose changeset names its stack; wins over
  // `session_id` when both are set.
  WorkQueueAddress stack = 5;
}

message QueryBranchResponse {
  BranchResolution resolution = 1;
}

message ReorderWorkItemRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The planned node to move.
  string item_id = 3;
  // "up" or "down". Moving past either end is a successful no-op — the control at the end of the
  // list is inert, not wrong.
  string direction = 4;
  // The stack this request acts on (`#orchestrators` 9/11). Required unless `session_id` names a
  // session whose changeset names its stack; wins over `session_id` when both are set.
  WorkQueueAddress stack = 5;
}

message ReorderWorkItemResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.work_queue_json` (field 23).
  string work_queue_json = 1;
}

message RepointWorkItemRequest {
  string session_token = 1;
  // The "pr-stack" orchestrator session whose Changeset.stack holds the node.
  string session_id = 2;
  // The planned node to repoint (drop merged parents, rebase, re-target PR base).
  string item_id = 3;
  // The branch the node should be based onto after the repoint — the target the operator's
  // "Repoint to <target>" control named. The daemon retains exactly the parents that own this
  // branch and drops the rest; a target no parent owns means "detach", and the node's base
  // collapses to the project default. Rejected when it names neither the resolved default branch
  // nor any parent's branch. Empty keeps the original behaviour: drop merged parents only.
  string target_base_branch = 4;
  // The stack this request acts on (`#orchestrators` 9/11). Required unless `session_id` names a
  // session whose changeset names its stack; wins over `session_id` when both are set.
  WorkQueueAddress stack = 5;
}

message RepointWorkItemResponse {
  // Updated JSON-serialized `Stack`, same wire shape as `SessionEntry.work_queue_json` (field 23).
  string work_queue_json = 1;
}

// What a child spawn's branch bases off, asked of the daemon that owns the stack parent.
message ResolveWorkItemBaseRequest {
  string session_token = 1;
  // The daemon whose sessions tree holds `work_queue_parent`. Empty or matching the local instance =
  // this daemon answers from its own disk, which is what every single-host deployment — and every
  // caller predating the field — sends. Naming a daemon this one shares no common room with is a
  // request error, not a silent local answer.
  string daemon_instance_id = 2;
  // The parent session: a pr-stack orchestrator, whose planned node for `new_branch_name` names the
  // ancestor to base onto, or an ordinary code session, whose own branch it is.
  string work_queue_parent = 3;
  // The **logical** project id, which is stable across hosts (`AddProjectToHost` reuses it rather
  // than minting a new one). That is what lets the owner resolve *its* checkout of the same
  // repository from the id the child's host sent: the base is a remote-tracking ref, so the two
  // checkouts need only share an origin, not a path.
  string project_id = 4;
  // The branch the child spawn is about to create — how the planned node it belongs to is found
  // when, and only when, `work_item_id` is empty.
  string new_branch_name = 5;
  // The planned node the child spawn materializes, as the surface that started it named it. Takes
  // precedence over `new_branch_name` (D34): the branch is the operator's to edit in the create
  // dialog before confirming, and a node carrying no `branch_suggestion` never matched a typed name
  // at all — either way the branch-derived lookup finds no node, and "no node" means no ordering
  // gate runs and the child is cut from the project default for a node whose non-merged parent owns
  // no branch. Empty keeps the branch-derived lookup.
  string work_item_id = 6;
}

message ResolveWorkItemBaseResponse {
  // The remote-tracking ref the child's worktree is cut from (e.g. `origin/feature/token-store`).
  // Empty means the parent named no chain base — an unplanned branch, on a stack that has one for
  // other branches — and the child's host applies the project default instead. That is not an
  // error, and is deliberately distinct from one: a spawn refused here reports the owner's own
  // refusal verbatim.
  string base_ref = 1;
}

message ListProjectWorkQueuesRequest {
  string session_token = 1;
  // The logical project whose stacks are listed.
  string project_id = 2;
  // True on the copy a daemon forwards to its peers: answer from this daemon's own store only, so a
  // listing fans out exactly one hop.
  bool this_host_only = 3;
}

// How far one stack has come, counted over its planned nodes.
message WorkItemCounts {
  // Every planned node.
  uint32 total = 1;
  // Nodes a child session has materialized — they record a session or a branch.
  uint32 started = 2;
  // Nodes whose pull request merged.
  uint32 merged = 3;
}

// One stack of a project, as the drawer lists it.
message WorkQueueSummary {
  // Where the queue lives — the address every other request about it carries.
  WorkQueueAddress address = 1;
  // What the queue is for; empty for a queue that was never titled.
  string title = 2;
  WorkItemCounts node_counts = 3;
  // The session on the owning host that owns this queue (its `queue_id`).
  repeated string referencing_session_ids = 4;
  // The session that owns the queue — the same id as its `queue_id` (`#workqueue` 5/14).
  string created_by_session_id = 5;
  uint64 created_at_unix_ms = 6;
}

// A host the listing asked and got no answer from.
message UnreachableWorkQueueHost {
  string daemon_instance_id = 1;
  // Operator-facing reason: the forwarding error the peer call ended with.
  string reason = 2;
}

message ListProjectWorkQueuesResponse {
  // Every stack of the project on every host that answered.
  repeated WorkQueueSummary stacks = 1;
  // Every eligible host that did not answer. Its stacks are missing from `stacks`, and saying so is
  // the difference between "no stacks there" and "could not ask".
  repeated UnreachableWorkQueueHost unreachable_hosts = 2;
}

message GetWorkQueueRequest {
  string session_token = 1;
  // The stack to read. Forwarded to `stack.daemon_instance_id` when that names a peer.
  WorkQueueAddress stack = 2;
}

message GetWorkQueueResponse {
  WorkQueueSummary summary = 1;
  // The stack, same wire shape as `SessionEntry.work_queue_json` (field 23) — read with the
  // existing `parseWorkQueue`.
  string work_queue_json = 2;
}

// `#workqueue` 6/14 — work-item links.
message AssignWorkItemPrRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  uint64 pull_number = 4;
}

message UnassignWorkItemPrRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
}

message LinkWorkItemSessionRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  string session_id = 4;
  // The daemon holding `session_id`; empty for the queue's own host.
  string daemon_instance_id = 5;
}

message UnlinkWorkItemSessionRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  string session_id = 4;
}

message WorkItemLinksResponse {
  string work_queue_json = 1;
}


message WatchWorkQueueRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
}

// One revision of a work queue.
message WorkQueueSnapshot {
  // The queue's revision — the same number as `revision` inside `work_queue_json`. It only grows: a
  // client ignores a snapshot (or a mutation's answer) no newer than the one it holds.
  uint64 revision = 1;
  // The whole queue, same wire shape as `GetWorkQueueResponse.work_queue_json`.
  string work_queue_json = 2;
  WorkQueueSummary summary = 3;
}

message StreamWorkQueueStatusRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
}

message WorkQueueStatusView {
  repeated WorkItemStatus items = 1;
  // Why the queue's GitHub state could not be read at all (no inbox, no credential); empty otherwise.
  string unavailable_reason = 2;
  // `#workqueue` 13/14: the armed schedules with their conditions, re-evaluated on every update.
  repeated ScheduleStatusView schedules = 3;
}

// One item's PR (by branch, or the assigned PR) and, when it has one, its checks at the head.
message WorkItemStatus {
  string item_id = 1;
  PrStatusView pr = 2;
  bool has_checks = 3;
  uint32 checks_running = 4;
  uint32 checks_failed = 5;
  uint32 checks_succeeded = 6;
  // Each check run at the PR's head, for the row's expanded list — the shape of
  // `worktree.PullRequestCheck`, so the web renders it with the session PR tab's `CheckRow`.
  repeated WorkItemCheck checks = 7;
  // `#workqueue` 10/14: the item's wave (1 = needs nothing); 0 when the queue's edges close a cycle.
  uint32 wave = 8;
  // The unmet needs in the wave immediately below the item; empty when it is ready.
  repeated string binding_needs = 9;
  // `#workqueue` 12/14: commits of the item's PR that belong to a line ancestor, each naming the
  // nearest ancestor carrying it.
  repeated LeakView leaks = 10;
  // The item's PR against its line parent's tip; unset when the item owns no PR.
  LineStateView line = 11;
}

// One commit leaked from an ancestor PR.
message LeakView {
  string sha = 1;
  // The nearest line ancestor's branch whose PR carries the commit.
  string ancestor = 2;
}

// Whether an item contains its line parent's tip.
message LineStateView {
  // `linear`, `behind`, `conflicting` or `unknown` (the parent merged or planned, or no reading).
  string state = 1;
  // How many parent commits the item lacks (`behind`, `conflicting`).
  uint32 by = 2;
}

// One check run at a PR's head.
message WorkItemCheck {
  string name = 1;
  // `queued` / `in_progress` / `completed`.
  string status = 2;
  string conclusion = 3;
  string started_at = 4;
  string completed_at = 5;
  string details_url = 6;
}
// `#workqueue` 7/14 — work-item annotations.
message SetWorkItemLabelsRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  repeated string labels = 4;
}

message SetWorkItemBadgeRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  string key = 4;
  string text = 5;
  // `info` / `success` / `warning` / `danger`.
  string tone = 6;
}

message ClearWorkItemBadgeRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  string key = 4;
}

// Work item files — where the bytes of an attach come from.
//
// The staged arm is the web's: the browser uploaded the file to the staging host through
// `UploadStagedAttachmentChunk`, and the attach promotes the completed upload into the item's
// durable store (deleting the staged copy — consumed). The artifact and repo arms are the agent
// tool's: files the queue-owner host can already read without an upload. See
// docs/ft/coder/work-item-files.md.
message WorkQueueFileSource {
  oneof origin {
    session.StagedAttachmentRef staged = 1;
    // A path under the **queue owner's own session's** artifacts — the queue's id *is* the owner's
    // session id, so no other session's files are reachable through this arm.
    string artifact_relative_path = 2;
    // A path inside the project's main repository, as `PROJECT_REPO` names one.
    string repo_file_path = 3;
  }
}

message AttachWorkItemFileRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  // The name the file carries inside the item — exactly one path segment; the item's store is one
  // flat level deep. An existing same-named file is refused, never overwritten.
  string basename = 4;
  WorkQueueFileSource source = 5;
}

message DetachWorkItemFileRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  string basename = 4;
}

// `#workqueue` 9/14 — lineage.
message SetWorkQueueDependenciesRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  // The items whose behaviour `item_id` needs; replaces the stored list.
  repeated string needs = 4;
}

message GetWorkQueueGraphRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
}

// One item's line edge: what its branch hangs from.
message LineEdgeView {
  string item_id = 1;
  // "item" (`endpoint` is an item id), "trunk" or "external" (`endpoint` is a branch name).
  string kind = 2;
  string endpoint = 3;
}

// `to` needs `from`'s behaviour.
message DependencyEdgeView {
  string from = 1;
  string to = 2;
}

message WorkQueueGraphResponse {
  repeated LineEdgeView line_edges = 1;
  repeated DependencyEdgeView dependencies = 2;
  // Non-empty when the PR bases could not be read (the line edges are then the planned bases).
  string unavailable_reason = 3;
  // The branches of the GitHub stack the queue's items sit in, bottom first; empty when the
  // `gh stack` extension is missing or no item is in a stack.
  repeated string gh_stack_branches = 4;
}

// `#workqueue` 10/14 — waves.
message GetWorkQueueWavesRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
}

message WaveView {
  // 1-based.
  uint32 wave = 1;
  // The wave's items, blockers first, ties in queue order.
  repeated string item_ids = 2;
}

message ItemReadinessView {
  string item_id = 1;
  // The unmet needs in the wave immediately below the item; empty when it is ready.
  repeated string waits_on = 2;
}

message WorkQueueWavesResponse {
  repeated WaveView waves = 1;
  // The waves concatenated.
  repeated string derived_line = 2;
  repeated ItemReadinessView readiness = 3;
  // The first item that steps back a wave in the queue's current order; empty when in order.
  string out_of_order_at = 4;
}

// `#workqueue` 11/14 — commit inbox and outbox.
message GetWorkItemCommitFlowRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
}

// One commit an item is missing.
message InboxCommitView {
  string sha = 1;
  string subject = 2;
  // "item" (`source` is an item id), "trunk" or "external" (`source` is a branch name).
  string source_kind = 3;
  string source = 4;
  // The files bringing this commit into the item would conflict in; empty when it replays cleanly.
  repeated string conflict_files = 5;
}

message WorkItemInboxResponse {
  // Trunk and outside sources first, then items nearest first; oldest first within a source.
  repeated InboxCommitView commits = 1;
  // Non-empty when the line edges could not be read from GitHub (the planned bases stood in).
  string unavailable_reason = 2;
}

message OutboxCommitView {
  string sha = 1;
  string subject = 2;
}

// What one successor lacks of the item.
message OutboxSuccessorView {
  string successor = 1;
  repeated OutboxCommitView commits = 2;
}

message WorkItemOutboxResponse {
  repeated OutboxSuccessorView successors = 1;
  string unavailable_reason = 2;
}

// One item's counts, for its queue row. An item without a branch has no entry.
message ItemCommitCountsView {
  string item_id = 1;
  uint32 inbox_count = 2;
  uint32 outbox_count = 3;
  // Inbox commits predicted to conflict.
  uint32 conflict_count = 4;
}

message WorkQueueCommitCountsResponse {
  repeated ItemCommitCountsView items = 1;
  string unavailable_reason = 2;
}

// `#workqueue` 13/14 — armed merges and propagations.
message ScheduleWorkItemRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  // "merge" or "propagate".
  string kind = 4;
  // Merge only: go once CI is green without an approval — never past a change request.
  bool skip_review = 5;
}

message ScheduleWorkQueueWaveRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  // 1-based, as `GetWorkQueueWaves` numbers them.
  uint32 wave = 3;
  bool skip_review = 4;
}

message UnscheduleWorkItemRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
}

message ListWorkQueueSchedulesRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
}

// One condition of an armed schedule.
message ScheduleConditionView {
  string name = 1;
  // "met" | "waiting" | "blocked".
  string state = 2;
  string detail = 3;
}

message ScheduleStatusView {
  string item_id = 1;
  // "merge" | "propagate".
  string kind = 2;
  bool skip_review = 3;
  string armed_at = 4;
  string armed_by = 5;
  // The worst condition's state: "met" | "waiting" | "blocked".
  string status = 6;
  // The first blocked condition's name, else the first waiting one's; empty when all are met.
  string held_up_on = 7;
  repeated ScheduleConditionView conditions = 8;
}

message ScheduleWorkItemResponse {
  ScheduleStatusView schedule = 1;
}

message ListWorkQueueSchedulesResponse {
  repeated ScheduleStatusView schedules = 1;
  // Non-empty when the facts could not all be read (the conditions that needed them are `waiting`).
  string unavailable_reason = 2;
}

// `#workqueue` 14/14 — propagate and land.
message PropagateWorkItemRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  string item_id = 3;
  // Rebase although a conflict is predicted. Never overrides a dirty, unpushed, unpulled or diverged
  // local branch.
  bool force = 4;
}

message PropagateWorkItemResponse {
  bool propagated = 1;
  // The branch rebased onto.
  string onto = 2;
  uint32 commits_taken = 3;
  // Set when the propagation was refused: "local_branch" | "preflight" | "failed".
  string refusal_kind = 4;
  // "local_branch": the branch's state ("Dirty" | "Unpushed" | "Unpulled" | "Diverged" | "Unpublished").
  string refusal_state = 5;
  // "local_branch": what fixes it, in order ("commit", "pull", "push").
  repeated string refusal_actions = 6;
  // What a person reads, for every refusal.
  string refusal_detail = 7;
}

message LandWorkQueueRequest {
  string session_token = 1;
  WorkQueueAddress queue = 2;
  // 1-based, as `GetWorkQueueWaves` numbers them.
  uint32 from_wave = 3;
  uint32 to_wave = 4;
}

// One step of a land: every landed item in line order, then every propagation, then where it stopped.
message LandStepView {
  string item_id = 1;
  // "landed" | "propagated" | "stopped".
  string outcome = 2;
  // The merge commit, the branch rebased onto, or why the run stopped here.
  string detail = 3;
}

message LandWorkQueueResponse {
  repeated LandStepView steps = 1;
}
