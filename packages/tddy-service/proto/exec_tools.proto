syntax = "proto3";

package exec_tools;

// Executing a tool, and what has been executed.
//
// Split out of `the pre-unbundle monolithic RPC coordinate` by `#unbundle` node 8 — family L — and served from
// `tddy-tool-engine`.
//
// # This is where a duplication ends
//
// `tddy-tool-engine` already **defines** the ten tools and **executes** them. With this service it
// also serves them, so there is one catalog, one executor and one served coordinate. Until node 5
// there were three copies of the catalog — this crate's, a hand-written `RemoteToolDef` clone in
// `tddy-tools`, and a guard test in the daemon — kept in step by matched tests in both crates. Node 5
// collapsed the clone; node 8 deletes the guards as vacuous, because a test whose failure is
// impossible reads as coverage without being any.
//
// `ExecuteTool` is also the method named in `tddy-sandbox-runner`'s relay allowlist at `runner.rs:69`
// and in `tddy-sandbox-app`'s mirror guard, and the one `tddy-discovery` used to reach through a
// hand-built URL.

service ExecToolService {
  // Remote-codebase mode: execute a tool in a session worktree, or list available tools.
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  // Streaming twin of ExecuteTool, for a result past the transport's message-size budget. A `Read`
  // of a large file or a broad `Grep` crosses it on day one, and over LiveKit an oversized response
  // is chunk-framed with best-effort reassembly — one lost frame wedges the call with no error. The
  // frames here are bounded below that budget instead. Used by the split-placement tool path
  // (docs/ft/daemon/remote-managed-worktree.md); the unary call still serves stdio and HTTP.
  rpc StreamExecuteTool(ExecuteToolRequest) returns (stream ExecuteToolChunk);
  rpc ListExecTools(ListExecToolsRequest) returns (ListExecToolsResponse);
  rpc ListSessionToolCalls(ListSessionToolCallsRequest) returns (ListSessionToolCallsResponse);
  // The conversation-worktree operations that are not tool calls: hand a subagent conversation's
  // committed work to the session worktree, or delete the conversation's worktree and branch.
  // The worktree itself is created, used and committed in by `ExecuteTool` carrying a
  // `conversation_id` (docs/ft/coder/managed-codebase-subagents.md § The conversation worktree).
  rpc ConversationWorktree(ConversationWorktreeRequest) returns (ConversationWorktreeResponse);
}

// One frame of a StreamExecuteTool response. The result is the concatenation of every frame's
// `result_chunk`, in arrival order, decoded as the UTF-8 of the unary call's `result_json`.
message ExecuteToolChunk {
  // Next slice of the result. An empty result still yields exactly one frame, so a consumer never
  // has to distinguish "empty result" from "nothing arrived".
  bytes  result_chunk   = 1;
  // Outcome of the call, carried on the final frame only — a tool error is a result, not an RPC
  // failure, exactly as in unary ExecuteTool. Only routing failures terminate the stream.
  bool   is_error       = 2;
  string error_message  = 3;
  string job_id         = 4;
  bool   job_running    = 5;
  // Final-frame marker. A stream that ends without it was truncated, not completed.
  bool   last           = 6;
}

message ExecuteToolRequest {
  string session_token      = 1;
  string session_id         = 2;
  string tool_name          = 3;
  string args_json          = 4;
  string daemon_instance_id = 5;
  // The subagent conversation this call belongs to. Empty: the call runs in the session worktree,
  // exactly as before. Set: it runs in that conversation's own worktree — created by its first
  // mutating call — and a mutating call's result gains `worktreeChange`.
  string conversation_id    = 6;
}

message ConversationWorktreeRequest {
  string session_token      = 1;
  string session_id         = 2;
  string daemon_instance_id = 3;
  string conversation_id    = 4;
  oneof op {
    PullOp   pull   = 10;
    RemoveOp remove = 11;
    ResetOp  reset  = 12;
  }
}

// Hard-reset the conversation's worktree and branch to `commit` (a short hash on its branch), or
// to its base when `commit` is empty. Answers `{"reset": {to, droppedCommits}}`, or
// `{"reset": null}` when the conversation has no worktree.
message ResetOp {
  string commit = 1;
}

// Apply everything the conversation committed since its base to the session worktree as
// uncommitted changes, 3-way; conflicted hunks are written with markers.
message PullOp {}

// Delete the conversation's worktree, its branch and its base ref.
message RemoveOp {}

message ConversationWorktreeResponse {
  // The operation's answer: `{"pulled": {files, lines, conflicts} | null}` for `pull` (null when the
  // conversation never created a worktree), `{"removed": bool}` for `remove`,
  // `{"reset": {to, droppedCommits} | null}` for `reset`.
  string result_json = 1;
}

message ExecuteToolResponse {
  string result_json    = 1;
  bool   is_error       = 2;
  string error_message  = 3;
  string job_id         = 4;
  bool   job_running    = 5;
}

message ListExecToolsRequest {
  string session_token      = 1;
  string daemon_instance_id = 2;
}

message ListExecToolsResponse {
  repeated ToolDef tools = 1;
}

message ListSessionToolCallsRequest {
  string session_token      = 1;
  string session_id         = 2;
  string daemon_instance_id = 3;
}

message ListSessionToolCallsResponse {
  repeated ToolCallInfo tool_calls = 1;
}

message ToolCallInfo {
  string task_id          = 1;
  string tool_name        = 2;
  string args_json        = 3;
  string result_json      = 4;
  bool   is_error         = 5;
  string error_message    = 6;
  bool   job_running      = 7;
  uint64 created_unix_ms  = 8;
}

message ToolDef {
  string name              = 1;
  string description       = 2;
  string input_schema_json = 3;
}
