syntax = "proto3";

// A bare, lower-snake package name, like every other proto in this tree (`worktree`, `host`).
package code_navigation;

// CodeNavigationService: go-to-definition, references and hover over a session's worktree, for the
// web's code pane.
//
// Every request names its worktree the way `worktree.WorktreeService` does — session token,
// project id, worktree path — and is authorised the same way: the token resolves to an OS user, the
// project to its main repo on this host, and the worktree path must appear in that repo's
// `git worktree list`. Only then is the request forwarded to the warm code-intelligence index
// (`code_index.CodeIndexService`), with the worktree as its workspace root.
//
// A daemon configured without an `index_daemon:` section answers every method with
// `FAILED_PRECONDITION` naming that section. There is no fallback to another language server.
service CodeNavigationService {
  // Where the symbol at a position is defined.
  rpc Definition(DefinitionRequest) returns (DefinitionResponse);

  // Every reference to the symbol at a position, its declaration included.
  rpc References(ReferencesRequest) returns (ReferencesResponse);

  // The hover text — signature and docs — of the symbol at a position.
  rpc Hover(HoverRequest) returns (HoverResponse);

  // The warm-up of a session's code index, for the session header's indexing indicator.
  //
  // Once a session's worktree exists the daemon starts `code_index.Warm` for it in the background
  // and keeps the latest progress per session. This stream opens with that latest progress (when
  // there is any), follows it, and ends after the message carrying `ready` or `error`. A session
  // nothing warmed — no `index_daemon:` section, or not a Rust worktree — ends with no message, so
  // no indicator shows. Warming never blocks the session: navigation answers whenever the index
  // can, and a failed warm is only reported here.
  rpc WatchCodeIndex(WatchCodeIndexRequest) returns (stream CodeIndexProgress);

  // Open a restructure plan file of the session's worktree as a plan: load it into the index's plan
  // store for that worktree (`code_index.LoadPlans`) and answer its operations, each with its
  // status and, when it can no longer run as written, why. Authorised like every other method; the
  // plan's path is `rel_path`, relative to the worktree.
  rpc OpenPlan(OpenPlanRequest) returns (PlanSnapshot);

  // A plan's operations as they change: opens with the current snapshot, then sends a new one
  // whenever an operation's status or staleness changes (`code_index.PlanStatus` /
  // `code_index.ListPlans` for the worktree). Runs until the client goes away.
  rpc WatchPlan(WatchPlanRequest) returns (stream PlanSnapshot);

  // Apply a plan through the warm index (`code_index.Apply`), sending each operation's outcome as it
  // lands and ending with the run's outcome. A run is refused while another run holds the worktree
  // — the index daemon's per-root queue — and a group that does not compile ends the stream with a
  // `failure` naming it, its operations rolled back.
  rpc RunPlan(RunPlanRequest) returns (stream PlanRunEvent);
}

message WatchCodeIndexRequest {
  string session_token = 1;
  // The session whose worktree's index to follow.
  string session_id    = 2;
}

// `code_index.IndexProgress` as the session header reads it, plus the reason a warm failed.
message CodeIndexProgress {
  // The index's own one-line account of what it is doing.
  string line       = 1;
  // The language server's progress phase, e.g. "Indexing" or "Loading".
  string phase      = 2;
  uint32 percentage = 3;
  // The highest percentage seen in any phase.
  string furthest   = 4;
  // True on the last message of a warm that finished: the index is loaded and queryable.
  bool   ready      = 5;
  // Set on the last message of a warm that failed: why. The session itself is unaffected.
  string error      = 6;
}

// One-based line, one-based column counted in bytes — the coordinates `code_index` speaks.
message SourcePosition {
  uint32 line   = 1;
  uint32 column = 2;
}

message SourceRange {
  SourcePosition start = 1;
  SourcePosition end   = 2;
}

message DefinitionRequest {
  string         session_token = 1;
  string         project_id    = 2;
  // The session's worktree root, as `worktree.WorktreeService` names it.
  string         worktree_path = 3;
  // The file the position is in, relative to `worktree_path`.
  string         rel_path      = 4;
  SourcePosition position      = 5;
}

message DefinitionResponse {
  repeated CodeLocation locations = 1;
}

message ReferencesRequest {
  string         session_token = 1;
  string         project_id    = 2;
  string         worktree_path = 3;
  string         rel_path      = 4;
  SourcePosition position      = 5;
}

message ReferencesResponse {
  repeated CodeLocation locations = 1;
}

message HoverRequest {
  string         session_token = 1;
  string         project_id    = 2;
  string         worktree_path = 3;
  string         rel_path      = 4;
  SourcePosition position      = 5;
}

message HoverResponse {
  // The hover markdown; unset when there is nothing to say about the position.
  optional string markdown = 1;
}

// A place in the worktree a navigation answer points at.
message CodeLocation {
  // Relative to the worktree root when the location is inside it; the absolute path otherwise.
  string      rel_path         = 1;
  SourceRange range            = 2;
  // True when the location lies outside the worktree — a dependency or the standard library — so
  // the pane, which can only open the worktree's files, does not offer to open it.
  bool        outside_worktree = 3;
}

// ---------------------------------------------------------------------------------------------
// Restructure plans

message OpenPlanRequest {
  string session_token = 1;
  string project_id    = 2;
  string worktree_path = 3;
  // The plan file, relative to `worktree_path`.
  string rel_path      = 4;
}

message WatchPlanRequest {
  string session_token = 1;
  string project_id    = 2;
  string worktree_path = 3;
  string rel_path      = 4;
}

message RunPlanRequest {
  string session_token = 1;
  string project_id    = 2;
  string worktree_path = 3;
  string rel_path      = 4;
}

// A plan as the dialog shows it: every operation, in plan order.
message PlanSnapshot {
  // The plan file, relative to the worktree.
  string                 rel_path   = 1;
  repeated PlanOperation operations = 2;
}

// Where an operation's journal says it is.
enum PlanOperationStatus {
  PLAN_OPERATION_STATUS_UNSPECIFIED = 0;
  PLAN_OPERATION_STATUS_PENDING     = 1;
  PLAN_OPERATION_STATUS_IN_FLIGHT   = 2;
  PLAN_OPERATION_STATUS_APPLIED     = 3;
  PLAN_OPERATION_STATUS_FAILED      = 4;
  // Applied as part of a group that did not compile, and restored with the rest of that group.
  PLAN_OPERATION_STATUS_ROLLED_BACK = 5;
}

// One operation of a plan.
message PlanOperation {
  // The operation's stable id in its plan — what rows, events and staleness are keyed by.
  string              id           = 1;
  // Its position in the plan, zero-based.
  uint32              index        = 2;
  // The operation kind as the plan spells it, e.g. `rename_symbol`.
  string              op           = 3;
  // The item or symbol path the operation's anchor names; empty for a range anchor.
  string              item         = 4;
  // The file the operation's anchor is in, relative to the worktree.
  string              file         = 5;
  // The transactional group the operation belongs to; empty when it stands alone.
  string              group        = 6;
  PlanOperationStatus status       = 7;
  // Why the operation can no longer run as written — `item changed`, `item not found in <file>`,
  // `edited by <plan>#<op>` — as the plan store words it; empty while it still points at its code.
  string              stale_reason = 8;
}

// What happened while a plan ran. Exactly one field is set.
message PlanRunEvent {
  oneof event {
    PlanOperationApplied operation = 1;
    // A consequence an operation could not avoid, reported rather than left in the diff.
    string               note      = 2;
    // The terminal event of a run that finished.
    PlanRunOutcome       outcome   = 3;
    // The terminal event of a run that stopped on an error.
    PlanRunFailure       failure   = 4;
  }
}

message PlanOperationApplied {
  // The operation's stable id — the row it turns applied.
  string          op_id = 1;
  uint32          index = 2;
  // How many operations the run has finished, of `total`.
  uint32          done  = 3;
  uint32          total = 4;
  repeated string files = 5;
}

message PlanRunOutcome {
  uint32 applied = 1;
  uint32 total   = 2;
}

message PlanRunFailure {
  // The index's account of why the run stopped.
  string          message     = 1;
  // The group that did not compile, when that is why; empty otherwise.
  string          group       = 2;
  // The operations restored with that group, by id.
  repeated string rolled_back = 3;
}
