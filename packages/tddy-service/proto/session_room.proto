syntax = "proto3";

package session_room;

// SessionRoomService: the LiveKit integration's own way into a session.
//
// Registered by the LiveKit plugin, and absent from a daemon that has none wired. `ConnectSession`
// is local work and never waits on LiveKit for a caller that did not arrive over it; a client that
// is about to join a session's room — a `tddy-session-sync` mirror, a `tddy-tools pty-relay
// --livekit-url` — asks here first, so the facilitating daemon is already in the room it joins.
// See `docs/ft/daemon/session-room.md`.
service SessionRoomService {
  // Open the session's room (or reuse the one already open) with this daemon in it and the
  // session's terminal exposed to the room. Fails, naming the room, when LiveKit cannot be reached:
  // a caller that asked for a room and has none must hear about it rather than be handed
  // coordinates nothing is serving.
  rpc OpenSessionRoom(OpenSessionRoomRequest) returns (OpenSessionRoomResponse);
}

message OpenSessionRoomRequest {
  // Daemon access token, gated exactly like every other daemon RPC.
  string session_token = 1;
  string session_id = 2;
}

message OpenSessionRoomResponse {
  // `session-{session_id}`.
  string livekit_room = 1;
  // The URL a client joins the room at (`public_url` when configured, else `url`).
  string livekit_url = 2;
  // `daemon-{instance_id}`: the participant serving the session in that room.
  string livekit_server_identity = 3;
}
