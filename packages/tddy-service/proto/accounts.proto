syntax = "proto3";

package accounts;

// Accounts: what a person can see and curate in the daemon's credential store.
//
// The first surface over the vault `#keyring` 3/9 introduced. Three methods, and deliberately no
// fourth: this service **shows and curates** what exists, it never links an account. Each
// provider's link flow is its own work — GitHub's is 8/9, screen-sharing's is 7/9 — because each
// one is an authorization dance with its own failure modes, and folding them in here would make
// this service the place every provider integration lands.
//
// Imports nothing. Its messages are reached by no other service.

service AccountsService {
  // Every account in the caller's vault, grouped by provider.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // Rename one account. The label is the only mutable field.
  rpc SetAccountLabel(SetAccountLabelRequest) returns (SetAccountLabelResponse);
  // Forget one account's credential.
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);
}

// One linked account, as a person sees it.
//
// **There is no secret field here, and no method returns one.** `#keyring` 3/9 made "no store API
// returns a secret to an RPC response path" a boundary, and this service is the most plausible
// place to cross it — so the boundary is enforced by the message shape rather than by discipline.
// `has_secret` is the one bit a screen needs to distinguish a linked account from a stale row, and
// one bit is not a credential.
message AccountSummary {
  // Which service this authenticates against — "github", "cloudflare", "screen-sharing". Open
  // rather than an enum: a new provider must not be a breaking change to every reader.
  string provider = 1;
  // Stable identity of the account within its provider. **Never changes**, which is what lets
  // `#keyring` 5/9 assign it to a project and survive a rename.
  string account_id = 2;
  // What a human calls this account. The only mutable field.
  string label = 3;
  // The provider's own identifier for the account, for display beside the label — a GitHub login,
  // a Cloudflare account id. Read from the record's metadata; never a credential.
  string subject = 4;
  // When the record was last written, as seconds since the Unix epoch.
  int64 updated_at = 5;
  // Whether a usable credential is present. One bit, not the secret.
  bool has_secret = 6;
  // Where this account stands with the peers this deployment propagates credentials to
  // (`#keyring` 6/9) — the single worst answer across every peer, not a per-peer breakdown.
  // `SYNC_STATUS_UNSPECIFIED` means nothing has synced it yet: no peer is configured to receive
  // credentials, or none has been admitted. That is not the same as every peer having
  // acknowledged it, which is `SYNC_STATUS_SYNCED`.
  SyncStatus sync_status = 7;
}

// One account's aggregate standing across every peer it has been offered to, worst first: a
// refusal means this deployment is misconfigured and nobody will fix it without being told; a
// conflict means two edits raced; undeliverable is the network, and often clears on its own;
// pending is ordinary mid-flight state; synced is every peer that has been told having
// acknowledged.
enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_STATUS_SYNCED = 1;
  SYNC_STATUS_PENDING = 2;
  SYNC_STATUS_UNDELIVERABLE = 3;
  SYNC_STATUS_CONFLICT = 4;
  SYNC_STATUS_REFUSED = 5;
}

// One provider's accounts.
//
// Grouping is in the response rather than left to the client because the screen groups by provider
// and the store's own ordering is by `(provider, account)` — reconstructing the grouping in
// TypeScript would be a second implementation of an order the daemon already has.
message ProviderAccounts {
  string provider = 1;
  repeated AccountSummary accounts = 2;
}

message ListAccountsRequest {
  string session_token = 1;
}

// What the caller's vault holds, or the fact that it is not open or does not exist yet.
//
// **`vault_locked` and `vault_uninitialized` are fields and not errors, and an empty list is
// neither.** The four outcomes a screen must not render identically are: the vault is open and
// holds nothing (`providers` empty, both flags false), no vault exists yet
// (`vault_uninitialized` true — choosing a passphrase creates one), a vault exists and is not
// unlocked on this daemon (`vault_locked` true — its passphrase opens it), and an I/O or corruption
// failure (an RPC error carrying the reason). Collapsing a closed or absent vault into an empty
// list would present a recoverable, explainable state as a normal empty one, and the person would
// re-link accounts they already have instead of unlocking the vault that holds them.
message ListAccountsResponse {
  repeated ProviderAccounts providers = 1;
  // A vault exists and is not unlocked on this daemon — it restarted, or nothing has opened it
  // since. Its passphrase opens it, and nothing in it is lost. `providers` is empty and says
  // nothing about what the vault holds.
  bool vault_locked = 2;
  // No vault exists for the caller yet; choosing a passphrase creates one. `providers` is empty
  // because there is nothing to hold accounts, not because a vault holds none.
  bool vault_uninitialized = 3;
}

message SetAccountLabelRequest {
  string session_token = 1;
  string provider = 2;
  string account_id = 3;
  string label = 4;
}

message SetAccountLabelResponse {
  // The account as it now stands. Carries `account_id` unchanged — a rename that moved the
  // identity would silently break `#keyring` 5/9's project assignments.
  AccountSummary account = 1;
}

message RemoveAccountRequest {
  string session_token = 1;
  string provider = 2;
  string account_id = 3;
}

message RemoveAccountResponse {
  // What remains, grouped exactly as `ListAccounts` returns it, so a screen does not have to
  // re-read to redraw.
  repeated ProviderAccounts providers = 1;
}
