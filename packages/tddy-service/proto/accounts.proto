syntax = "proto3";

package accounts;

// Accounts: what a person can see and curate in the daemon's credential store, and how another
// account joins it.
//
// The first surface over the vault `#keyring` 3/9 introduced. The first three methods **show and
// curate** what exists; the last two add a credential, and they are here rather than on
// `auth.AuthService` for the reason this whole node exists: **linking is not signing in**.
// Completing `auth.ExchangeCode` *is* becoming that person, so running it again to add a second
// account signs the first one out. The two flows are separated by which service they live on, and
// by these messages having no field to return a session in.
//
// One provider's dance is implemented behind `BeginLinkAccount`; each new provider is its own work,
// because each is an authorization dance with its own failure modes. Screen-sharing (7/9) needs
// none of this — its credential is a password a person types, not an authorization to obtain.
//
// Imports nothing. Its messages are reached by no other service.

service AccountsService {
  // Every account in the caller's vault, grouped by provider.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // Rename one account. The label is the only mutable field.
  rpc SetAccountLabel(SetAccountLabelRequest) returns (SetAccountLabelResponse);
  // Forget one account's credential. Refuses the one the caller's session was established with.
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);
  // Begin adding another account at a provider. Mints no session and returns no token.
  rpc BeginLinkAccount(BeginLinkAccountRequest) returns (BeginLinkAccountResponse);
  // Ask where a link attempt stands. Mints no session and returns no token.
  rpc PollLinkAccount(PollLinkAccountRequest) returns (PollLinkAccountResponse);
}

// One linked account, as a person sees it.
//
// **There is no secret field here, and no method returns one.** `#keyring` 3/9 made "no store API
// returns a secret to an RPC response path" a boundary, and this service is the most plausible
// place to cross it — so the boundary is enforced by the message shape rather than by discipline.
// `has_secret` is the one bit a screen needs to distinguish a linked account from a stale row, and
// one bit is not a credential.
message AccountSummary {
  // Which service this authenticates against — "github", "cloudflare", "screen-sharing". Open
  // rather than an enum: a new provider must not be a breaking change to every reader.
  string provider = 1;
  // Stable identity of the account within its provider. **Never changes**, which is what lets
  // `#keyring` 5/9 assign it to a project and survive a rename.
  string account_id = 2;
  // What a human calls this account. The only mutable field.
  string label = 3;
  // The provider's own identifier for the account, for display beside the label — a GitHub login,
  // a Cloudflare account id. Read from the record's metadata; never a credential.
  string subject = 4;
  // When the record was last written, as seconds since the Unix epoch.
  int64 updated_at = 5;
  // Whether a usable credential is present. One bit, not the secret.
  bool has_secret = 6;
}

// One provider's accounts.
//
// Grouping is in the response rather than left to the client because the screen groups by provider
// and the store's own ordering is by `(provider, account)` — reconstructing the grouping in
// TypeScript would be a second implementation of an order the daemon already has.
message ProviderAccounts {
  string provider = 1;
  repeated AccountSummary accounts = 2;
}

message ListAccountsRequest {
  string session_token = 1;
}

// What the caller's vault holds, or the fact that it will not open.
//
// **`vault_locked` is a field and not an error, and an empty list is not a locked vault.** The
// three outcomes a screen must not render identically are: the vault opened and holds nothing
// (`providers` empty, `vault_locked` false), the login credential changed so the key no longer
// unwraps (`vault_locked` true), and an I/O or corruption failure (an RPC error carrying the
// reason). Collapsing the locked case into an empty list would present a recoverable, explainable
// failure as a normal empty state, and the person would re-link accounts they already have instead
// of understanding what happened.
message ListAccountsResponse {
  repeated ProviderAccounts providers = 1;
  // The vault exists and this session's key does not open it. `providers` is empty and says
  // nothing about what the vault holds.
  bool vault_locked = 2;
  // Which of the listed accounts the caller's session was established with — the one
  // `RemoveAccount` refuses to forget. Unset when the session belongs to no linked account, which
  // is ordinary: a daemon configured with a server-side credential has one, and every account it
  // holds is removable.
  optional SessionAccount session_account = 3;
}

message SetAccountLabelRequest {
  string session_token = 1;
  string provider = 2;
  string account_id = 3;
  string label = 4;
}

message SetAccountLabelResponse {
  // The account as it now stands. Carries `account_id` unchanged — a rename that moved the
  // identity would silently break `#keyring` 5/9's project assignments.
  AccountSummary account = 1;
}

message RemoveAccountRequest {
  string session_token = 1;
  string provider = 2;
  string account_id = 3;
}

message RemoveAccountResponse {
  // What remains, grouped exactly as `ListAccounts` returns it, so a screen does not have to
  // re-read to redraw.
  repeated ProviderAccounts providers = 1;
}

// Which account the caller's session was established with.
//
// A separate message rather than a flag on `AccountSummary`, because it is a fact about the
// **caller**, not about the account: the same record is the session's on one daemon and an ordinary
// linked account on another after `#keyring` 6/9 propagates it. Putting the bit on the row would
// make the row's meaning depend on who read it.
message SessionAccount {
  string provider = 1;
  string account_id = 2;
}

// Why a link attempt is where it is.
//
// Five states and no boolean, because four of them need different words in front of a person and
// two of them are ordinary progress. `LINK_VAULT_LOCKED` is held apart from `LINK_DENIED` on
// purpose: GitHub refusing the authorization and this daemon being unable to store the result are
// unrelated failures, and only one of them is about the operator's own decision.
enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  // The operator has not approved yet. Poll again after `interval_seconds`.
  LINK_PENDING = 1;
  // Approved and retained. `account` carries the record as it now stands.
  LINK_LINKED = 2;
  // The operator refused at the provider. The attempt is over; it must not be retried silently.
  LINK_DENIED = 3;
  // The device code outlived its window. Begin a new attempt.
  LINK_EXPIRED = 4;
  // Approval succeeded and there is nowhere to put the result: this session's key does not open
  // the vault. Recoverable, and nothing to do with the operator's answer at the provider.
  LINK_VAULT_LOCKED = 5;
}

message BeginLinkAccountRequest {
  string session_token = 1;
  // Which service to link an account at — "github" today. Open for the same reason
  // `AccountSummary.provider` is.
  string provider = 2;
}

// What the operator is shown, and the handle the next poll uses.
//
// **There is no token of any kind here, and none in `PollLinkAccountResponse` either.** Linking a
// credential is not signing in, and the message shape is what enforces it: the flow that adds an
// account has no field to hand back a session with. See the `#keyring` 8/9 changeset — a link that
// silently re-identified the caller is the defect this node exists to prevent.
message BeginLinkAccountResponse {
  // This daemon's handle on the attempt. Not the provider's device code, which is never shown and
  // never leaves the daemon.
  string link_id = 1;
  // The short code the operator types at the provider.
  string user_code = 2;
  // Where they type it.
  string verification_uri = 3;
  int64 expires_in_seconds = 4;
  // The provider's *minimum* seconds between polls. Carried rather than hard-coded, because
  // polling faster than this earns a slow-down.
  int64 interval_seconds = 5;
}

message PollLinkAccountRequest {
  string session_token = 1;
  string link_id = 2;
}

message PollLinkAccountResponse {
  LinkState state = 1;
  // The account, set only when `state` is `LINK_LINKED`. The same shape `ListAccounts` returns,
  // and with the same absence of a secret field.
  AccountSummary account = 2;
  // The interval to wait before the next poll. Set on `LINK_PENDING`, and widened when the
  // provider said the last one was too soon.
  int64 interval_seconds = 3;
}
