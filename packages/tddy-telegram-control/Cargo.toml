[package]
name = "tddy-telegram-control"
version = "0.1.0"
edition = "2021"
description = "The Telegram control plane: inbound session control, the session watcher, and Telegram's notification and presenter-event sinks"

[lib]
name = "tddy_telegram_control"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# The Telegram Bot API client: `telegram_bot`'s long-polling dispatcher. Outside the transport in
# `tddy-telegram`, its other user is `tddy-daemon`'s `runtime.rs`, which builds the `Bot`.
teloxide = { version = "0.17.0", features = ["macros", "rustls"], default-features = false }
tddy-core = { path = "../tddy-core" }
# `PresenterEventSink`, the port `TelegramDaemonHooks` implements. (`DaemonConfig` is the kernel's
# too, but this crate names it through `tddy_session_lifecycle::config`, which re-exports it.)
tddy-daemon-kernel = { path = "../tddy-daemon-kernel" }
# `SessionRooms`: Delete closes a session's room through the port.
tddy-daemon-extensions = { path = "../tddy-daemon-extensions" }
# `GithubCli`: a Local gh project's Telegram start asks the host's `gh` who it acts as. Already in
# this crate's graph through `tddy-session-lifecycle`.
tddy-host-service = { path = "../tddy-host-service" }
tddy-service = { path = "../tddy-service" }
# `TelegramNotificationSubscriber` is a subscriber of this crate's bus.
tddy-session-activity = { path = "../tddy-session-activity" }
tddy-spawn = { path = "../tddy-spawn" }
# The two crates this one sits between. `tddy-telegram` is the transport and the chat-side state
# (`TelegramSender`, the elicitation lease, the tracked-session gate); `tddy-session-lifecycle` is
# the session machinery the control plane drives. It cannot live in either: `tddy-telegram` does
# not depend on `tddy-session-lifecycle`, which depends on it.
# `Status`/`Code`: a Telegram start tells the exposure port's "nothing wired" (`FailedPrecondition`)
# from a real failure. Already in this crate's graph through `tddy-daemon-extensions`.
tddy-rpc = { path = "../tddy-rpc" }
tddy-telegram = { path = "../tddy-telegram" }
tddy-session-lifecycle = { path = "../tddy-session-lifecycle" }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tddy-github = { path = "../tddy-github" }
tddy-projects = { path = "../tddy-projects" }
tddy-testing-commons = { path = "../tddy-testing-commons" }
