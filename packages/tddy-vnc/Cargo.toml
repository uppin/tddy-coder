[package]
name = "tddy-vnc"
version = "0.1.0"
edition = "2021"
description = "VNC-to-LiveKit bridge: framebuffer streaming + remote-control input forwarding for tddy sessions"

[lib]
name = "tddy_vnc"
path = "src/lib.rs"

[[bin]]
name = "tddy-vnc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }

# VNC RFB client
vnc-rs = { git = "https://github.com/HsuJv/vnc-rs.git", branch = "main" }

# VNC sign-in: VeNCrypt TLSPlain (TLS) and Apple Remote Desktop (DH + AES-128 + MD5)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
num-bigint = "0.4"
aes = "0.8"
md-5 = "0.10"
# VNC Authentication: the challenge response is the challenge DES-encrypted with the password
des = "0.9"

# Workspace deps
tddy-screenshare = { path = "../tddy-screenshare" }

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
qrcode = "0.14"
image = "0.25"
rqrr = "0.10"
rcgen = "0.13"
tddy-screenshare = { path = "../tddy-screenshare" }
