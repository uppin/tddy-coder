[package]
name = "tddy-tools"
version = "0.1.0"
edition = "2021"
description = "Generic tool calling handler for tddy-coder: CLI relay (submit, ask) + MCP server"

[lib]
name = "tddy_tools"
path = "src/lib.rs"

[[bin]]
name = "tddy-tools"
path = "src/main.rs"

# Test fixture: hosts a fake connection.ConnectionService/ExecuteTool handler over its own
# stdin/stdout. Exercised by tests/session_tool_stdio_rpc_dispatch.rs. Its dependencies
# (tddy-rpc, tddy-stdio, async-trait) must live in [dependencies], not [dev-dependencies]: this
# is a real [[bin]] target built under plain `cargo build`/`cargo clippy`, which don't pull in
# dev-dependencies the way `cargo test` does (see the same note in tddy-stdio/Cargo.toml).
[[bin]]
name = "execute-tool-stdio-fixture"
path = "tests/fixtures/execute_tool_fixture.rs"

[dependencies]
tddy-rpc = { path = "../tddy-rpc" }
tddy-stdio = { path = "../tddy-stdio" }
tddy-terminal-rpc = { path = "../tddy-terminal-rpc" }
async-trait = "0.1"
tddy-core = { path = "../tddy-core" }
tddy-discovery = { path = "../tddy-discovery" }
tddy-sandbox = { path = "../tddy-sandbox" }
uuid = { version = "1", features = ["v4"] }
# The `build`/`build-list` dispatch lives in tddy-bsp, which owns the one plugin registry — so the
# six `tddy-build*` crates are its dependencies, not this one's.
tddy-bsp = { path = "../tddy-bsp" }
tddy-code-analysis = { path = "../tddy-code-analysis" }
tddy-code-restructuring = { path = "../tddy-code-restructuring" }
# The `Lsp*` MCP tool catalog: owned by the crate that answers the calls.
tddy-lsp-executor = { path = "../tddy-lsp-executor" }
# The one exec-tool catalog. The crate that dispatches Read/Write/Shell/… also defines them; this
# crate only puts them in MCP shape.
tddy-tool-engine = { path = "../tddy-tool-engine" }
tddy-workflow-recipes = { path = "../tddy-workflow-recipes" }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rmcp = { version = "1", features = ["server", "transport-io", "schemars", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
# daemon-rpc: Connect-protocol RPC client used by session-hook (default-on).
tddy-service = { path = "../tddy-service" }
# Reaching this session's daemon: transport detection and tool dispatch over the sandbox socket,
# daemon HTTP or LiveKit RPC. Its `livekit` feature is off by default and turned on by this crate's.
tddy-session-tool-client = { path = "../tddy-session-tool-client" }
prost = { version = "0.13" }
# Relay dispatch: HTTP forwarding for dispatch_dynamic_tool.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
# On by default: `--mcp` dispatch for a split session (agent on one host, worktree on another)
# reaches the remote daemon over LiveKit RPC, so a shipped tddy-tools must carry the SDK. A build
# that only ever talks stdio (in-jail) can drop it with --no-default-features.
default = ["livekit"]
# No `dep:` entries left: this crate names no LiveKit type of its own since `pty_relay`'s relay
# moved to tddy-terminal-rpc, `session_tool_client` to tddy-session-tool-client and the roster to
# tddy-discovery. What the feature does now is turn the SDK on in the three crates that do the
# connecting — `tddy-discovery`'s roster reaches the facilitating daemon over the same LiveKit
# room the tool client does, so leaving it out would serve a split session a roster it cannot
# follow.
livekit = [
    "tddy-terminal-rpc/livekit",
    "tddy-session-tool-client/livekit",
    "tddy-discovery/livekit",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
serial_test = "3"
tempfile = "3"
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tddy-testing-commons = { path = "../tddy-testing-commons" }
# Relay integration: `start_toolcall_listener` + CLI subprocess (`submit_relay_no_poll`).
tddy-core = { path = "../tddy-core" }
# subagent_mcp_acceptance.rs: mocks the FastContext /v1/chat/completions endpoint.
wiremock = "0.6"
# subagent_status_wait_acceptance.rs: `#[tokio::test(start_paused = true)]`, so a wait's deadline
# and the frame that beats it are ordered by virtual time rather than by a real sleep whose length
# the test would have to guess.
tokio = { version = "1", features = ["full", "test-util"] }
