[package]
name = "tddy-coding-agent-specs"
version = "0.1.0"
edition = "2021"
description = "Coding agents as declared tools: the embedded agent specs, the coding_agent extension and its slot renderers"

[lib]
name = "tddy_coding_agent_specs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tddy-actions = { path = "../tddy-actions" }
# `NO_AGENT_SESSION_TYPE`: the one session type no tool file declares, re-exported beside the
# declared ones.
tddy-workflow = { path = "../tddy-workflow" }
# `HookCommandParams` and `build_claude_hooks_settings`: the hook protocol stays in Rust, and the
# `claude-settings-local` adapter names it.
tddy-agent-backend = { path = "../tddy-agent-backend" }
# The usage binding model and its agent-agnostic evaluation (`#usage-binding`).
tddy-usage = { path = "../tddy-usage" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
# `spec_context_globs_acceptance`: every declared glob must compile in the matcher that reads it.
glob = "0.3"
