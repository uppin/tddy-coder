# OpenAI Codex over the Agent Client Protocol — Zed's `codex-acp`, behind a `codex-acp` coding
# subagent and the `codex-acp` workflow backend (`tddy-coder --agent codex-acp`)
# (`#agent-tools 11/12`).
#
# `codex-acp` ships beside `codex`: its binary is `codex-acp` in the directory of the resolved
# `codex` dep (`binary.sibling_of`), so a `<tddyhome>/tools/codex.yaml` override that moves `codex`
# moves `codex-acp` with it. `TDDY_CODEX_ACP_CLI` still names it outright. A `codex-acp` absent
# beside `codex` is refused, naming both — the `PATH` is not searched.
#
# The command renders what the launcher and `CodexAcpBackend` build by hand:
#   codex-acp [ROUTE ARGS]
# The route's arguments take `-c key=value` overrides; its `-m <model>` reaches `codex-acp` as
# `-c model="<model>"` (`toml_route_overrides`) until route compatibility becomes spec data
# (`#agent-tools 12/12`). Its key travels in the environment.
#
# An auth-like `session/new` error runs `codex login` (the `codex` dep's binary) and retries once:
# the `codex-acp-login` hooks adapter.
#
# Codex offers sandbox modes only, no tool withdrawal: `tool_deny` is `unsupported`, so a managed
# session refuses `codex-acp` by name.
#
# Override whole with `<tddyhome>/tools/codex-acp.yaml`.
#
# No `network:` section: ACP agents are not jailed, and `Egress` does not deserialize yet
# (`#agent-tools 3/12`).
schema_version: 1
id: codex-acp
summary: OpenAI Codex over ACP (codex-acp) — a coding subagent and workflow backend
binary:
  command: codex-acp
  env: TDDY_CODEX_ACP_CLI
  sibling_of: codex
deps: [codex, tddy-tools]
reads: []
# ACP agents launch from `coding_agent.acp.command`; `run:` names the transport.
run:
  transport: acp
  argv:
    - "{binary}"
  env: {}
extensions:
  coding_agent:
    pass_env: [OPENAI_API_KEY]
    product: Codex
    mcp: { kind: acp-session }
    tool_allow: unsupported
    tool_deny: unsupported
    permission_prompt: unsupported
    instructions:
      files: []
    hooks: { adapter: unsupported }
    # What a session of this agent offers (`#agent-tools 12/12`): the gates read these, never the
    # agent's name. Unknown words are refused at load.
    capabilities: []
    # Which providers a route can point the agent at, and how it reaches it (`#agent-tools 12/12`).
    route:
      providers: [openai_responses]
      shape: toml_args
      # The variable the key is handed in; the route names it as the provider's `env_key`. Never a
      # `TDDY_*` name: the agent process sees no tddy route variable.
      key_env: CODEX_PROVIDER_KEY
    models:
      default: gpt-5
      curated: [gpt-5]
    context_globs: [AGENTS.md, ".agents/**", ".codex/**"]
    # Where this agent's token usage lives and how to read it (`#usage-binding 4/5`). Codex writes
    # one rollout file per thread under `~/.codex/sessions/YYYY/MM/DD/`; its first line
    # (`session_meta`) names the thread, its `cwd`, and — for a spawned thread — `parent_thread_id`.
    # `token_count` events carry cumulative totals in which cached input is part of input and
    # reasoning part of output, so the mapping subtracts them to keep the counters disjoint.
    usage:
      sources:
        - format: jsonl
          main:
            path: "{agent_home}/.codex/sessions/*/*/*/rollout-*.jsonl"
            match: { field: payload.cwd, equals: "{worktree}" }
          identity: { id: payload.id, parent: payload.parent_thread_id }
          children_by: parent_field
          record:
            where: [{ field: payload.type, equals: token_count }]
            aggregate: last
            model: payload.model
            tokens:
              input: "payload.info.total_token_usage.input_tokens - payload.info.total_token_usage.cached_input_tokens"
              cache_read: payload.info.total_token_usage.cached_input_tokens
              cache_write: payload.info.total_token_usage.cache_write_input_tokens
              output: "payload.info.total_token_usage.output_tokens - payload.info.total_token_usage.reasoning_output_tokens"
              reasoning: payload.info.total_token_usage.reasoning_output_tokens
    placements: [host]
    acp:
      command:
        - "{binary}"
        - { splice: route_args }
      env: {}
      hooks_adapter: codex-acp-login
