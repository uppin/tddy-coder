# Claude Code CLI — the interactive coding agent behind `claude-cli` sessions (`#agent-tools 2/12`).
#
# The argv renders byte-for-byte what the launch built by hand before:
#   claude [--model M] (--resume|--session-id) ID (--dangerously-skip-permissions|--permission-mode P)
#          <slot flags> [PROMPT]
# Slot flags go before the prompt: `--mcp-config` is variadic and would swallow a bare positional.
#
# Override whole with `<tddyhome>/tools/claude.yaml`. `TDDY_CLAUDE_BINARY` (and, until
# `#agent-tools 12/12`, daemon.yaml `claude_cli.binary_path`) still names the binary.
schema_version: 1
id: claude
summary: Claude Code CLI — the interactive coding agent behind claude-cli sessions
binary:
  command: claude
  env: TDDY_CLAUDE_BINARY
deps: [tddy-tools]
reads: []
run:
  transport: pty
  argv:
    - "{binary}"
    - { if: model, then: ["--model", "{model}"] }
    - { if: resume, then: ["--resume", "{session_id}"], else: ["--session-id", "{session_id}"] }
    - if: dangerously_skip_permissions
      then: ["--dangerously-skip-permissions"]
      else: ["--permission-mode", "{permission_mode}"]
    - { splice: slots }
    - { if: prompt, then: ["{prompt}"] }
  env: {}
extensions:
  coding_agent:
    mcp: { kind: file, flag: --mcp-config, format: claude-mcp-json }
    tool_allow: { flag: --allowedTools }
    tool_deny: { flag: --disallowedTools }
    permission_prompt: { flag: --permission-prompt-tool }
    instructions:
      files: [CLAUDE.md, AGENTS.md]
      append_system_prompt: { flag: --append-system-prompt-file }
    hooks: { adapter: claude-settings-local }
    # What a session of this agent offers (`#agent-tools 12/12`): the gates read these, never the
    # agent's name. Unknown words are refused at load.
    capabilities: [hooks, ask_user_question, split_host, project_home_main, requires_model, branch_name_required, operator_notify]
    models:
      default: opus
      curated: [opus, sonnet, haiku, claude-opus-5, claude-sonnet-5, claude-haiku-4-5-20251001]
    context_globs: [AGENTS.md, ".agents/**", CLAUDE.md, ".claude/**", .mcp.json]
    # --- Headless (`#agent-tools 6/12`): one `claude -p` per turn, for the workflow backend
    # (`tddy-coder --agent claude`) and a headless coding subagent. It renders byte-for-byte what
    # `build_claude_args` and `headless_driver/argv.rs::claude()` built by hand:
    #   claude -p PROMPT --output-format stream-json --verbose [--permission-mode P] [--model M]
    #          [(--resume|--session-id) ID] <slot flags>
    # The output is read by the `claude-stream-json` adapter (`tddy_agent_backend::adapters`).
    headless:
      argv:
        - "{binary}"
        - -p
        - "{prompt}"
        - --output-format
        - stream-json
        - --verbose
        - { if: permission_mode, then: ["--permission-mode", "{permission_mode}"] }
        - { if: model, then: ["--model", "{model}"] }
        - if: session_id
          then:
            - { if: resume, then: ["--resume", "{session_id}"], else: ["--session-id", "{session_id}"] }
        - { splice: slots }
      env: {}
      adapter: claude-stream-json
      # `claude -p` can exit 1 after an ExitPlanMode despite a complete structured result.
      exit_ok_if_structured: true
    # --- Variants (`#agent-tools 10/12`): the same agent, launched differently. ------------------
    # `host_agent` is the agent a split session runs on this host against a codebase that lives on
    # another daemon or in a jail. `--strict-mcp-config` loads only the `--mcp-config` the launch
    # names, so a checkout's `.mcp.json` cannot register a server that runs unconfined here;
    # `--setting-sources user` drops the checkout's `.claude/settings.json`, whose hooks would run
    # here too. Its native filesystem and shell tools are withdrawn through `tool_deny`: on this host
    # they would reach this host's disk, not the codebase's.
    variants:
      host_agent:
        args: [--strict-mcp-config, --setting-sources, user]
        withdraw_native: [Read, Write, Edit, MultiEdit, NotebookEdit, Bash, BashOutput, KillShell, Glob, Grep, LS]
# --- Jail sections (`#agent-tools 5/12`): what a sandboxed launch lowers into the jail. ----------
# A persistent home at <tddyhome>/homes/claude, mounted rw: refreshed OAuth tokens, history and
# settings survive the session. Replaces <tddyhome>/sandbox-claude-home, migrated once in place.
home: { kind: persistent, key: claude }
files:
  # Seeded once: the jail may since have refreshed its own token, which the host's must not clobber.
  - { kind: seed-once, from_host: .claude/.credentials.json, to: .claude/.credentials.json }
  # Claude's startup self-check looks for its own install under $HOME.
  - { kind: mirror, from_host: .local/bin/claude, to: .local/bin/claude }
  - { kind: mirror, from_host: .local/share/claude/versions, to: .local/share/claude/versions }
  - { kind: overlay, env: CLAUDE_CODE_TMPDIR, value: "{tmp}" }
  - { kind: overlay, env: CLAUDE_TMPDIR, value: "{tmp}" }
secrets:
  # Claude's own vendor login; a provider route brings its own credentials instead.
  - env: CLAUDE_CODE_OAUTH_TOKEN
    source: { kind: host-env, var: CLAUDE_CODE_OAUTH_TOKEN }
    when: unrouted
# An interactive Node/V8 CLI: JIT, fork, sysctl reads, and the system directories it shells into.
policy:
  jit: true
  fork: true
  sysctl_read: true
  exec_paths: [/usr/bin, /usr/libexec, /bin, /sbin, /System, /Library, /Applications, /opt/homebrew, /opt/local]
# The Anthropic API, telemetry and the OAuth login. A provider route's base-URL host is added by the
# launcher; `oauth_inbound` admits the login's loopback callback (unrouted sessions only).
#
# TODO(claude-jail): uncomment when the jail launcher lands. Until `Egress` deserializes
# (`#agent-tools 3/12`), a `network:` section here would make every load of this file — the
# unsandboxed launch's included — panic, so it stays a comment at contract stage.
# network:
#   egress:
#     hosts: [api.anthropic.com, statsig.anthropic.com, sentry.io, console.anthropic.com, claude.ai]
#   oauth_inbound: true
