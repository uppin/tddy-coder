# OpenAI Codex CLI — the headless coding agent behind the `codex` workflow backend
# (`tddy-coder --agent codex`) and a headless `codex` coding subagent (`#agent-tools 9/12`).
#
# The headless argv renders byte-for-byte what `build_codex_exec_argv` built by hand:
#   codex exec [<mcp -c overrides>] -C DIR -s SANDBOX --json [resume] [ROUTE ARGS | -m M] [THREAD] PROMPT
# `exec`-level options (`-C`, `-s`, `--json`) must come before `resume`, which takes only its own
# (`-m`). `sandbox_mode` is the turn's param — `read-only` for a read-only planning goal; a turn
# that binds none runs `workspace-write`. On a provider account the route's argv (`-c
# model_provider…`, `-m …`) takes the model's place; its key travels in the environment.
#
# A headless conversation's argv (`headless_driver/argv.rs::codex()`) put `-m` before `--json`; the
# template puts it after, as the backend does — same meaning, one order.
#
# Codex reads no MCP config file: the tool server is handed inline as `-c mcp_servers.<name>.*`,
# its environment named (`env_vars`), never valued, so the credential stays off the argv.
#
# Codex cannot withdraw its native tools: the tool slots are `unsupported`, and a managed launch
# that asks it to is refused by name (docs/dev/todo/2026-10-25-headless-cursor-codex-oz-cannot-withdraw-native-tools.md).
#
# Codex runs only headless here: `run:` is the bare CLI, which no session type launches.
#
# Override whole with `<tddyhome>/tools/codex.yaml`. `TDDY_CODEX_CLI` (and `--codex-cli-path`)
# still names the binary.
#
# TODO(headless-others): a `network:` section (api.openai.com, auth.openai.com) once `Egress`
# deserializes (`#agent-tools 3/12`) and Codex is jailed (`#agent-tools 10/12`).
schema_version: 1
id: codex
summary: OpenAI Codex CLI — the headless coding agent behind the codex workflow backend
binary:
  command: codex
  env: TDDY_CODEX_CLI
deps: [tddy-tools]
reads: []
run:
  transport: pty
  argv:
    - "{binary}"
  env: {}
extensions:
  # The session type a session of this agent is started and recorded as, and its launch. Declared
  # here, never derived from the id: a stored `.session.yaml` names it.
  session:
    session_type: codex-cli
    launch: agent_cli
    label: Codex
  coding_agent:
    pass_env: [OPENAI_API_KEY]
    product: Codex
    mcp: { kind: inline, flag: -c, key_prefix: mcp_servers }
    tool_allow: unsupported
    tool_deny: unsupported
    permission_prompt: unsupported
    instructions:
      files: [AGENTS.md]
    hooks: { adapter: unsupported }
    # What a session of this agent offers (`#agent-tools 12/12`): the gates read these, never the
    # agent's name. Unknown words are refused at load.
    capabilities: []
    # Which providers a route can point the agent at, and how it reaches it (`#agent-tools 12/12`).
    route:
      providers: [openai_responses]
      shape: toml_args
      # The variable the key is handed in; the route names it as the provider's `env_key`. Never a
      # `TDDY_*` name: the agent process sees no tddy route variable.
      key_env: CODEX_PROVIDER_KEY
    models:
      default: gpt-5.3-codex
      curated: [gpt-5.3-codex]
    context_globs: [AGENTS.md, ".agents/**", ".codex/**"]
    # Where this agent's token usage lives and how to read it (`#usage-binding 4/5`). Codex writes
    # one rollout file per thread under `~/.codex/sessions/YYYY/MM/DD/`; its first line
    # (`session_meta`) names the thread, its `cwd`, and — for a spawned thread — `parent_thread_id`.
    # `token_count` events carry cumulative totals in which cached input is part of input and
    # reasoning part of output, so the mapping subtracts them to keep the counters disjoint.
    usage:
      sources:
        - format: jsonl
          main:
            path: "{agent_home}/.codex/sessions/*/*/*/rollout-*.jsonl"
            match: { field: payload.cwd, equals: "{worktree}" }
          identity: { id: payload.id, parent: payload.parent_thread_id }
          children_by: parent_field
          record:
            where: [{ field: payload.type, equals: token_count }]
            aggregate: last
            model: payload.model
            tokens:
              input: "payload.info.total_token_usage.input_tokens - payload.info.total_token_usage.cached_input_tokens"
              cache_read: payload.info.total_token_usage.cached_input_tokens
              cache_write: payload.info.total_token_usage.cache_write_input_tokens
              output: "payload.info.total_token_usage.output_tokens - payload.info.total_token_usage.reasoning_output_tokens"
              reasoning: payload.info.total_token_usage.reasoning_output_tokens
    headless:
      argv:
        - "{binary}"
        - exec
        - { splice: slots }
        - -C
        - "{workdir}"
        - { if: sandbox_mode, then: [-s, "{sandbox_mode}"], else: [-s, workspace-write] }
        - --json
        - { if: resume, then: [resume] }
        - { splice: route_args }
        - { if: model, then: [-m, "{model}"] }
        - { if: resume, then: ["{session_id}"] }
        - "{prompt}"
      # Codex's OAuth capture: `codex login` opens its authorize URL through `$BROWSER`, which is
      # this executable, and the pre-main hook writes the URL to `TDDY_CODEX_OAUTH_OUT`. Values are
      # rendered by the backend's `render_env` (and by `HeadlessDriver`, which reads the same `env`).
      #
      # TODO(headless-driver): `TDDY_CODEX_OAUTH_OUT` is the one `TDDY_*` variable a headless agent
      # still sees; it belongs to the Codex OAuth follow-up stack —
      # docs/dev/todo/2026-11-05-codex-oauth-out-env-in-headless-agent.md
      env:
        BROWSER: "{self_exe}"
        TDDY_CODEX_OAUTH_OUT: "{session_dir}/codex_oauth_authorize.url"
      adapter: codex-jsonl
      # Who answers a headless conversation's permission requests (`#agent-tools 27/28`): the CLI
      # cannot ask mid-turn, so it runs under this fixed policy, shown on its catalog row.
      permission_policy: { fixed: "workspace-write sandbox; the CLI cannot ask mid-turn" }
      # A non-zero exit with a non-empty parsed result counts as success, as the backend tolerates
      # it for a planning goal today.
      exit_ok_if_structured: true
      # --- The workflow turn's protocol (`#agent-tools 15/19`), read by `SpecHeadlessBackend`:
      # what a `tddy-coder` workflow turn needs beyond the argv, reproducing the bespoke backend.
      # No tool server is registered: a `tddy-tools` codex runs from its shell finds the session
      # through `.tddy/session.json` in its working directory.
      system_prompt: prepend
      goal_params:
        read_only_plan: { sandbox_mode: read-only }
      route_model: { kind: replaced }
      fresh_session: agent
      scratch: session_dir
    placements: [host]
