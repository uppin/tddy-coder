[package]
name = "tddy-task"
version = "0.1.0"
edition = "2021"
description = "Long-running background Task abstraction — model, registry, cancellation, I/O channels"

[lib]
name = "tddy_task"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
# The screen model behind `TerminalCapture::snapshot`: `Vt::dump()` reproduces both buffers, the
# alternate screen, scroll region, saved cursor and charsets as one repaint.
avt = "0.18"
bytes = "1"
log = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serial_test = "3"
# An independent reference emulator: a snapshot is checked by rendering it in a VT that is not the
# one that produced it.
vt100 = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "process"] }
