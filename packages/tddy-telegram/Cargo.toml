[package]
name = "tddy-telegram"
version = "0.1.0"
edition = "2021"
description = "Telegram session control, notifications and elicitation, extracted from tddy-daemon"

[lib]
name = "tddy_telegram"
path = "src/lib.rs"

[dependencies]
tddy-rpc = { path = "../tddy-rpc" }
tddy-core = { path = "../tddy-core" }
tddy-daemon-kernel = { path = "../tddy-daemon-kernel" }
thiserror = "2"

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
