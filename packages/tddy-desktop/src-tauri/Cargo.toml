[package]
name = "tddy-desktop"
version = "0.1.0"
edition = "2021"
description = "Tddy Desktop — a Tauri application hosting tddy-daemon in its own process"

[lib]
name = "tddy_desktop"
path = "src/lib.rs"

[[bin]]
name = "tddy-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens external http(s) links in the operator's browser instead of inside the webview.
tauri-plugin-opener = "2"
# The daemon this application is a host for: one process, one service roster.
tddy-daemon = { path = "../../tddy-daemon" }
tddy-rpc = { path = "../../tddy-rpc" }
tddy-tauri-rpc = { path = "../../tddy-tauri-rpc" }
tddy-core = { path = "../../tddy-core" }
# "signal" only: the runtime itself is Tauri's (`tauri::async_runtime`), which is tokio.
tokio = { version = "1", features = ["signal"] }
anyhow = "1"
log = "0.4"
libc = "0.2"

# E2E only, never in a shipped bundle. The plugin runs a WebDriver server *inside* the app, which
# is how `@wdio/tauri-service`'s `embedded` provider drives it on macOS (Apple ships no WebDriver
# for WKWebView, so an external `tauri-driver` is Windows/Linux only). A WebDriver server is a
# listening socket that can drive the UI and invoke commands — strictly worse than the HTTP port
# this app exists to remove — so it is behind a feature rather than a runtime check: a release
# build cannot contain it, and `cargo tree` proves that rather than a code review.
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[features]
# Build the app with an embedded WebDriver server for the WebdriverIO e2e suite:
#   cargo build -p tddy-desktop --features wdio
wdio = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# Already a workspace dependency; no new crate enters the tree.
rstest = { workspace = true }
