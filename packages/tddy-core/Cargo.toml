[package]
name = "tddy-core"
version = "0.1.0"
edition = "2021"
description = "Core library for tddy-coder: re-exports the crates its code was carved into"

[dependencies]
# The vocabulary crate: the session artifact layout is re-exported at this crate's root.
tddy-workflow = { path = "../tddy-workflow" }
# The storage layer: `atomic_file`, `error` and `output`, re-exported at their old paths. It
# depends on no crate that depends on `tddy-core`.
tddy-session-store = { path = "../tddy-session-store" }
# `ssh_exec`, re-exported at its old path. Depends on no workspace crate.
tddy-git = { path = "../tddy-git" }
# The groups carved out of this crate, each re-exported whole at its old paths. None depends on
# `tddy-core`.
tddy-log = { path = "../tddy-log" }
tddy-agent-skills = { path = "../tddy-agent-skills" }
tddy-changeset = { path = "../tddy-changeset" }
tddy-session-worktree = { path = "../tddy-session-worktree" }
tddy-session-actions = { path = "../tddy-session-actions" }
tddy-toolcall = { path = "../tddy-toolcall" }
tddy-agent-backend = { path = "../tddy-agent-backend" }
tddy-workflow-engine = { path = "../tddy-workflow-engine" }
tddy-presenter = { path = "../tddy-presenter" }
