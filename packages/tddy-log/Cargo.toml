[package]
name = "tddy-log"
version = "0.1.0"
edition = "2021"
description = "The tddy log sink: config-driven log policies and outputs, and stdio-safe log routing"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = { version = "0.4", features = ["serde"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rstest = { workspace = true }
serde_yaml = "0.9"
tempfile = "3"
