[package]
name = "tddy-session-worktree"
version = "0.1.0"
edition = "2021"
description = "A session's git worktree: setup and reuse, integration and chain bases, and base sync"

[dependencies]
log = "0.4"
tddy-changeset = { path = "../tddy-changeset" }
# `WorkflowError`, which every worktree operation reports through.
tddy-session-store = { path = "../tddy-session-store" }
# The `git` plumbing the worktree is built on. Depends on no workspace crate.
tddy-git = { path = "../tddy-git" }

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
# `work_queue_fixtures`: the sessions layout a PR stack lives in.
tddy-changeset = { path = "../tddy-changeset", features = ["test-support"] }
tempfile = "3"
tddy-remote-shell = { path = "../tddy-remote-shell", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
tddy-workflow = { path = "../tddy-workflow" }
