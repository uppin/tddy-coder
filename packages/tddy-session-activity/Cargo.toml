[package]
name = "tddy-session-activity"
version = "0.1.0"
edition = "2021"
description = "Agent activity, session status, notifications and ACP transcript replay — activity.ActivityService. Extracted from tddy-daemon"

[lib]
name = "tddy_session_activity"
path = "src/lib.rs"

[dependencies]
tddy-core = { path = "../tddy-core" }
tddy-daemon-kernel = { path = "../tddy-daemon-kernel" }
tddy-rpc = { path = "../tddy-rpc" }
thiserror = "2"

[dev-dependencies]
rstest = { workspace = true }
pretty_assertions = { workspace = true }
