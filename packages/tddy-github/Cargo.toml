[package]
name = "tddy-github"
version = "0.1.0"
edition = "2021"
description = "GitHub OAuth provider with stub for testing"

[lib]
name = "tddy_github"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
hmac = "0.12"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tddy-core = { path = "../tddy-core" }
tddy-rpc = { path = "../tddy-rpc" }
tddy-service = { path = "../tddy-service" }
# github_pr.rs stages the REST request body in a temp file for `curl --data-binary`.
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# A local stand-in for GitHub. The device flow and `exchange_code` are pure HTTP conversations, and
# nothing about their error handling is reachable while the hostnames are literals inside the
# request builders. Dev-only, and already this workspace's HTTP server in five other crates.
axum = "0.8"
prost = "0.13"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros"] }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
