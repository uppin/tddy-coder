[package]
name = "tddy-github-inbox"
version = "0.1.0"
edition = "2021"
description = "The daemon's GitHub inbox: one conditional feed per repository, cached rows with ETags, invalidations, single-flight reads and kind-filtered subscriptions."

[dependencies]
async-trait = "0.1"
log = "0.4"
serde_json = "1"
tddy-github = { path = "../tddy-github" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
