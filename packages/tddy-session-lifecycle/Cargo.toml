[package]
name = "tddy-session-lifecycle"
version = "0.1.0"
edition = "2021"
description = "Session lifecycle RPC host and modules extracted from tddy-daemon"

[lib]
name = "tddy_session_lifecycle"
path = "src/lib.rs"

[features]
local-model = ["tddy-semantic-index/local-model"]

[dependencies]
anyhow = "1"
tempfile = "3"
base64 = "0.22"
glob = "0.3"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync", "net", "time", "signal", "process", "io-util"] }
bytes = "1"
tonic = { version = "0.12", default-features = false, features = ["transport"] }
livekit = "0.7"
prost = "0.13"
tddy-coder = { path = "../tddy-coder" }
tddy-core = { path = "../tddy-core" }
# The symbols every daemon subsystem shares — `AgentActivityHub`, `now_unix_ms`,
# `HOST_DOCUMENT_FRAME_BYTES`, the two session resolvers, `trim_to_option`. They live in their own
# crate because `pub(crate)` does not cross a crate boundary, so a subsystem leaving this crate
# could not otherwise reach them without depending on `connection_service`.
tddy-daemon-kernel = { path = "../tddy-daemon-kernel" }
# The moved model registry: `runtime.rs` opens the store and registers both of its services, and
# `connection_service` resolves registry assistants as `--agent` targets. `sqlx`,
# `agent-client-protocol` and `tddy-acp` left with it.
tddy-model-registry = { path = "../tddy-model-registry" }
tddy-bsp = { path = "../tddy-bsp" }
tddy-discovery = { path = "../tddy-discovery" }
tddy-demo-runner = { path = "../tddy-demo-runner" }
tddy-github = { path = "../tddy-github" }
tddy-workflow-recipes = { path = "../tddy-workflow-recipes" }
tddy-workflow = { path = "../tddy-workflow" }
tddy-livekit = { path = "../tddy-livekit" }
tddy-lsp = { path = "../tddy-lsp" }
tddy-lsp-executor = { path = "../tddy-lsp-executor" }
tddy-rpc = { path = "../tddy-rpc" }
tddy-stdio = { path = "../tddy-stdio" }
tddy-service = { path = "../tddy-service" }
# The mirror algorithm an agent clone runs in-process (docs/ft/daemon/session-worktree-sync.md).
# The same crate the standalone `tddy-session-sync` client is built from, used as a library: a
# second implementation of "restore from the WIP ref, apply a delta, notice a divergence" would be
# two mirrors that disagree, and the disagreement is silent.
tddy-session-sync = { path = "../tddy-session-sync" }
tddy-actions = { path = "../tddy-actions" }
tddy-task = { path = "../tddy-task" }
tddy-pty = { path = "../tddy-pty" }
tddy-terminal-rpc = { path = "../tddy-terminal-rpc" }
tddy-tool-engine = { path = "../tddy-tool-engine" }
tddy-semantic-index = { path = "../tddy-semantic-index" }
tokio-stream = "0.1"
tddy-vm = { path = "../tddy-vm" }
tddy-connectrpc = { path = "../tddy-connectrpc" }
tddy-sandbox = { path = "../tddy-sandbox" }
# The extracted sandbox subsystem: `sandbox_session`, `workspace_tool_sandbox`, `sandbox_action`,
# `sandbox_plan_builder` and `sandbox_runtime`. `tddy-sandbox-qemu` and `tddy-sandbox-darwin` left
# with them; the per-OS backends are reached only through this crate now.
tddy-daemon-sandbox = { path = "../tddy-daemon-sandbox" }
# The extracted spawn subsystem: `spawner`, `spawn_worker`, `supervisor_spawn` and
# `supervisor_client`. `tddy-supervisor` left with them — the daemon reaches the supervisor only
# through this crate now.
tddy-spawn = { path = "../tddy-spawn" }
tddy-sandbox-recipes = { path = "../tddy-sandbox-recipes" }
tddy-sandbox-runner = { path = "../tddy-sandbox-runner" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7"] }
teloxide = { version = "0.17.0", features = ["macros", "rustls"], default-features = false }

portable-pty = "0.9"
# `default = ["agent"]` is the *server* side — tokio, futures, async-trait, service-binding and
# a log facade we do not use. The blocking client and the protocol types are ungated.
# `encryption` (and the ed25519 support the fixtures use): an OpenSSH private key on disk is
# passphrase-protected, and unlocking one in process is the whole reason this daemon never needs a
# TTY or `SSH_ASKPASS`. Without the feature `PrivateKey::decrypt` does not exist and the passphrase
# would have to reach `ssh-add` as a subprocess, which is the design node 5 rejected.
# `host_keypair.rs`: the host's RSA keypair, and RSA-OAEP(SHA-256) decryption of an answer the
# browser encrypted with `SubtleCrypto`. Pinned — it is a cryptographic implementation, and a patch
# release changing key generation or padding behaviour is not something to pick up silently.
rsa = "=0.9.10"
# The moved host and worktree services. A runtime dependency, not a dev one: `runtime.rs` builds
# and registers both, and `session_reader` implements the worktree crate's session-listing port.
tddy-host-service = { path = "../tddy-host-service" }
tddy-worktree-service = { path = "../tddy-worktree-service" }
# The moved screen-sharing subsystem: `runtime.rs` builds its service and registers the entry it
# returns. `argon2`, `chacha20poly1305` and `rand` are the vault's, and left with it.
tddy-screen-sharing = { path = "../tddy-screen-sharing" }
# The moved telegram transport plus `active_elicitation`, `elicitation`,
# `telegram_tracked_session` and `telegram_github_link`. `hmac`, `sha2` and `subtle` are the
# OAuth-state signer's and left with it; `base64` stays, because `auth.rs` uses it too. `teloxide`
# also stays — the four modules that keep it here are on the blocked side of the cycle.
tddy-telegram = { path = "../tddy-telegram" }
# The moved auth subsystem: `runtime.rs` calls `build_auth_entries`, and the daemon re-exports the
# three of its seven modules that something here still names.
tddy-daemon-auth = { path = "../tddy-daemon-auth" }
tddy-daemon-livekit = { path = "../tddy-daemon-livekit" }
# The moved session-file-I/O subsystem: the ten modules `connection_service` and eight of its
# submodules read and write session files through. The edge runs this way round because none of the
# ten names `connection_service` — the coupling was always daemon → session files.
tddy-session-files = { path = "../tddy-session-files" }
# The session-notification bus, its subscriber trait and the stream subscriber `tddy-web` reads —
# `#unbundle` node 7. The daemon keeps the label resolution built on `session_list_enrichment`
# and its Telegram subscriber, and re-exports the rest through the same two module paths.
tddy-session-activity = { path = "../tddy-session-activity" }
# The session-agent roster, the agent-status mapping, its inference from ACP frames, and the clone
# store and mirror — `#unbundle` node 7. The daemon keeps `clone_worktree_path`, which resolves a
# checkout through `workspace_session`, and re-exports the rest through the same four module paths.
tddy-session-agents = { path = "../tddy-session-agents" }
tddy-projects = { path = "../tddy-projects" }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
tower = "0.5"
tokio-stream = "0.1"

[dev-dependencies]
assert_cmd = "2"
# The acceptance suites dispatch through the very client the in-jail MCP server uses, over the same
# in-jail socket, rather than re-implementing its wire format. `livekit` because this crate also
# exercises the split-session transport.
tddy-session-tool-client = { path = "../tddy-session-tool-client", features = ["livekit"] }
tddy-testing-commons = { path = "../tddy-testing-commons" }
# Dev-only since the spawn subsystem left: `supervisor_spawn_delegation.rs` builds a
# `SpawnSessionRequest` directly to pin what the daemon asks the supervisor for, and its two
# fail-closed tests mount `ConnectionServiceImpl`, so the suite stays with the service it exercises.
tddy-supervisor = { path = "../tddy-supervisor" }
tddy-github = { path = "../tddy-github" }
tddy-livekit-testkit = { path = "../tddy-livekit-testkit" }
livekit = "0.7"
serial_test = "3"
# Already workspace dependencies (see the root `[workspace.dependencies]`); no new crate enters
# the tree. Used by the remote-git acceptance suites for table-driven cases and readable diffs.
rstest = { workspace = true }
pretty_assertions = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
scopeguard = "1"

# Dev-only since the sandbox subsystem left: the four suites that stayed here mount a
# `ConnectionServiceImpl`, and each guards its jailed case on
# `unprivileged_userns_available()`. No daemon source reaches the per-OS backends any more —
# `tddy-daemon-sandbox` owns them, and `tddy-sandbox-darwin` and `tddy-sandbox-qemu` left outright.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tddy-sandbox-cgroups = { path = "../tddy-sandbox-cgroups" }
