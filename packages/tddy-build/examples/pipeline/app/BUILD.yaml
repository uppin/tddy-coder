schema_version: 1
targets:
  # The stamp tool is built, then used: this target installs it, and `tools:bin` names its output
  # as the tool's binary, so every action listing `tools:bin` builds this target first.
  - id: "tools:stamp-build"
    name: "Build the stamp tool"
    actions:
      - id: "install"
        type: command
        command: ["sh", "-c", "mkdir -p tools/out && cp tools/bin/stamp tools/out/stamp && chmod +x tools/out/stamp"]
        inputs:
          - include: ["tools/bin/stamp"]
            root: "."
        outputs:
          - path: "tools/out/stamp"
            kind: file
  - id: "tools:bin"
    name: "Tools"
    config:
      type: tool
      schema_version: 1
      id: stamp
      summary: stamps its stdin
      binary:
        command: stamp
        target: { target: "tools:stamp-build", path: tools/out/stamp }
  - id: "app:build"
    name: "Build app"
    deps: ["lib:build"]
    actions:
      - id: "package"
        type: command
        command: ["sh", "-c", "stamp < lib.txt > app.txt"]
        tool_dep_ids: ["tools:bin"]
        inputs:
          - include: ["lib.txt"]
            root: "."
        outputs:
          - path: "app.txt"
            kind: file
  - id: "pipeline:all"
    name: "Whole pipeline"
    config:
      type: group
      member_ids: ["codegen:gen", "lib:build", "app:build"]
