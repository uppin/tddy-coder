[package]
name = "tddy-remote-git-repo"
version = "0.1.0"
edition = "2021"
description = "Serve a tddy-daemon project as a git remote over LiveKit — git's GIT_SSH_COMMAND shim"

[lib]
name = "tddy_remote_git_repo"
path = "src/lib.rs"

[[bin]]
name = "tddy-remote-git-repo"
path = "src/main.rs"

[dependencies]
tddy-livekit = { path = "../tddy-livekit" }
tddy-service = { path = "../tddy-service" }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
prost = "0.13"
# The daemon's Connect-HTTP leg: RefreshSession and MintLiveKitToken are plain protobuf POSTs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest = { workspace = true }
