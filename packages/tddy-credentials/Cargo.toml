[package]
name = "tddy-credentials"
version = "0.1.0"
edition = "2021"
description = "Where a secret lives and what it takes to read one — a provider-extensible credential store, sealed at rest and openable only while a user session exists"

[lib]
name = "tddy_credentials"
path = "src/lib.rs"

[dependencies]
# AEAD over each record, with the record's identity as associated data. Already this workspace's
# authenticated cipher (tddy-screen-sharing), so the pattern is one a reviewer here has read before.
chacha20poly1305 = "0.10"
# Argon2id over the vault passphrase — the one key-encryption key a user holds. Already this
# workspace's password KDF (tddy-screen-sharing), at the same version.
argon2 = "0.5"
# HKDF-Extract/Expand for the unlock slots and record ids, hand-rolled in a dozen lines rather than
# taken as a dependency — `hkdf` would be tidier and needs CLAUDE.md § ASK approval first.
hmac = "0.12"
sha2 = "0.10"
# Constant-time comparison of the verifier, so a wrong key cannot be found a byte at a time.
subtle = "2.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
