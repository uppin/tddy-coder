[package]
name = "tddy-daemon-rpc"
version = "0.1.0"
edition = "2021"
description = "The daemon's RPC-family handlers, above the session lifecycle they call into"

# Sits ABOVE `tddy-session-lifecycle`: it depends on the lifecycle crate the way `tddy-daemon` does,
# and nothing below it may depend back — not even as a dev-dependency, which would build a second
# copy of the lifecycle crate into the tests and fail to unify its types. That one-way edge is what
# lets these handlers reach `tddy-daemon-sandbox`, `tddy-daemon-livekit` and `tddy-daemon-kernel`
# without closing the cycles a move into each family's domain crate would.

[dependencies]
tddy-session-lifecycle = { path = "../tddy-session-lifecycle" }
# The project-home tools list a project's sessions from the same `.session.yaml` store the ListSessions
# RPC reads, and start a workspace session through the split topic's start (`#project-home` 5/7).
tddy-session-activity = { path = "../tddy-session-activity" }
tddy-session-split = { path = "../tddy-session-split" }
tddy-core = { path = "../tddy-core" }
tddy-daemon-kernel = { path = "../tddy-daemon-kernel" }
tddy-daemon-sandbox = { path = "../tddy-daemon-sandbox" }
tddy-discovery = { path = "../tddy-discovery" }
tddy-credentials = { path = "../tddy-credentials" }
tddy-github = { path = "../tddy-github" }
# The generated `code_index` client `CodeNavigationServiceImpl` forwards through.
tddy-index-daemon = { path = "../tddy-index-daemon" }
# `Plan::parse`: the plan dialog's rows come from the plan file, which the index daemon's plan calls
# do not describe operation by operation.
tddy-code-restructuring = { path = "../tddy-code-restructuring" }
tddy-host-service = { path = "../tddy-host-service" }
tddy-model-registry = { path = "../tddy-model-registry" }
tddy-projects = { path = "../tddy-projects" }
tddy-rpc = { path = "../tddy-rpc" }
tddy-service = { path = "../tddy-service" }
tddy-spawn = { path = "../tddy-spawn" }
tddy-tool-engine = { path = "../tddy-tool-engine" }
tddy-worktree-service = { path = "../tddy-worktree-service" }
# The PR-stack family's bodies drive the stack recipe's plan mutations and its GitHub PR lookup.
tddy-workflow-recipes = { path = "../tddy-workflow-recipes" }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
# `ReceiverStream`, the type `code_navigation.WatchCodeIndex` streams its progress through.
tokio-stream = "0.1"
# `Channel`, the port's product; the version the daemon and the index daemon dial with.
tonic = { version = "0.12", default-features = false, features = ["transport"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The acceptance suites stand up the plugin's own peer and room wiring; dev edges are not counted by
# the LiveKit ratchet, which only bounds what the crate builds with.
tddy-daemon-livekit = { path = "../tddy-daemon-livekit" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
tempfile = "3"
# The catalogue suites that moved here with `CatalogRpcHandler` — the session-agent roster suites
# among them, which read an agent's id from `ListSubagents` — bring what they already used. All are
# existing workspace crates; nothing new enters the tree.
futures-util = "0.3"
pretty_assertions = { workspace = true }
# A language support standing in for an installed extension's names `tddy-lsp`'s `LanguageId` and
# `LaunchSpec` (`#reshape` extension-language-server, R7). Already in this crate's tree through
# `tddy-code-restructuring`; test-only.
tddy-lsp = { path = "../tddy-lsp" }
tddy-sandbox = { path = "../tddy-sandbox" }
tddy-sandbox-recipes = { path = "../tddy-sandbox-recipes" }
tddy-session-tool-client = { path = "../tddy-session-tool-client" }
# The exec-tool suites that moved here with `ExecToolRpcHandler` — the workspace-jail and seatbelt
# suites among them, and the session-room test that calls a tool through a room — bring what they
# already used. All are existing workspace crates; nothing new enters the tree.
libc = "0.2"
serial_test = "3"
serde_yaml = "0.9"
# The session-room suite wires the LiveKit plugin as the daemon does (status board for its reporter).
tddy-daemon-extensions = { path = "../tddy-daemon-extensions" }
tddy-livekit = { path = "../tddy-livekit" }
tddy-livekit-testkit = { path = "../tddy-livekit-testkit" }
# The session-room exec-tool suite joins a room with the SDK directly; `src/` never names it.
livekit = "0.7"
tddy-session-files = { path = "../tddy-session-files" }
tddy-testing-commons = { path = "../tddy-testing-commons" }
# `in_jail_conversation_acceptance` reads the jail's task registry; nothing in `src/` does.
tddy-task = { path = "../tddy-task" }
# The cross-daemon token and sandboxed-codebase suites give each daemon a signing identity of its
# own (`DaemonSigningKey`, `SessionTokens`). An existing workspace crate the lifecycle crate
# already depends on.
tddy-daemon-auth = { path = "../tddy-daemon-auth" }
