[package]
name = "tddy-terminal-rpc"
version = "0.1.0"
edition = "2021"
description = "Unified PTY-over-RPC bridge: TerminalSessionService proto, transport-agnostic streaming bridge, and local PTY relay — shared by tddy-daemon, tddy-coder, and tddy-tools"

[lib]
name = "tddy_terminal_rpc"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
log = "0.4"
prost = "0.13"
tddy-pty = { path = "../tddy-pty" }
tddy-rpc = { path = "../tddy-rpc" }
# `pty_relay` speaks `connection.ConnectionService` and `auth.AuthService` to attach a session's
# terminal from outside the daemon; the protos it encodes live in tddy-service.
tddy-service = { path = "../tddy-service" }
tddy-task = { path = "../tddy-task" }
# LiveKit dispatch mode (`pty-relay --server-identity` / `--daemon-identity`). Off by default so an
# in-jail build that only ever talks gRPC does not carry the SDK.
tddy-livekit = { path = "../tddy-livekit", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
tokio-stream = "0.1"
tonic = "0.12"
portable-pty = "0.9"
# `pty_relay`'s connectrpc client: unary POSTs plus one envelope-framed streaming read.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[features]
livekit = ["dep:tddy-livekit"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.13"
tddy-codegen = { path = "../tddy-codegen", features = ["tonic"] }
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
