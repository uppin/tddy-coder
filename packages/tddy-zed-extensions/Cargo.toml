[package]
name = "tddy-zed-extensions"
version = "0.1.0"
edition = "2021"
description = "Install, list and remove Zed editor extensions under <tddy data dir>/extensions, in Zed's installed layout"

[lib]
name = "tddy_zed_extensions"
path = "src/lib.rs"

# tddy-lsp's deterministic fake server, so the language-server suite starts a real process from the
# launch an extension language's settings give it (exposes CARGO_BIN_EXE_fake_lsp to this crate's
# tests). It compiles against `tddy_lsp::protocol` and `serde_json`, both dependencies here.
[[bin]]
name = "fake_lsp"
path = "../tddy-lsp/tests/bin/fake_lsp.rs"

[dependencies]
anyhow = "1"
# `default_tddy_data_dir`: the debug-build default the daemon resolves the tddy data dir from.
tddy-session-store = { path = "../tddy-session-store" }
clap = { version = "4", features = ["derive"] }
# The registry body is a `.tar.gz`: `flate2` (already in Cargo.lock) inflates it, `tar` (consented
# 2026-10-19) walks its entries so each one can be checked before it is written.
flate2 = "1"
tar = "0.4"
# Matches tddy-tools: rustls, no default features — no OpenSSL enters the tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The language-support interface an installed extension's languages implement (K11), and the item
# anchor traits their outline answers. No cycle: tddy-code-restructuring knows nothing of Zed.
tddy-code-restructuring = { path = "../tddy-code-restructuring" }
tddy-lsp = { path = "../tddy-lsp" }
thiserror = "2"
# `ExtensionVerify` blocks on the caller's runtime (`Handle::current`), as the restructuring
# backends do. Already a dev-dependency here and a dependency of tddy-lsp: no new crate enters the
# tree, and the lock file is unchanged.
tokio = { version = "1", features = ["rt"] }
# `extension.toml` and `languages/<x>/config.toml`; the version tddy-daemon-kernel already uses.
toml = "0.9"
# An installed extension's grammar is a `grammars/<name>.wasm`, loaded through tree-sitter's WASM
# loader (developer decision and consent, 2026-10-19). The `wasm` feature brings wasmtime through
# `wasmtime-c-api` (wasmtime 36 for tree-sitter 0.26.x) and re-exports it as
# `tree_sitter::wasmtime`, so no second wasmtime is declared here.
tree-sitter = { version = "0.26.13", features = ["wasm"] }

[features]
# `testkit`: the `demo-toml` fixture builders dependents' suites share. Std only; enabled from
# dev-dependencies, never by a production build.
testkit = []

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
# `TaskRegistry`, which the `LspRegistry` the language-server suite starts its server through takes.
# A workspace crate already under tddy-lsp, so nothing new enters the tree.
tddy-task = { path = "../tddy-task" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `CancellationToken`, which the static `check` entry point takes: already a dependency of
# tddy-code-restructuring at this version, so no new crate enters the tree.
tokio-util = "0.7"
# The fixture registry: already a dev-dependency of tddy-tools, so no new crate enters the tree.
# It matches the query parameters R4 requires, which a hand-rolled listener would have to parse.
wiremock = "0.6"
