[package]
name = "tddy-work-queue"
version = "0.1.0"
edition = "2021"
description = "The PR-stack data model and its git/GitHub operations"

[dependencies]
tddy-core = { path = "../tddy-core" }
tddy-git = { path = "../tddy-git" }
tddy-github = { path = "../tddy-github" }
# `docs::node_doc_paths` resolves the session artifacts root from it.
tddy-workflow = { path = "../tddy-workflow" }
# `rpc` holds the `work_queue.WorkQueueService` handler trait, adapter and transport entry.
tddy-rpc = { path = "../tddy-rpc" }
tddy-service = { path = "../tddy-service" }
log = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# `op_journal` persists the merge journal as JSON; `merge_repoint` names each journalled operation.
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `work_queue_fixtures`: the sessions layout a PR stack lives in.
tddy-changeset = { path = "../tddy-changeset", features = ["test-support"] }
tempfile = "3"
pretty_assertions = { workspace = true }
rstest = { workspace = true }
