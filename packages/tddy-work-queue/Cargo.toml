[package]
name = "tddy-work-queue"
version = "0.1.0"
edition = "2021"
description = "The PR-stack data model and its git/GitHub operations"

[dependencies]
tddy-core = { path = "../tddy-core" }
tddy-git = { path = "../tddy-git" }
tddy-github = { path = "../tddy-github" }
# `inbox_reads`: PR status, queue status and checks read through the daemon's GitHub inbox.
tddy-github-inbox = { path = "../tddy-github-inbox" }
tddy-session-worktree = { path = "../tddy-session-worktree" }
# `docs::node_doc_paths` resolves the session artifacts root from it.
tddy-workflow = { path = "../tddy-workflow" }
# `rpc` holds the `work_queue.WorkQueueService` handler trait, adapter and transport entry.
tddy-rpc = { path = "../tddy-rpc" }
tddy-service = { path = "../tddy-service" }
log = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# `op_journal` persists the merge journal as JSON; `engine` lands and propagates, the daemon journals each land.
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# `rpc::WorkQueueStatusStream`: the channel-backed stream the status RPC answers with.
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
# `work_queue_fixtures`: the sessions layout a PR stack lives in.
tddy-changeset = { path = "../tddy-changeset", features = ["test-support"] }
tempfile = "3"
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
