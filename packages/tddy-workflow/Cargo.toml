[package]
name = "tddy-workflow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Workflow artifact layout and manifest wiring (decouples tddy-core from fixed PRD paths)"

[dependencies]
# `#fs-port`: production disk I/O goes through the port.
tddy-fs = { path = "../tddy-fs" }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
rstest = { workspace = true }
pretty_assertions = { workspace = true }
