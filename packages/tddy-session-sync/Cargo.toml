[package]
name = "tddy-session-sync"
version = "0.1.0"
edition = "2021"
description = "Mirror a tddy session's worktree locally by watching its LiveKit room"

[lib]
name = "tddy_session_sync"
path = "src/lib.rs"

[dependencies]
# The library joins rooms through `tddy-room-client`; `tddy-session-sync-cli` wires LiveKit.
# `tddy-daemon-extensions`' ratchet holds the library to it.
tddy-rpc = { path = "../tddy-rpc" }
tddy-room-client = { path = "../tddy-room-client" }
# The RPC surface this binary dials, and `session_activity::NO_TICK` — the wire's "no poll tick has
# covered this call yet". Read from the crate that owns `activity.proto` rather than spelled as a
# literal here, so the daemon producing the ticks and this consumer cannot drift about which value
# means absence. This is a shipped standalone binary; the crate that *serves* the deltas carries a
# `livekit` and `teloxide` tree that has no business inside it.
tddy-service = { path = "../tddy-service" }
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
prost = "0.13"
# The daemon's Connect-HTTP leg, as tddy-remote-git-repo uses it: RefreshSession is a protobuf POST.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tddy-room-client = { path = "../tddy-room-client", features = ["test-support"] }
# `stub_http_routed`: a daemon stand-in that records which RPC path a call reached.
tddy-testing-commons = { path = "../tddy-testing-commons" }
tokio = { version = "1", features = ["macros", "rt"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = "3"
