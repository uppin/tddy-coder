[package]
name = "tddy-code-restructuring"
version = "0.1.0"
edition = "2021"
description = "Replays a JSONL plan of named Rust refactoring intents via rust-analyzer (through tddy-lsp)"

[lib]
name = "tddy_code_restructuring"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tddy-lsp = { path = "../tddy-lsp" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tddy-task = { path = "../tddy-task" }

[dev-dependencies]
tempfile = "3"
pretty_assertions = { workspace = true }
rstest = { workspace = true }
