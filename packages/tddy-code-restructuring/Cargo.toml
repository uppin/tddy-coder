[package]
name = "tddy-code-restructuring"
version = "0.1.0"
edition = "2021"
description = "Replays a JSONL plan of named Rust refactoring intents via rust-analyzer (through tddy-lsp)"

[lib]
name = "tddy_code_restructuring"
path = "src/lib.rs"

# Reuse tddy-lsp's deterministic fake server so the cancellation suites have a real binary to
# launch (exposes CARGO_BIN_EXE_fake_lsp to this crate's tests) without a real rust-analyzer. It
# compiles against `tddy_lsp::protocol`, which is a dependency here.
[[bin]]
name = "fake_lsp"
path = "../tddy-lsp/tests/bin/fake_lsp.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tddy-lsp = { path = "../tddy-lsp" }
# `signal` is what lets the CLI cancel its own run on `^C`: with no budget to expire, the
# operator interrupting the command is how a one-shot caller says it has stopped waiting.
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
tddy-task = { path = "../tddy-task" }
# `CancellationToken` — how a wait learns its caller is gone, now that no budget bounds it. Declared
# here rather than inherited: `tokio-util` is a per-crate dependency in this workspace, at 0.7 in
# every crate that has it.
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
# `rt-multi-thread` is what the live-rust-analyzer acceptance suites need and the library does not:
# the restructure backend is synchronous and reaches the shared LSP client through
# `Handle::current().block_on`, which only makes progress from a blocking thread while another
# thread drives the runtime. `tddy-lsp` carries the same dev-dependency for the same reason.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
