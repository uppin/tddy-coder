syntax = "proto3";

package tddy.workflow;

// pr-stack write-stack-plan goal output. JSON Schema: write-stack-plan.schema.json.
message WriteStackPlanOutput {
  string goal = 1;
  uint32 version = 2;
  // Optional markdown code-discovery map (path:line references) persisted to exploration.md.
  optional string exploration = 3;
  repeated PlannedPr prs = 4;
}

// One PR node of the stack DAG.
message PlannedPr {
  string node_id = 1;
  string title = 2;
  string description = 3;
  optional string branch_suggestion = 4;
  // node_id values this PR depends on; empty for a root PR off the stack base branch.
  repeated string parents = 5;
  // Workflow recipe for the child session (default: tdd).
  optional string child_recipe = 6;
}
