[package]
name = "tddy-workflow-recipes"
version = "0.1.0"
edition = "2021"
description = "Pluggable workflow recipes (TDD, bug-fix, …) for tddy-coder"

[build-dependencies]
serde_json = "1"

[dependencies]
# `#fs-port`: the filesystem port every disk read and write goes through.
tddy-fs = { path = "../tddy-fs" }
tddy-rpc = { path = "../tddy-rpc" }
tddy-core = { path = "../tddy-core" }
# The GitHub REST client lives in tddy-github; `github_pr` and `github_rest_common` are facades
# re-exporting it from their historical paths.
tddy-github = { path = "../tddy-github" }
tddy-workflow = { path = "../tddy-workflow" }
log = "0.4"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# schema.rs embeds generated/ and validates structured agent output against it.
include_dir = "0.7"
jsonschema = { version = "0.44", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "process", "sync"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
# `#fs-port`: the direct-disk-io guard and `MemFs` for this crate's tests.
tddy-fs = { path = "../tddy-fs", features = ["testing"] }
# The suites that exercise the stack operations and the merge journal over a session's stack.
tddy-work-queue = { path = "../tddy-work-queue" }
# `work_queue_fixtures`: the sessions layout a PR stack lives in.
tddy-changeset = { path = "../tddy-changeset", features = ["test-support"] }
serial_test = "3"
# Only the tests build worktrees and session dirs on disk now that github_pr.rs, which staged the
# REST request body in a temp file, lives in tddy-github.
tempfile = "3"
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tddy-testing-commons = { path = "../tddy-testing-commons" }
# The on-demand GitHub test stands up a session host on a unix socket, as `tddy-toolcall`'s own
# acceptance suite does, to count the requests a GitHub REST call makes of it.
tddy-stdio = { path = "../tddy-stdio" }
